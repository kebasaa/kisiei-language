name: Deploy guide-book

# Builds the MkDocs site and publishes it to the gh-pages branch.
# GitHub Pages is set to "Deploy from a branch": gh-pages, / (root).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Check translations
        run: python tools/check_i18n.py
      - name: Build lexicon (validate, regenerate dictionary and word-list pages)
        run: python tools/build_lexicon.py
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy guide-book from ${{ github.sha }}"
