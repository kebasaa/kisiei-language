- {lemma: bɔɔ, status: attested, pos: noun, class: o, plural: bɛ́ɛ̀lan, forms: [bɛ́ɛ̀], gloss: {fr: 'concession, cour', en: 'compound, courtyard'}, domains: [6.5.1, 4.6.7], keita: {form: Böö, page: 142}, paulme: {page: 8, form: 'bɛō, bɛwo, pl. bɛrã'}, lexique: {page: 8, form: bɔɔ}, childs: {page: 19, form: bíɔ̀ɔ́, sense: compound of a patrilineal lineage; yard around a house}, example: MAT.26.58, note: 'Dans la Bible, la cour se dit bɛ́ɛ̀ (forme radicale, Mt 26,58 ; Jr 32,2), pluriel bɛ́ɛ̀lan, comme bíɔ̀ɔ́ / bɛ́ɛ̀láŋ chez Childs. La forme pleine bɔɔ suit Keita ; dans la Bible, bɔɔ seul a surtout d''autres sens (grand, buisson). Paulme 1964, p. 8 : bɛō, bɛwo, pl. bɛrã « carré, cour » (bɛ̄ kama « la cour des Kamara »).'}
