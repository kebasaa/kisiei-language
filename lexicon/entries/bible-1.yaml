- {lemma: dɔvɔɔ, status: attested, pos: verb, forms: [dɔw, dɔaw, dɔawnin], gloss: {fr: 'bénir (… duaa) ; mettre dans, mettre sur, verser, remplir ; pondre (des œufs) ; soigner (un malade) ; donner (une maladie) ; payer (la dot) ; pondre', en: 'bless (… duaa); put in, put on, pour, fill; lay (eggs); treat (a sick person); give (an illness); pay (bride-price); lay (eggs)'}, domains: [4.9.5], paulme: {page: 21, form: dɔwɔ}, lexique: {page: 14, form: dɔvɔɔ/ dɔw}, example: GEN.1.22, note: 'Lexique kissi–français, p. 14 : dɔvɔɔ/dɔw « mettre dedans ; mettre sur ; verser ; remplir », « pondre les œufs » (aussi dɔwvo). Cf. dɔw … danga « mettre une malédiction sur » (GEN.3.17). Paulme 1964, p. 21 : dɔwɔ « verser (un liquide), soigner (un malade), donner une maladie » (i dɔw moya ɔ tale ni « je verse du vin de palme dans la calebasse ») ; p. 20-21 : dɔɔ « verser ; payer (la dot) » (dɔɔ malo ɔ mɛnda ni « mets le riz dans l''eau ») ; sɔɔ dɔ̄ « la poule a pondu ».'}
