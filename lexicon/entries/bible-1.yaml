- {lemma: bɛɛndian, status: attested, pos: verb, forms: [bɛɛndianndo], gloss: {fr: 'se préparer, s''apprêter ; s''habiller', en: get ready; dress oneself}, domains: ['7.5'], paulme: {page: 7, form: bɛndiã}, lexique: {page: 5, form: bɛndianndo/ bɛndian}, terminologie: {list: histoire, number: 251, form: 'Tyalle a köl, bèèndianndo'}, example: 1KI.20.12, note: 'Moyen de bɛɛndiaa « préparer ». Lexique kissi–français, p. 5 : bɛndianndo/ bɛndian « se préparer pour un voyage ; s''habiller, se préparer ». Paulme 1964, p. 7 : bɛndiã « être prêt » (la bɛndyã kora n sɔdī ni « soyez prêts pour partir demain »). Académie des langues (terminologie, histoire n° 251) : bɛɛndianndo « disposition » (aussi calle a kɔl).'}
