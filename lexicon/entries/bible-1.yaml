- {lemma: cuaa, status: attested, pos: noun, class: o, plural: cuavaa, forms: [cuawva], gloss: {fr: 'enfant ; la femme (dont on parle) ; (pl.) enfants, descendants ; fille (de qqn)', en: 'child; the woman (in question); (pl.) children, descendants; daughter'}, domains: [4.1.9, 2.6.5], paulme: {page: 107, form: 'tua, pl. twa'}, lexique: {page: 11, form: cua}, childs: {page: 60, form: cùàá, sense: 'girl, daughter, young woman, woman'}, example: GEN.3.15, note: 'Au singulier, la Bible emploie cuaa surtout pour « la femme » dont il est question (Gn 3,13 ; 1 S 1,26 ; 2 R 8,6) ; le pluriel cuavaa / cuawva signifie « enfants, descendants ». À vérifier auprès de locuteurs. Paulme 1964, p. 107 : tua nu ni « c''est ma fille » ; tualabɔ, tualɛgbɔ (pl. twalagbɛa) « bébé, nouveau-né jusqu''au sevrage ».'}
