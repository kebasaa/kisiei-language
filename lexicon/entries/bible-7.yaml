# Words of the Kisiei Bible (BKG), forms in m, n, o, p (seventh batch of new Bible words).
# Meanings are worked out from the verse contexts. All forms follow the Kisiei Bible (BKG).

# --- Verbs and actions
- {lemma: miinguuo, status: attested, pos: verb, forms: [miinguu, miinguo, miingul, miingun, miingulnin], gloss: {fr: "répéter, refaire, redire ; (miinguu yaŋɔɔlen) tendre une embuscade", en: "repeat, do again, say again; (miinguu yaŋɔɔlen) lay an ambush"}, domains: ["8.4.6", "3.5.1"], example: JOB.33.29, note: "o co lan miinguo lediin-diin, leyàá-yàá « il le fait deux fois, trois fois » (Jb 33,29) ; la miinguu sondo aa « qu'ils redisent » (Ps 118,2) ; miingul … yaŋɔɔlan « dresser une embuscade contre quelqu'un » (Dt 19,11)."}
- {lemma: miisuu, status: attested, pos: verb, forms: [miisu], gloss: {fr: "précipiter dans l'eau, engloutir, noyer ; se noyer", en: "hurl into the water, engulf, drown; be drowned"}, domains: ["1.3.2", "2.6.6"], childs: {page: 250, form: "mììsùùwó", sense: "immerse or dunk in water; also put someone into trouble"}, example: EXO.15.1, note: "O miisuu soa a vanaa ɲaanun o soa coo-o mɛmma ihɛlma … nin « il a précipité dans la mer cheval et cavalier » (Ex 15,1) ; má miisuu o mɛnndan nin « ils furent noyés » (He 11,29)."}
- {lemma: misimisi, status: attested, pos: verb, gloss: {fr: "engloutir, dévorer", en: "swallow up, devour"}, domains: ["5.2.2"], childs: {page: 251, form: "mìsìó", sense: "plural action of 'swallow'"}, example: GEN.41.20, note: "Redoublement ; apparenté à miolɔɔ « avaler » (Childs : mìsìó, pluriel de mìòlɔ̀ɔ́). Voir aussi misimisio « angoisse »."}
- {lemma: misimisio, status: attested, pos: noun, class: o, gloss: {fr: "angoisse, effroi, désarroi", en: "anguish, dismay, horror"}, domains: ["3.4.2"], example: PSA.55.6, note: "Avec bii « saisir » : misimisio bii masaa David « le roi fut bouleversé » (2 S 19,1)."}
- {lemma: muulianndo, status: attested, pos: verb, forms: [muulian], gloss: {fr: "mélanger, mêler ; joindre, associer", en: "mix, mingle; join together, combine"}, domains: ["7.5.3", "7.5.2"], childs: {page: 254, form: "mùlìàŋndó", sense: "(noun) a mixture, derived from 'turn'"}, example: EXO.30.35, note: "mɔima niaan ma muulian a mɛnndan « ton vin est coupé d'eau » (Es 1,22) ; La bɛnda mì la muulian cɔlua … le « n'accouple pas des bêtes d'espèces différentes » (Lv 19,19). Peut-être apparenté à mulio « tourner » (Childs)."}
- {lemma: mɔɔsa, status: attested, pos: verb, forms: [mɔɔsu], gloss: {fr: "s'unir, se joindre ; (mɔɔsa kpeloo) avoir des rapports, coucher ensemble", en: "come together, join; (mɔɔsa kpeloo) sleep together, have sexual relations"}, domains: ["2.6.2", "7.5.2"], childs: {page: 252, form: "mɔ̀ɔ̀sàá", sense: "fold; embrace someone; put together, mix"}, example: 2SA.12.24, note: "Verbe de base de mɔɔsiaa « rassembler ». mɔɔsu « serré, ajusté » (Ez 37,8) correspond à mɔ́ɔ́sú « tightly » chez Childs."}
- {lemma: mɛnanndo, status: attested, pos: verb, forms: [mɛnan, mɛnannin], gloss: {fr: "jurer, prêter serment ; serment", en: "swear, take an oath; oath"}, domains: ["3.5.1", "4.9.5"], childs: {page: 244, form: "mènǎŋndó"}, example: GEN.21.24, note: "Moyen de mɛna « maudire ». Bɛɛr-Seba … « Soon kólaa mɛnanndo » « le puits du serment » (Gn 26,33) ; sendí n mɛnan-ndo « le serment que tu as juré » (Gn 24,8)."}
- {lemma: mɛnalanndo, status: attested, pos: verb, forms: [mɛnalan], gloss: {fr: "faire jurer ; promettre par serment (à quelqu'un)", en: "make someone swear; swear (to someone), promise on oath"}, domains: ["3.5.1", "4.9.5"], childs: {page: 244, form: "mènàlló"}, example: GEN.50.25, note: "Dérivé de mɛnanndo « jurer ». lɛŋnde ya mɛnalan Abraham « le pays que j'ai juré de donner à Abraham » (Ex 6,8)."}
- {lemma: mɛɛloo, status: attested, pos: verb, forms: [mɛɛlu, mɛɛlunin], gloss: {fr: "finir, s'achever, arriver au bout", en: "end, finish, come to an end"}, domains: ["8.4.6"], childs: {page: 245, form: "mèèlòó", sense: "also stop, reach an end or boundary"}, example: GEN.44.12, note: "kandɔɔ a … kɔ mɛɛlu a … « en commençant par … et en finissant par … » (Gn 44,12) ; lɛŋnden le mɛɛlu-a « les extrémités de la terre » (Dt 28,49). Voir mɛɛlulan « fin »."}
- {lemma: mɛɛndanndo, status: attested, pos: verb, forms: [mɛɛndan, mɛɛndannin], gloss: {fr: "regarder, observer, examiner", en: "look, watch, observe, inspect"}, domains: ["2.3.1"], childs: {page: 245, form: "mèèndǎŋndó", sense: "look into deeply, ponder, scrutinize"}, example: GEN.15.5, note: "Verbe de base de mɛɛndianndo. Mɛɛndan-ndɔ « regarde ! » (Gn 15,5) ; o … mɛɛndanndo « pour espionner » (Gn 42,12)."}
- {lemma: nɛinun, status: attested, pos: verb, gloss: {fr: "déplaire, être odieux (à quelqu'un)", en: "displease, be hateful to"}, domains: ["3.4.2"], example: GEN.38.10, note: "dɛnɛ ndɔ kon nɛinun Mɛlɛka « ce qu'il faisait déplut au Seigneur » (Gn 38,10) ; vanaa nɛinun Mɛlɛka-a « ceux que le Seigneur a en horreur » (Dt 22,5). Sans doute apparenté à nɛyɔnndo « haïr »."}
- {lemma: nɛwvo, status: attested, pos: verb, forms: [nɛw, nɛwnin, nɛwnun], gloss: {fr: "fouler, piétiner, écraser", en: "tread, trample, crush underfoot"}, domains: ["7.7.6", "7.2.1"], childs: {page: 259, form: "nèìùwó", sense: "plural of nèìyó 'step on, kick, thresh'"}, example: 2SA.22.43, note: "rɛsɛnndon nɛwvo o doolaa nin « fouler le raisin au pressoir » (Ne 13,15) ; nɛw … a labɛngu « fouler aux pieds » (Ps 44,6)."}
- {lemma: nɛŋio, status: attested, pos: verb, forms: [nɛŋi, nɛŋinin, nɛŋul], gloss: {fr: "faire prospérer, rendre fécond ; réjouir (le cœur)", en: "make prosper, make fruitful; gladden (the heart)"}, domains: ["4.4", "3.4.1"], childs: {page: 259, form: "nèŋìó", sense: "make something beautiful, make people happy (causative of 'be good')"}, example: GEN.39.3, note: "nɛŋi … ipulu « rendre fécond » (Gn 29,31) ; Mɛlɛka va ndu nɛŋio « le Seigneur le faisait réussir » (Gn 39,3) ; kɔllo nɛŋio « réjouir le cœur » (Ps 92,5)."}

# --- Nouns
- {lemma: milɛɔ, status: attested, pos: noun, class: o, plural: milɛɛa, forms: [milɛɛ, milɛaa], gloss: {fr: mulet, en: mule}, domains: ["6.3.1"], example: 2SA.18.9, note: "Emprunt (français mulet)."}
- {lemma: milionndo, status: attested, pos: num, plural: milionndan, gloss: {fr: million, en: million}, domains: ["8.1.1"], example: 1CH.21.5, note: "Emprunt. milionndo o pilɛ « un million » (1 Ch 21,5)."}
- {lemma: mir, status: attested, pos: noun, gloss: {fr: myrrhe, en: myrrh}, domains: ["5.4.2"], example: EXO.30.23, note: "Emprunt ; souvent avec cun kɛndɛ « parfum »."}
- {lemma: mutarde, status: attested, pos: noun, gloss: {fr: moutarde, en: mustard}, domains: ["1.5.3"], example: MAT.13.31, note: "Emprunt (français) ; kulii mutarde « graine de moutarde »."}
- {lemma: muuluanndo, status: attested, pos: noun, class: o, plural: muuluannda, gloss: {fr: "hypocrite, homme fourbe", en: "hypocrite, deceitful person"}, domains: ["4.3"], example: MAT.7.5, note: "Apparenté à muuluo « retourner ». muulɔnndo « hypocrisie, fausseté ; tortueux » (Rm 12,9 ; 2 S 22,27)."}
- {lemma: mɔmtombolaa, status: attested, pos: noun, gloss: {fr: Pléiades (constellation), en: Pleiades (constellation)}, domains: ["1.1.1"], example: AMO.5.8, note: "Mɛlɛka cɔw mɔmtombolaa … a nanga-nsiiyo « celui qui a fait les Pléiades et Orion » (Am 5,8)."}
- {lemma: mɛlɛsoŋnɔ, status: attested, pos: noun, class: o, plural: mɛlɛsoŋnda, forms: [mɛlɛsoŋaa], gloss: {fr: "chef de corvée, contremaître", en: "taskmaster, overseer of forced labour"}, domains: ["4.5.1", "6.1.1"], example: EXO.5.6}
- {lemma: nɛ́ɛ̀nɛɔ, status: attested, pos: noun, class: o, plural: nɛ́ɛ̀nɛ́ɛ̀a, gloss: {fr: moineau, en: sparrow}, domains: ["1.6.1"], childs: {page: 260, form: "nèènéìyó", sense: "a small red and gray gregarious bird"}, example: MAT.10.29}
- {lemma: onikse, status: attested, pos: noun, gloss: {fr: onyx, en: onyx}, domains: ["1.2.2", "5.4.1"], example: GEN.2.12, note: "Emprunt ; pow onikse « pierre d'onyx »."}

# --- Qualities, adverbs, particles, ideophones
- {lemma: mɛɛlaa, status: attested, pos: adj, forms: [mɛɛlaala, mɛɛlaalan, mɛɛlaalen], gloss: {fr: "dernier, final", en: "last, final"}, domains: ["8.4.5"], childs: {page: 245, form: "mèèlà-"}, example: NEH.8.18, note: "paale mɛɛlaalen « le dernier jour » (Ne 8,18) ; kpundɛ mɛɛlaa « une dernière plaie » (Ex 11,1)."}
- {lemma: ningilaa, status: attested, pos: adj, forms: [ningila], gloss: {fr: "luisant, (teint) éclatant ; gras, bien portant", en: "shining, glowing (skin); fat, well-fed"}, domains: ["2.4", "8.3.3"], childs: {page: 263, form: "nìŋgìlàá", sense: "shining (?)"}, example: 1SA.17.42, note: "Souvent avec l'idéophone ningili : a ningilaa ningili « bien gras, florissant » (Jb 21,24 ; Ps 73,7)."}
- {lemma: mungén, status: attested, pos: adv, gloss: {fr: "complètement, entièrement (détruit, consumé)", en: "completely, utterly (destroyed, burnt up)"}, domains: ["8.1.5", "7.9.3"], example: JOB.1.16, note: "Après cuulu « brûler » ou cuu « périr » : má cuulu mungén « il les a entièrement consumés » (Jb 1,16)."}
- {lemma: mɔku-mɔku, status: attested, pos: ideo, gloss: {fr: "entièrement (couvert)", en: "entirely (covered)"}, domains: ["9.2.8", "8.1.5"], example: EXO.40.34, note: "Après kumbu « couvrir » : kumnde kumbu … mɔku-mɔku « la nuée couvrit entièrement … » (Ex 40,34)."}
- {lemma: mɔ́ɔ̀yɔ̀ɔ̀, status: attested, pos: ideo, gloss: {fr: "(couvert de honte) totalement", en: "utterly (put to shame)"}, domains: ["9.2.8", "3.4.2"], example: PSA.70.3, note: "Toujours avec siɛmbulan « honte » : siɛmbulan la tol naa mɔ́ɔ́yɔ̀ɔ̀ « tu nous couvres de honte » (Ps 44,10). Aussi écrit mɔ́ɔ́yɔ̀ɔ̀."}
- {lemma: nákà-nàkà, status: attested, pos: ideo, gloss: {fr: "(trembler) de tout son corps, violemment", en: "(tremble) violently, all over"}, domains: ["9.2.8", "3.4.2"], example: JOB.21.6, note: "Avec ɲiiya « trembler » : diallon ɲiiya ya nákà-nàkà « tout mon corps tremble » (Jb 21,6)."}
- {lemma: ndɛnin, status: attested, pos: adv, gloss: {fr: "(ne …) plus, (ne …) plus jamais", en: "(not) any more, never again"}, domains: ["8.4.6", "9.2.2"], example: EXO.10.14, note: "Toujours dans une phrase négative : a hin ndɛnin vɛlɛ lɔ́ɔ́-lɔ́ɔ̀ lende le « il n'en viendra plus jamais autant » (Ex 10,14) ; Sálàla … la hɛnan ndɛnin ya cun te « je ne respirerai plus l'odeur de vos sacrifices » (Lv 26,31)."}
- {lemma: niko, status: attested, pos: adv, gloss: {fr: "alors, maintenant ; (après un impératif) donc, je te prie", en: "then, now; (after an imperative) please, do"}, domains: ["8.4.5", "9.6.3"], childs: {page: 263, form: "níkó", sense: "now, right away, right then"}, example: GEN.29.21, note: "Mí Mɛlɛka dimul niko vanapɔnɔɔ aa « puis le Seigneur dit à l'homme » (Gn 3,17) ; Yɔngu ya niko laa nuu « donne-moi donc ma femme » (Gn 29,21)."}
- {lemma: nuvali, status: attested, pos: interj, forms: [nuvalio], gloss: {fr: "merci, bravo (pour un travail) ; (yil … nuvalio) remercier, féliciter", en: "thank you, well done (for work); (yil … nuvalio) thank, congratulate"}, domains: ["4.3.7", "9.2.7"], childs: {page: 266, form: "núwálí", sense: "thank you, especially for work someone has done"}, example: RUT.2.4, note: "La nuvali a vallo ! « merci pour votre travail ! » (salutation de Booz aux moissonneurs, Rt 2,4) ; Nuvali, vana baala kɛndɔɔ « c'est bien, bon serviteur » (Mt 25,21) ; mí yil Mɛlɛka nuvalio « je remerciai le Seigneur » (Gn 24,48)."}
- {lemma: nɛyaa, status: attested, pos: adj, forms: [nɛyan, nɛyaa-nɛyan], gloss: {fr: "douloureux, brûlant ; fort (boisson) ; (ɲɛ nɛyaa) douleur", en: "painful, burning; strong (drink); (ɲɛ nɛyaa) pain"}, domains: ["2.5.6", "5.2.3"], childs: {page: 261, form: "nèìyà-"}, example: JOB.33.19, note: "ɲɛ nɛyaa « la douleur » (Jb 30,17) ; mɔima nɛyaa « boisson forte » (Dt 29,5) ; kɛvaa lólòla nɛyaa « serpents brûlants » (Dt 8,15)."}

# --- Words in p (verbs)
- {lemma: pena, status: attested, pos: verb, gloss: {fr: "se lever tôt, faire (quelque chose) de bon matin", en: "rise early, do (something) early in the morning"}, domains: ["8.4.5", "5.7.3"], childs: {page: 292, form: "pènàá", sense: "be on time or early, go out early in the day; also an incipient tense marker"}, example: GEN.22.3, note: "Souvent avec idiiyo púŋ « tôt le matin » : Diimandɔɔ idiiyo púŋ, mí Abraham pena buloo cua « Abraham se leva de bon matin, prit du pain » (Gn 21,14)."}
- {lemma: piow, status: attested, pos: verb, forms: [piawnin], gloss: {fr: "abandonner, déserter, quitter (un lieu)", en: "abandon, desert, leave (a place)"}, domains: ["7.2.3"], childs: {page: 305, form: "pìùwó", sense: "make leave, drive away; also spend the evening"}, example: JER.9.9, note: "Yowva coocoo a visia yondoa piow lon « oiseaux et bêtes ont fui » (Jr 9,9) ; mɛɛ yàlàá piaw bɔɔ ndɔɔ « comme un lion quitte son repaire » (Jr 25,38) ; vannda piawnin ndi « elle sera abandonnée » (Es 7,16). Forme longue non relevée."}
- {lemma: piimiaa, status: attested, pos: verb, forms: [piimiaanin], gloss: {fr: "s'assombrir, noircir", en: "grow dark, turn black"}, domains: ["8.3.3"], childs: {page: 299, form: "pììmìá"}, example: 1KI.18.45, note: "halataalaa piimiaa kpilo « le ciel s'obscurcit » (1 R 18,45) ; Yáw nuu co ya piimiaa « ma peau noircit » (Jb 30,30)."}
- {lemma: pimbullo, status: attested, pos: verb, forms: [pimbul, pimbulu, pimbulaa], gloss: {fr: "rouler (une pierre) ; se rouler, s'écrouler", en: "roll (a stone); roll over, collapse"}, domains: ["7.3.2", "7.2.1"], childs: {page: 302, form: "pìmbùlló"}, example: JOS.10.18, note: "La pimbul powta bɛndulan « roulez de grosses pierres » (Jos 10,18) ; mó va pimbullo « il se roulait (par terre) » (Mc 9,20)."}
- {lemma: piɔndio, status: attested, pos: verb, forms: [piɔndi, piɔndinin], gloss: {fr: "tonner, gronder ; (piɔndi a caŋndo) éclater en sanglots", en: "thunder, roar; (piɔndi a caŋndo) burst into tears"}, domains: ["1.1.3", "3.4.2"], childs: {page: 298, form: "pìèndìóó", sense: "explode, pop (as corn)"}, example: PSA.29.3, note: "Hala biilaa co piɔndio « le Dieu de gloire tonne » (Ps 29,3) ; mó piɔndi a caŋndo « il éclata en sanglots » (Gn 29,11)."}
- {lemma: piɔsio, status: attested, pos: verb, forms: [piɔsi, piɔsinin], gloss: {fr: "se briser, voler en éclats, se fendre ; (bourgeon) éclater", en: "break, shatter, split; (bud) burst open"}, domains: ["7.8.1"], childs: {page: 304, form: "pìɔ̀sìó", sense: "be broken, break by itself (esp. several things)"}, example: 1SA.5.4, note: "bolle ndɔlen le piɔsi « sa tête se brisa » (1 S 5,4) ; mɛɛ kpɛɛnɛi … piɔsi « comme se brise un pot de potier » (Es 30,14) ; pei lendei ken piɔsi « le bâton avait bourgeonné » (Nb 17,23). Apparenté à piɔlɔɔ « briser »."}
- {lemma: piɔu, status: attested, pos: verb, gloss: {fr: "monter, se remplir, déborder ; augmenter", en: "rise, fill up, overflow; increase"}, domains: ["1.3.2", "8.1.8"], childs: {page: 304, form: "pìɔ̀ɔ́", sense: "be full, lumpy or swollen"}, example: PSA.23.5, note: "taala kólaa nuu co piɔu « ma coupe déborde » (Ps 23,5) ; dɛ̀ndɔ̀ɔ́ va piɔu a mɛnndan « la barque se remplissait d'eau » (Mc 4,37) ; mɔnɛi kɔa a piɔu « le chagrin augmente » (Qo 1,18)."}
- {lemma: poondaa, status: attested, pos: verb, forms: [poonda, poondan, poondanin], gloss: {fr: "enlever, arracher, prendre de force ; (poondan) s'échapper", en: "take away, snatch, seize by force; (poondan) escape"}, domains: ["7.3.2", "7.4.3"], childs: {page: 307, form: "pòòndàá", sense: "take away, pull off; also shuck; (middle) slip out"}, example: GEN.31.31, note: "Verbe de base de poondiaa. I poondanin Salomɔn masalen … o ba « j'arracherai le royaume des mains de Salomon » (1 R 11,34) ; Yalaa timbinndo, mí n poondan « le filet s'est rompu et nous nous sommes échappés » (Ps 124,7)."}
- {lemma: puiyaa, status: attested, pos: verb, forms: [pui, puinin], gloss: {fr: "pousser, verdir, repousser ; verdure", en: "sprout, grow green, shoot again; greenery"}, domains: ["1.5.6"], childs: {page: 311, form: "pùìyó", sense: "sprout new growth, grow"}, example: JOB.14.7, note: "o muungu vɛlɛ o pui « il repousse » (Jb 14,7) ; dɛɛla … va o puiyaa ɲɛkɛndɛi « la plaine était bien arrosée, verdoyante » (Gn 13,10)."}
- {lemma: pungaa, status: attested, pos: verb, forms: [punga, pungapungaa], gloss: {fr: "piller, ravir ; pillage, butin", en: "plunder, loot; plunder, spoil"}, domains: ["4.8.3", "7.4.3"], childs: {page: 313, form: "pùŋàá", sense: "fight or squabble over something (e.g. food); also blossom"}, example: EZR.9.7, note: "vannda punga ɲɛm naan « on a pillé nos biens » (Esd 9,7) ; siŋnun pungapungaa « devenir une proie » (Ez 26,5 ; 34,22)."}
- {lemma: puuvo, status: attested, pos: verb, forms: [puu, puunin, puunun, puununnin], gloss: {fr: "prendre, enlever, arracher ; reprendre, récupérer", en: "take, take away, snatch; take back, recover"}, domains: ["7.4.3", "7.3.2"], childs: {page: 315, form: "pùùwó", sense: "take away, seize, snatch; also become engaged to, hire"}, example: GEN.14.16, note: "Mó puu vɛlɛ Lɔt « il reprit aussi Lot » (Gn 14,16) ; buɛyaa Abimelɛk-a ndáà puu a paa-kala « dont les serviteurs d'Abimélek s'étaient emparés » (Gn 21,25) ; puunun « s'emparer, être enlevé »."}
- {lemma: pɔw, status: attested, pos: verb, gloss: {fr: "s'égarer, se tromper ; être en faute", en: "go astray, err; be at fault"}, domains: ["4.3", "7.6.3"], example: EXO.14.3, note: "Israɛlla pɔw nɛiyo « les Israélites errent (ont perdu leur chemin) » (Ex 14,3) ; Ya pɔw ni « c'est moi la fautive » (1 S 25,24). Voir pɔwlan « faute »."}
- {lemma: pɔɔliaa, status: attested, pos: verb, forms: [pɔɔliaanin, pɔɔla, pɔɔlaa], gloss: {fr: "arroser, irriguer ; (pɔɔla) mouiller, tremper", en: "water, irrigate; (pɔɔla) wet, soak"}, domains: ["1.3.3", "6.2.4"], childs: {page: 310, form: "pɔ̀ɔ̀làá", sense: "soak, immerse in water, drench, water a plant"}, example: GEN.2.6, note: "mɛmma va … lɛŋnden pɔɔliaa « l'eau arrosait toute la surface du sol » (Gn 2,6) ; o pɔɔla ɲɛm mun … o kooma « il les trempera dans le sang » (Lv 14,6)."}

# --- Words in p (nouns)
- {lemma: pangaa, status: attested, pos: noun, class: o, forms: [panga, pangala], gloss: {fr: "case de champ, abri ; champ", en: "field hut, shelter; field, farm"}, domains: ["6.2.9", "6.5.1"], childs: {page: 289, form: "pàŋáá", sense: "farm kitchen, thatched hut at the farm (also for sleeping); the rice farm itself"}, example: RUT.2.17, note: "mɛɛ pangaa … o nakɔ n'rɛsɛnndo nin « comme une cabane dans une vigne » (Es 1,8) ; n va maalon yiiyo tumbulan o panga « nous liions des gerbes au champ » (Gn 37,7) ; o Boas lo panga « dans le champ de Booz » (Rt 2,17)."}
- {lemma: peengoo, status: attested, pos: noun, class: o, plural: peengelan, forms: [peenge, peengela], gloss: {fr: fleur, en: flower}, domains: ["1.5.5"], childs: {page: 291, form: "pèèŋndó", sense: "a tree species and its flower (var. pééŋgòó)"}, example: 1PE.1.24, note: "maa peengela yɔm amanndiee « en forme de fleurs d'amandier » (Ex 25,33)."}
- {lemma: pemalen, status: attested, pos: noun, class: len, forms: [pemale, pemama], gloss: {fr: "sentier, chemin, passage", en: "path, track, way through"}, domains: ["6.5.4", "7.2.4"], childs: {page: 292, form: "pèmáléŋ", sense: "path or route through the bush; also the parting in someone's hair (slang)"}, example: NUM.22.24, note: "pemama ndɔan « ses sentiers » (Pr 3,17)."}
- {lemma: piawvo, status: attested, pos: noun, class: o, forms: [piaw], gloss: {fr: "manche, poignée ; hampe", en: "handle, hilt; shaft"}, domains: ["6.7"], childs: {page: 298, form: "pìáúwó"}, example: DEU.19.5, note: "Hali piaw imɔɔ … luɛi ndu nin « même la poignée entra après la lame » (Jg 3,22) ; piaw bál ndɔɔ « la hampe de sa lance » (1 S 17,7). Homonyme de piaw, radical de piow « abandonner »."}
- {lemma: piindo, status: attested, pos: noun, class: o, plural: piinda, gloss: {fr: tourterelle, en: turtledove}, domains: ["1.6.1"], childs: {page: 299, form: "pììŋndó"}, example: LEV.5.7, note: "piinda nda ŋiɔn, te kon te kangboa nda ŋiɔn « deux tourterelles ou deux jeunes pigeons » (Lv 5,7)."}
- {lemma: pikiei, status: attested, pos: noun, class: i, plural: pikion, forms: [pikii, pikin], gloss: {fr: "piquet (de tente), cheville ; ensouple (de métier à tisser)", en: "tent peg, stake; beam (of a loom)"}, domains: ["6.7.5"], example: JDG.4.21, note: "pikii cɛi-kola-toandaa « un piquet de tente » (Jg 4,21) ; maa pikii nda simbulu kola « comme une ensouple de tisserand » (1 S 17,7)."}
- {lemma: pilacieo, status: attested, pos: noun, class: o, plural: pilacieaa, forms: [pilaciee, pilacieea], gloss: {fr: "autochtone, citoyen ; (pl.) gens du pays", en: "native, citizen; (pl.) people of the land"}, domains: ["4.1.2", "4.6.7"], childs: {page: 300, form: "pílácíóó"}, example: LEV.17.8, note: "cua pilacieo Israɛl « un Israélite de souche » (Lv 17,8) ; pilacieea Kerar « les gens de Guérar » (Gn 26,7)."}
- {lemma: píŋndo, status: attested, pos: noun, class: o, plural: piŋndan, gloss: {fr: "enclos, encerclement ; (luei … o píŋndo nin) assiéger, enfermer", en: "enclosure, encirclement; (luei … o píŋndo nin) besiege, hem in"}, domains: ["4.8.3"], childs: {page: 303, form: "píŋndó", sense: "fence of palm-branch thatch, used for storing palm nuts"}, example: ISA.29.3, note: "I lueinin niaa o píŋndo nin « je t'assiégerai » (Es 29,3) ; toosiaa piŋndan « élever des ouvrages de siège » (Ez 4,2)."}
- {lemma: piɔŋndo, status: attested, pos: noun, class: o, plural: piɔŋndan, forms: [piɔŋnda], gloss: {fr: "furoncle, abcès", en: "boil, abscess"}, domains: ["2.5.6", "2.5.2"], childs: {page: 304, form: "pìɔ̀mndó", sense: "a skin rash forming large pustules"}, example: LEV.13.18, note: "piɔŋnda lan la siŋnun pavii vɔɔnde « ce seront des furoncles qui se changeront en plaies » (Ex 9,9)."}
- {lemma: poo, status: attested, pos: noun, class: o, plural: poaa, forms: [po], gloss: {fr: "fils, enfant (mâle) ; (pl.) fils, descendants", en: "son, (male) child; (pl.) sons, descendants"}, domains: ["4.1.9"], childs: {page: 307, form: "pòó", sense: "boy, youth"}, example: GEN.4.25, note: "Forme radicale po : po ndɔɔ « son fils », po vanalanɔɔ « le fils de la femme » (Gn 3,15) ; poaa Israɛl « les Israélites ». Vocatif ponndo « mon fils ! » (Gn 43,29) ; pole pilɛlen « fils unique » (Gn 22,12 ; Childs póléŋ « only male child »)."}
- {lemma: poolan, status: attested, pos: noun, class: lan, forms: [poola], gloss: {fr: "excréments, fiente, bouse", en: "dung, excrement"}, domains: ["2.2.8"], childs: {page: 307, form: "pòòléŋ"}, example: EXO.29.14}
- {lemma: pongan, status: attested, pos: noun, gloss: {fr: "taches, mouchetures (du pelage)", en: "spots, speckles (of an animal's coat)"}, domains: ["8.3.3", "1.6.2"], example: GEN.31.8, note: "cɔlu oo cɔlu nɔ pongan « toute bête qui avait des taches » (Gn 30,35)."}
- {lemma: pulon, status: attested, pos: noun, gloss: {fr: "entrailles, intestins", en: "entrails, intestines"}, domains: ["2.1.8", "1.6.2"], childs: {page: 311, form: "pùléí", sense: "stomach, intestines (plural pùlóŋ); also a woman's labour stage, a strip of cloth"}, example: LEV.8.21, note: "cuɛima kumbu pulon « la graisse qui couvre les entrailles » (Lv 3,3). Voir pulen « nombril »."}
- {lemma: pundaa, status: attested, pos: noun, class: o, gloss: {fr: "cécité, vue voilée", en: "blindness, dimness of sight"}, domains: ["2.5.4"], childs: {page: 312, form: "púndáá", sense: "white filmy growth that causes cataracts and blindness"}, example: GEN.27.1, note: "pundaa cal ndu o lahɔl « ses yeux s'étaient affaiblis » (Gn 27,1)."}
- {lemma: puilen, status: attested, pos: noun, class: len, forms: [puile], gloss: {fr: queue, en: tail}, domains: ["1.6.2"], childs: {page: 311, form: "pùìléŋ", sense: "a brush of tied grass used by a praise singer, often replaced by a cow's tail"}, example: EXO.4.4, note: "puile ndɔlen « sa queue (grasse) » (Lv 3,9)."}
- {lemma: púvɔ́ɔ́, status: attested, pos: noun, class: o, plural: púwvɛa, forms: [púvɛ], gloss: {fr: "gazelle, chevreuil", en: "gazelle, deer"}, domains: ["1.6.1"], example: DEU.14.5, note: "maa púvɛ « comme une gazelle » (2 S 2,18 ; Ct 2,17)."}
- {lemma: pɔmndo, status: attested, pos: noun, class: o, plural: pɔmndan, gloss: {fr: "ruine (de ville), lieu dévasté", en: "ruin, ruined town"}, domains: ["7.9.3", "6.5.1"], childs: {page: 309, form: "pɔ̀mndó", sense: "a deserted or abandoned town, former town site"}, example: JOS.8.28, note: "ciee pɔmndo « un monceau de ruines » (Jos 8,28) ; kobila … la siŋnun pɔmndan « vos villes deviendront des ruines » (Lv 26,33)."}
- {lemma: pɔtɔlla, status: attested, pos: noun, forms: [pɔtɔlten, pɔtɔlaa, pɔtɔlte], gloss: {fr: "travailleurs forcés, corvéables ; (pɔtɔlten) corvée, servitude", en: "forced labourers; (pɔtɔlten) forced labour, servitude"}, domains: ["6.1.1", "4.5"], example: 1KI.5.27, note: "Pluriel ; le singulier n'est pas relevé. siinguu … pɔtɔlla « réduire en servitude » (Gn 47,21) ; Hadoram va pɔtɔlla bollen « Adoram était chef des corvées » (2 S 20,24)."}
- {lemma: pɔwlan, status: attested, pos: noun, class: lan, forms: [pɔwla], gloss: {fr: "égarement, faute, péché", en: "error, wrongdoing, sin"}, domains: ["4.3", "4.9.5"], example: DEU.11.16, note: "luɛi o pɔwlan nin « s'égarer, tomber dans l'erreur » (Dt 11,16) ; pɔwla Yeroboam « les péchés de Jéroboam » (2 R 10,31). Voir pɔw « s'égarer »."}
- {lemma: poopoo, status: check, pos: noun, gloss: {fr: "insolence, outrage ; (vana poopoo) vaurien, effronté", en: "insolence, disgrace; (vana poopoo) scoundrel, brazen person"}, domains: ["4.3"], example: 2SA.20.1, note: "sui … poopoo « outrager, déshonorer, importuner » (Dt 22,19 ; Rt 2,9) ; vanalanɔ poopoo « femme effrontée » (Pr 7,11). Sens à confirmer."}
- {lemma: pumbu, status: check, pos: noun, gloss: {fr: "lieu fixe, établissement (icali o pumbu « demeurer à un endroit fixe »)", en: "settled place (icali o pumbu 'live in a fixed place')"}, domains: ["5.9"], example: GEN.4.12, note: "A ve lɛnin icali o pumbú le « tu ne demeureras nulle part (tu seras errant) » (Gn 4,12) ; vanaa cel o pumbu le « les nomades » (Jg 8,11). Aussi écrit pumbú. Sens à confirmer."}

# --- Words in p (qualities, adverbs, ideophones)
- {lemma: pooɲɛi, status: attested, pos: adj, forms: [pooɲɛiya, pooɲɛila, pooɲɛilen], gloss: {fr: "tacheté, moucheté", en: "speckled, spotted"}, domains: ["8.3.3"], childs: {page: 307, form: "pòɲéí-", sense: "spotted, colourful, multicoloured"}, example: GEN.30.32, note: "cɔlua pooɲɛiya « les bêtes tachetées » (Gn 30,32)."}
- {lemma: pɔ́, status: attested, pos: adv, forms: [pɔ́-pɔ́], gloss: {fr: "loin, très loin ; très haut", en: "far, far away; very high"}, domains: ["8.2.6", "8.6.2"], childs: {page: 308, form: "pɔ́", sense: "far up or off, very high, at the top"}, example: JOB.22.12, note: "levil pɔ́-pɔ́ « très loin » (Lv 14,7) ; coocoo pɔ́ « tout là-haut » (Jb 22,12)."}
