- {lemma: peŋ, status: attested, pos: ideo, gloss: {fr: "solidement, fermement (lier, endurcir)", en: "tightly, firmly (bind, harden)"}, domains: ["9.2.8", "7.5.4"], childs: {page: 296, form: "pêŋ", sense: "tightly"}, example: GEN.22.9, note: "mó yii ndu peŋ « il le lia solidement » (Gn 22,9) ; kindi nilan peŋ « endurcir le cœur » (Ex 7,3)."}
- {lemma: poŋ, status: attested, pos: ideo, gloss: {fr: "dur, ferme, solide", en: "hard, firm, solid"}, domains: ["9.2.8", "8.3.2"], example: JOB.37.10, note: "mɛmma … ma kendu poŋ « les eaux gèlent » (Jb 37,10) ; calta niaalan la co lakala poŋ « ta demeure est solide » (Nb 24,21)."}
