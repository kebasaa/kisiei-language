- {lemma: ɲafindo, status: respelled, pos: noun, forms: [nafindo, ɲafendo], variants: [{form: nafindo, dialect: K, source: paulme}], gloss: {fr: panthère, en: leopard}, domains: [1.6.1], paulme: {page: 71, form: 'nyafindo, nafindo /K./'}, sandara: {section: fable 6, form: nyafendo}, note: 'Paulme : nafindo /K./ ; nyafindo buri wana pɔno « la panthère a tué un homme ». Cf. tambillo dans la Bible. Sandara Kissia, fable 6 : nyafendo « la panthère » (porte le lièvre, puis dévore les singes). Paulme : nyafindo, nafindo /K./ (p. 71).'}
