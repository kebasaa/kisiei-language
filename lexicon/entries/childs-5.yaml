# Words of the Kisiei Bible (BKG) found by going through Childs (2000), A Dictionary of the Kisi Language, printed pages 281-350.
# Lemma and meaning follow the Bible; `childs` gives the Southern Kissi headword checked (and `sense` where it differs).
# Entries with status respelled come from Keita (1979) where the Bible has no counterpart.

- {lemma: ɲumbɔɔ, status: attested, pos: verb, forms: [ɲuumbun], gloss: {fr: "tourner (la meule), moudre ; (ɲuumbun) tourner (sur ses gonds)", en: "turn (a millstone), grind; (ɲuumbun) turn (on its hinges)"}, domains: ["7.3.2", "5.2.1"], childs: {page: 282, form: "ɲùmbɔ̀ɔ́", sense: "twist, turn, braid"}, example: JDG.16.21, note: "pow bɛndu cuiyaa n'kullo ɲumbɔɔ « tourner la grosse meule » (JDG.16.21) ; mɛɛ dioo ɲuumbun o boondun ndɔn coo « comme la porte tourne sur ses gonds » (PRO.26.14)."}
- {lemma: ɲuluan, status: attested, pos: adj, forms: [ɲuluma, ɲuluei], gloss: {fr: "frais, froid", en: "cool, cold"}, domains: ["8.3.4"], childs: {page: 282, form: "ɲùlú-"}, example: MAT.10.42, note: "mɛmma ɲuluan « eau fraîche » (MAT.10.42, PRO.25.25) ; mɛmma ɲuluma (JER.18.14) ; ɲuluei (PRO.25.13, fraîcheur de la neige)."}
- {lemma: pá, status: attested, pos: part, gloss: {fr: "du tout, jamais, encore (dans les questions) ; (lɔ́ɔ́ pá) avant que", en: "at all, ever, still (in questions); (lɔ́ɔ́ pá) before"}, domains: ["9.2.6", "8.4.5"], childs: {page: 286, form: "pá", sense: "ever, at all; long ago, for a long time"}, example: JHN.1.46, note: "Ɲɛ kɛndɔɔ nɔla pá fulaa Nasarɛt? « Peut-il sortir quelque chose de bon de Nazareth ? » (JHN.1.46) ; lɔ́ɔ́ pá mi Abraham fula « avant qu'Abraham fût » (JHN.8.58)."}
- {lemma: paandoo, status: attested, pos: adj, forms: [paandua, paanduan, paanduei, paandulan], gloss: {fr: "ancien, vieux, d'autrefois", en: "old, former, ancient"}, domains: ["8.4.5"], childs: {page: 286, form: "pààndù-"}, example: EZR.2.68, note: "De paandu « autrefois ». o fonda ndɔ paandoo coo « à son ancien emplacement » (EZR.2.68) ; mɔima paanduan « le vin vieux » (LUK.5.39) ; vanacieeyɛi paanduei « le vieil homme » (EPH.4.22) ; naamula ndala paandulan « leurs anciennes coutumes » (2KI.17.34)."}
- {lemma: paalenda, status: attested, pos: noun, forms: [paalennda, paaleenda, paaleŋaa], gloss: {fr: "sorte de criquets (pl.)", en: "a kind of locusts (pl.)"}, domains: ["1.6.1"], childs: {page: 286, form: "páálèŋndó", sense: "an edible locust-like insect living in the ground"}, example: LEV.11.22, note: "Pluriel ; le singulier n'est pas dans la Bible. Cité avec sóónɔa « sauterelles » (LEV.11.22, PSA.105.34, JOL.1.4, JOL.2.25)."}
- {lemma: paŋ, status: attested, pos: ideo, gloss: {fr: "fade, sans goût (sel)", en: "tasteless, insipid (salt)"}, domains: ["2.3.3", "9.2.8"], childs: {page: 288, form: "pâŋ"}, example: LUK.14.34, note: "te i muungu pɛ paŋ « s'il devient fade » (LUK.14.34)."}
- {lemma: peenguu, status: attested, pos: verb, forms: [peengun], gloss: {fr: "peler, écorcer ; (peengun) être pelé, écorché", en: "peel, strip (bark); (peengun) be rubbed bare, peeled"}, domains: ["7.8.3", "1.5.5"], childs: {page: 291, form: "pèèŋgùùwó", sense: "peel (plural of 'peel, hit, slap')"}, example: GEN.30.37, note: "Jacob mó peenguu ndi « il les écorça » (GEN.30.37) ; à peenguu ndi tumndan « elle en a arraché l'écorce » (JOL.1.7) ; congúla ndalan kpow la peengun « toutes les épaules étaient écorchées » (EZK.29.18)."}
- {lemma: pɛiyo, status: attested, pos: verb, gloss: {fr: "apprendre, étudier", en: "learn, study"}, domains: ["3.2.2"], childs: {page: 295, form: "pɛ̀ìyó", sense: "learn, study, remember, memorize"}, example: EZR.7.10, note: "tɔŋ Mɛlɛka-o pɛiyo « étudier la loi du Seigneur » (EZR.7.10) ; condii kalɛi pɛiyo « apprendre le cantique » (REV.14.3)."}
- {lemma: pɛlɛlen, status: attested, pos: noun, class: len, gloss: {fr: "chasse, proie", en: "hunt, prey"}, domains: ["6.4.1"], childs: {page: 296, form: "pɛ̀lɛ̀lɛ́ŋ", sense: "hunting with dogs; chasing after something"}, example: GEN.49.9, note: "a fula pɛlɛlen « tu es revenu de la chasse (de la proie) » (GEN.49.9), dit de Juda, jeune lion."}
- {lemma: pɛltan, status: attested, pos: noun, gloss: {fr: "parts, portions (de terrain) (pl.)", en: "portions, parts (of land) (pl.)"}, domains: ["8.6", "6.2.9"], childs: {page: 296, form: "pɛ̌lló", sense: "division, part, portion (of a field to be worked)"}, example: PSA.60.8, note: "Pluriel ; le singulier n'est pas dans la Bible. mì tuu bóllo Sukɔt a pɛltan « je mesurerai (la vallée de) Soukkoth en parts » (PSA.60.8, PSA.108.8)."}
- {lemma: pɛɛngu, status: attested, pos: adv, forms: [pɛngu], gloss: {fr: "clairement, avec certitude (sina pɛɛngu « savoir avec certitude »)", en: "clearly, for certain (sina pɛɛngu 'know for sure')"}, domains: ["3.2.3", "9.2.2"], childs: {page: 297, form: "pɛ́ŋú", sense: "clearly, completely, very well"}, example: GEN.15.8, note: "vɛ̀ɛ̀ ya sina yɛnin pɛɛngu « comment saurai-je avec certitude » (GEN.15.8) ; la sina pɛngu maa … « sachez bien que … » (DEU.7.9)."}
- {lemma: pendei, status: attested, pos: noun, class: i, gloss: {fr: "graine de fonio", en: "fonio grain"}, domains: ["5.2.3", "6.2.1"], keita: {form: "Pendei", page: 29}, childs: {page: 293, form: "pèndéí", sense: "millet, Guinea corn"}, note: "Seul emploi biblique dans un titre de section : Sandaa a kulii n'pendei o kɔɔ « parabole de la graine de fonio » (titre de LUK.13, pour la graine de moutarde ; le texte a kulii mutarde). Keita le cite dans un exercice ; le sens « graine de fonio » vient des notes manuscrites (p. 29)."}
- {lemma: piilian, status: attested, pos: verb, forms: [piilianndo], gloss: {fr: "palper, tâter, toucher (de la main)", en: "feel, touch (with the hand)"}, domains: ["2.3.5", "7.3.4"], childs: {page: 299, form: "pììlìáŋndó", sense: "touch oneself or someone repeatedly (plural middle of 'touch, dab')"}, example: GEN.27.21, note: "Pluriel de pilanndo « toucher ». mì piilian nɔm « que je te tâte » (GEN.27.21)."}
- {lemma: piinduu, status: attested, pos: verb, gloss: {fr: "acheter (beaucoup de choses), acheter tout", en: "buy (many things), buy up"}, domains: ["6.8.4"], childs: {page: 299, form: "pììndùùwó"}, example: GEN.47.20, note: "Pluriel de piondɔɔ « acheter ». Yosɛf piinduu yondola Esiptea kpow « Joseph acheta toutes les terres des Égyptiens » (GEN.47.20)."}
- {lemma: piisuu, status: attested, pos: verb, forms: [piisuanndo], gloss: {fr: "vendre (beaucoup de choses), vendre tout", en: "sell (many things), sell off"}, domains: ["6.8.4"], childs: {page: 299, form: "pììsùùwó"}, example: MAT.13.46, note: "Pluriel de pisio « vendre ». mó kɔ piisuu ɲɛm ndɔn kpow « il alla vendre tout ce qu'il avait » (MAT.13.46) ; piisuanndo (NEH.5.8)."}
- {lemma: pii, status: attested, pos: adv, gloss: {fr: "toute la nuit (lɔl … pii « passer toute la nuit à … »)", en: "all night long (lɔl … pii 'spend the whole night …')"}, domains: ["8.4.2"], childs: {page: 299, form: "píípíí"}, example: LUK.6.12, note: "mó lɔl Hala piɛiyo pii « il passa toute la nuit à prier Dieu » (LUK.6.12) ; icɔl pii « toute la nuit » (LUK.5.5)."}
- {lemma: pilaa, status: attested, pos: adj, forms: [pilalen, pilalan], gloss: {fr: "d'autrui, de quelqu'un d'autre ; propre (à soi) ; (lɛŋnde pilalen) pays étranger", en: "another's, someone else's; (one's) own; (lɛŋnde pilalen) foreign land"}, domains: ["9.2.3", "7.4"], childs: {page: 300, form: "pílá", sense: "someone's, people's, another's"}, example: EXO.20.17, note: "La fúla cɛi pilaa lehɔl te « tu ne convoiteras pas la maison d'autrui » (EXO.20.17) ; lɛŋnde pilalen « un pays étranger » (EXO.18.3) ; hakila nda pilalan « leurs propres fautes » (LEV.26.39)."}
- {lemma: pilɛn-pilɛn, status: attested, pos: adv, gloss: {fr: "un à un, l'un après l'autre ; deux à deux", en: "one by one, one after another; in pairs"}, domains: ["8.1.1", "9.2.2"], childs: {page: 301, form: "pìléŋ-píléŋ", sense: "one by one; a little, bit by bit"}, example: ECC.7.27, note: "dɛnndan ndan la pilɛn-pilɛn « (examinant) les choses une à une » (ECC.7.27) ; (attacher les queues) deux à deux (JDG.15.4)."}
- {lemma: piɔlɛiyo, status: attested, pos: adj, forms: [piɔlɛi, piɔlɛilen, piɔlɛilan, piɔlɛila, piɔlɛiye, piɔlɛin], gloss: {fr: "brisé, détruit, en ruine", en: "broken, destroyed, ruined"}, domains: ["7.9.3", "7.8.1"], childs: {page: 303, form: "pìɔ̀lèí-", sense: "broken"}, example: EZK.29.9, note: "De piɔlɔɔ « briser ». lɛŋnde piɔlɛilen « pays dévasté » (EZK.29.9) ; cɛila ndala piɔlɛilan « leurs maisons en ruine » (PSA.109.10) ; Kpɛɛnɛn Piɔlɛiyo « porte des Tessons » (JER.19.2)."}
- {lemma: pindipindio, status: check, pos: noun, gloss: {fr: "charbon (pour tracer) ?", en: "charcoal (for marking)?"}, domains: ["5.5", "6.6.3"], childs: {page: 302, form: "pìndìó", sense: "coals, charcoal (variant pìndìpìndìó)"}, example: ISA.44.13, note: "Un seul emploi : o tɛnda tindilen a pindipindio « il trace (le bois) au … » (ISA.44.13), où l'hébreu a un outil à tracer (craie, stylet). Le sens « charbon » est déduit de Childs ; à confirmer."}
- {lemma: piɔlnɔnndo, status: attested, pos: verb, gloss: {fr: "être prononcé, être invoqué (nom)", en: "be pronounced, be called upon (name)"}, domains: ["3.5.1", "9.7"], childs: {page: 304, form: "pìɔ̀lnɔ̌ŋndó", sense: "break by itself (middle of 'break')"}, example: 1KI.8.29, note: "Moyen de piɔlɔɔ « briser ; prononcer (un nom) ». diola nɔmndan la vanin piɔlnɔnndo « ton nom y sera invoqué » (1KI.8.29, 2KI.21.7)."}
- {lemma: piɔmndo, status: attested, pos: noun, class: o, plural: piɔmnda, gloss: {fr: "idole, statue (d'un dieu)", en: "idol, image (of a god)"}, domains: ["4.9.8"], childs: {page: 304, form: "pìɔ̀mndó", sense: "small carved stone figure (nomoli) kept for an ancestor spirit"}, example: EXO.32.4, note: "Sans tons, à distinguer de piɔ́mndo « mort ». cɔaw piɔmndo a mun maa naw téndé « il en fit une idole, un veau » (EXO.32.4) ; La selnun piɔmnda le « tu ne te feras pas d'idoles » (EXO.20.4) ; piɔmndo Molɛk (LEV.18.21)."}
- {lemma: polen, status: attested, pos: noun, class: len, forms: [pole], gloss: {fr: "enfant unique, fils unique (pole pilɛlen)", en: "only child, only son (pole pilɛlen)"}, domains: ["4.1.9"], childs: {page: 306, form: "póléŋ", sense: "only male child; young male child"}, example: GEN.22.12, note: "a túŋ ya pole nɔmnde pilɛlen nden te « tu ne m'as pas refusé ton fils unique » (GEN.22.12) ; polen nden koni ya nɔ ni « c'est mon unique enfant » (LUK.9.38)."}
- {lemma: pollo, status: attested, pos: noun, gloss: {fr: "rase campagne, pleine campagne", en: "open country, open field"}, domains: ["1.2.1", "8.5.4"], childs: {page: 306, form: "pólló", sense: "desert area"}, example: EZK.29.5, note: "a kɔ del lɛŋ o pollo nin « tu tomberas en pleine campagne » (EZK.29.5) ; o pollo coo (1CH.19.9) ; hu pollo, nom d'un oiseau (DEU.14.16)."}
- {lemma: pooɲiaa, status: attested, pos: verb, forms: [pooɲia, poɲa], gloss: {fr: "tacher, couvrir de taches ; (poɲa) être taché", en: "spot, cover with spots; (poɲa) be stained"}, domains: ["8.3.3"], childs: {page: 307, form: "pòòɲìá", sense: "be spotted all over; write (plural of 'be spotted')"}, example: LEV.13.57, note: "mɛɛ nàà siaŋaa pooɲiaa volɔɔ « si la lèpre tache le vêtement » (LEV.13.57) ; tambillo nɔla pá pooɲia yáw ndɔɔ mangala « le léopard peut-il changer ses taches » (JER.13.23) ; volɔɔla nila la poɲa « mes vêtements sont tachés » (ISA.63.3). Voir pooɲɛi « tacheté »."}
- {lemma: pɔlullo, status: attested, pos: verb, forms: [pɔlul, pɔlulnin], gloss: {fr: "se calmer, s'apaiser (colère, douleur) ; apaiser", en: "cool down, abate (anger, pain); calm"}, domains: ["3.4.1", "8.3.4"], childs: {page: 309, form: "pɔ̀lùlló", sense: "cool (something, someone with a fever)"}, example: DEU.13.18, note: "haliko mi kɔltuw Mɛlɛka Hala niaa pɔlul « afin que la colère du Seigneur s'apaise » (DEU.13.18) ; sanga nuu pɔlulnin te « ma douleur ne s'apaise pas » (JOB.16.6) ; kɔl nuu pɔlullo « apaiser mon esprit » (ZEC.6.8)."}
- {lemma: pululen, status: attested, pos: noun, class: len, forms: [pulule], gloss: {fr: "gloutonnerie, gourmandise, excès de table", en: "gluttony, greed (for food), carousing"}, domains: ["5.2.2", "4.3"], childs: {page: 312, form: "pùlúléŋ", sense: "greed"}, example: GAL.5.21, note: "De pulei « ventre ». mɔiyan yɔngɔnndo, pululen « l'ivrognerie, les excès de table » (GAL.5.21) ; mɔiyan a pululen (PRO.21.17, LUK.21.34) ; a pulule ndɔlen « à sa voracité » (JOB.20.21)."}
- {lemma: pumboo, status: attested, pos: noun, gloss: {fr: "nid, essaim (d'abeilles)", en: "nest, swarm (of bees)"}, domains: ["1.6.5", "6.4.4"], childs: {page: 312, form: "pùmbòó", sense: "nest of wasps or of a kind of ant"}, example: JDG.14.8, note: "mó komal lɛa pumboo o visi kalaa nin « il trouva un essaim d'abeilles dans le cadavre (du lion) » (JDG.14.8)."}
- {lemma: pundɔɔ, status: attested, pos: verb, gloss: {fr: "pétrir, humecter (la farine avec l'huile)", en: "knead, moisten (flour with oil)"}, domains: ["5.2.1"], childs: {page: 312, form: "pùndɔ̀ɔ́", sense: "squeeze, mash"}, example: EZK.46.14, note: "cuɛiyan … le kpeyanndo pundɔɔ « de l'huile pour humecter la farine » (EZK.46.14)."}
- {lemma: puulun, status: attested, pos: verb, gloss: {fr: "faire cas de, compter sur, s'attacher à ; tenir compte de (fautes)", en: "set one's mind on, rely on; take note of, keep account of (sins)"}, domains: ["3.2", "3.3"], childs: {page: 313, form: "pùùlɔ̌ŋndó", sense: "pay attention to, mark, mind"}, example: PSA.130.3, note: "Taa puulun pɛ tɛɛmbuula naalan « si tu tenais compte de nos fautes » (PSA.130.3) ; má puulun naŋɔɔ nɔmndo « tu t'es fiée à ta beauté » (EZK.16.15) ; Puulùn ɲɛdiaa ndɔ kɛndɔɔ le « ne convoite pas ses mets délicats » (PRO.23.3). Sens à préciser."}
- {lemma: saalan, status: attested, pos: verb, gloss: {fr: "faire attention à, se soucier de, tenir compte de ; (… le) négliger", en: "pay attention to, heed, care about; (… le) neglect"}, domains: ["3.2", "2.3.2"], childs: {page: 316, form: "sààlǎŋndó", sense: "pay attention, do what someone says (middle of 'catch')"}, example: MAT.22.5, note: "Kɛ a saalan sɔɛi ken te « mais ils n'en tinrent pas compte » (MAT.22.5) ; o co saalan te? « cela ne te fait rien ? » (LUK.10.40) ; vanlaandua saalan haa isɔɔ le-a « femmes insouciantes » (ISA.32.11). À distinguer de saalanin, futur de « attraper » (LUK.4.11)."}
- {lemma: saanaa, status: attested, pos: verb, forms: [saana], gloss: {fr: "nager", en: "swim"}, domains: ["7.2.1", "1.3"], childs: {page: 316, form: "sàànàá", sense: "swim, float; overflow (river)"}, example: EZK.47.5, note: "mɛnndan … vanáà del nin a saanaa « une eau où il fallait nager » (EZK.47.5) ; vana siɛndi balan le saanaa « le nageur étend les mains pour nager » (ISA.25.11) ; saana (ACT.27.42)."}
- {lemma: saani, status: attested, pos: verb, gloss: {fr: "planter, repiquer (un plant)", en: "plant, set out (a seedling)"}, domains: ["6.2.3"], childs: {page: 317, form: "sààn̂ìó", sense: "plant in a nursery; look beautiful; sign"}, example: EZK.17.5, note: "Forme courte ; la forme longue n'est pas dans la Bible. mó cua tɛyii yɔmndo pum …, mó kɔ saani ndi « il prit un plant … et alla le planter » (EZK.17.5)."}
- {lemma: saan, status: attested, pos: verb, gloss: {fr: "se mettre à, commencer à (faire)", en: "begin, set about (doing)"}, domains: ["8.4.6"], childs: {page: 317, form: "sàànɔ̌ŋndó", sense: "be held, hold oneself; start again (middle of 'hold')"}, example: GEN.33.4, note: "Mí nda ŋiɔn kpow a saan caŋndo « et tous deux se mirent à pleurer » (GEN.33.4) ; a saan sɛɛngianndo « ils se mirent à se quereller » (GEN.13.7)."}
- {lemma: saangian, status: attested, pos: verb, forms: [saangianndo], gloss: {fr: "peiner, se donner du mal, se fatiguer (à)", en: "toil, labour, weary oneself (at)"}, domains: ["2.4.4", "6.1"], childs: {page: 317, form: "sààŋìàŋndó", sense: "plural middle of 'tire'"}, example: PRO.23.4, note: "Saangian kiltan bolofaa kɔɔli le « ne te fatigue pas pour t'enrichir » (PRO.23.4) ; le yɛɛ niko mì kɔɛ saangian fondoo? « pourquoi me donner de la peine en vain ? » (JOB.9.29). De sangaa « être fatigué, peiner »."}
- {lemma: saasa, status: attested, pos: noun, gloss: {fr: "cage", en: "cage"}, domains: ["6.7.7", "6.3"], childs: {page: 317, form: "sáásáá", sense: "basket for holding chickens, chicken coop"}, example: EZK.19.9, note: "má vow ndu o saasa n'cilinndo nin « ils le mirent dans une cage de fer » (EZK.19.9)."}
- {lemma: saasalan, status: attested, pos: noun, gloss: {fr: "retranchements, ouvrages de siège (pl.)", en: "siege works, ramparts (pl.)"}, domains: ["4.8.3", "6.5.1"], childs: {page: 317, form: "sààsàá", sense: "barricade, fortified fence; an early women's dance"}, example: ISA.29.3, note: "Pluriel ; le singulier n'est pas dans la Bible. i baŋnin kungala saasalan « je dresserai contre toi des retranchements » (ISA.29.3, EZK.21.27) ; saasaala (ISA.29.7)."}
- {lemma: sandei, status: attested, pos: verb, gloss: {fr: "brûler, flamber, briller (feu, lampe)", en: "burn, blaze, shine (fire, lamp)"}, domains: ["5.5", "8.3.3"], childs: {page: 320, form: "sàndèí", sense: "burn, blaze, burst into flame"}, example: EXO.3.2, note: "Homographe de sandei « justice ». yinnden cɔu sandei vulɛi-vulɛi o bɔɔ nin « le feu flambait dans le buisson » (EXO.3.2) ; mi fitinalan la va sandei idii a icɔl « que les lampes brûlent jour et nuit » (EXO.27.20)."}
- {lemma: saŋnɔnndo, status: attested, pos: verb, forms: [saŋnɔn], gloss: {fr: "se répandre, être dispersé, éparpillé ; (nom) semailles", en: "be scattered, spread, poured out; (noun) sowing"}, domains: ["7.3.2", "6.2.3"], childs: {page: 322, form: "sàŋnɔ̌ŋndó", sense: "middle of 'sow'"}, example: EZK.34.5, note: "Moyen de saŋɔɔ « semer ; disperser ». má cuu saŋnɔn faw « elles se sont dispersées » (EZK.34.5) ; i co saŋnɔnndo maa mamɛn « je suis répandu comme de l'eau » (PSA.22.15) ; saŋnɔnndo a kownɔnndo « les semailles et la moisson » (GEN.8.22)."}
- {lemma: sasɔɔ, status: attested, pos: verb, forms: [sasu], gloss: {fr: "traîner (par terre)", en: "drag (along the ground)"}, domains: ["7.3.2"], childs: {page: 322, form: "sàsɔ̀ɔ́", sense: "slide, drag"}, example: ACT.14.19, note: "má sasu ndu o kobio kɔɔli « ils le traînèrent hors de la ville » (ACT.14.19) ; mì tunnda sasu nda « que les chiens les traînent » (JER.15.3) ; I co nɔm sasɔɔ o loolio nin (NAM.3.6). Voir sasun « ramper »."}
- {lemma: seemɛi, status: attested, pos: adj, forms: [seemɛiya, seemɛiyo, seemɛilan], gloss: {fr: "fou, insensé ; (vana seemɛi) un fou", en: "mad, insane, foolish; (vana seemɛi) madman"}, domains: ["3.1.2", "2.5.2"], childs: {page: 323, form: "sèèméí-", sense: "crazy, insane"}, example: 1SA.21.14, note: "De seemaa « folie ». maa vana seemɛi « comme un fou » (1SA.21.14, 2KI.9.20) ; vanaa seemɛiya (1SA.21.16) ; vana seemɛiyo (ECC.10.14) ; nààla seemɛilan « la folie » (DEU.28.28) ; O seema « il est fou » (JHN.10.20)."}
- {lemma: seemiaa, status: attested, pos: verb, forms: [seemiaanin], gloss: {fr: "faire errer, égarer ; affoler", en: "make wander, lead astray; strike with panic"}, domains: ["3.1.2", "7.2.1"], childs: {page: 323, form: "sèèmìá", sense: "act crazy (plural)"}, example: ZEC.12.4, note: "i seemiaanin soa « je frapperai d'affolement les chevaux » (ZEC.12.4) ; mì kɔɛ vɛlɛ hau seemiaa a nɔm? « te ferais-je errer avec nous ? » (2SA.15.20) ; naa malɔɔ seemiaamì (ISA.63.17)."}
- {lemma: selennda, status: attested, pos: noun, gloss: {fr: "sorte de sauterelles (pl.)", en: "a kind of locusts (pl.)"}, domains: ["1.6.1"], childs: {page: 324, form: "séléŋndó", sense: "edible tree-dwelling grasshoppers"}, example: LEV.11.22, note: "Pluriel ; le singulier n'est pas dans la Bible. Cité avec sóónɔa et paalenda (LEV.11.22, JOL.1.4, JOL.2.25)."}
- {lemma: sɛɛluu, status: attested, pos: verb, gloss: {fr: "racler, gratter (les murs)", en: "scrape (walls)"}, domains: ["7.7.5"], childs: {page: 325, form: "sɛ̀ɛ̀lùùwó", sense: "scrape, sharpen, plane (plural of 'scrape')"}, example: LEV.14.41, note: "Pluriel de salɔɔ « peler ». sɛɛluu cìì cɛiyo lenin kpow « il fera racler tout l'intérieur de la maison » (LEV.14.41)."}
- {lemma: sɛɛŋun, status: attested, pos: verb, gloss: {fr: "s'appuyer (sur, contre) ; s'étendre (sur un lit)", en: "lean (on, against); stretch out (on a couch)"}, domains: ["7.1", "7.1.3"], childs: {page: 326, form: "sɛ̀ɛ̀ŋɔ̌ŋndó", sense: "lean oneself against something"}, example: JDG.16.26, note: "haliko mi sɛɛŋun « afin que je m'y appuie » (JDG.16.26) ; Mɛɛ nda sɛɛŋun nɔm « quand ils s'appuyaient sur toi » (EZK.29.7) ; la sɛɛŋun kpɛŋɛla … coo « vous vous étendez sur vos divans » (AMO.6.4)."}
- {lemma: sɛɛsuu, status: attested, pos: verb, forms: [sɛɛsuunin, sɛɛsun], gloss: {fr: "traîner, entraîner (de force) ; (sɛɛsun) se retirer à l'écart", en: "drag, drag away; (sɛɛsun) withdraw, go off apart"}, domains: ["7.3.2"], childs: {page: 327, form: "sɛ̀ɛ̀sùùwó", sense: "drag, haul (plural of 'drag')"}, example: EZK.38.4, note: "Pluriel de sasɔɔ « traîner ». mì sɛɛsuu nɔm « je t'entraînerai » (EZK.38.4) ; a sɛɛsuunin niaa a bawla n'cilinndan « on vous traînera avec des crochets » (AMO.4.2) ; Mó sɛɛsun a nda lándán « il se retira avec eux à l'écart » (LUK.9.10)."}
- {lemma: sɛwviaa, status: attested, pos: verb, forms: [sɛwviaan, sɛwviallo], gloss: {fr: "écrire (plusieurs choses), rédiger (des lettres) ; (sɛwviallo) écrire à qqn", en: "write (several things), write letters; (sɛwviallo) write to someone"}, domains: ["3.5.7"], childs: {page: 327, form: "sɛ̀ɛ̀wìá", sense: "write (plural)"}, example: 1KI.21.8, note: "Pluriel de sɛvaa « écrire ». Yesabɛl sɛwviaa sɛbɛlan « Jézabel écrivit des lettres » (1KI.21.8) ; sɛbɛlan sɛwviallo « s'écrire des lettres » (NEH.6.17)."}
- {lemma: sɛmbaa, status: attested, pos: verb, forms: [sɛmba], gloss: {fr: "se détacher (d'un bloc)", en: "break off, be cut out (from a mass)"}, domains: ["7.8"], childs: {page: 327, form: "sɛ̀mbàá", sense: "break off or take away a part; whittle"}, example: DAN.2.45, note: "powvo sɛmba a ba ndɔ o pembei « une pierre se détacha de la montagne » (DAN.2.34, DAN.2.45)."}
- {lemma: sɛnndan, status: attested, pos: noun, gloss: {fr: "savon, potasse", en: "soap, lye"}, domains: ["5.6.2", "5.6.1"], childs: {page: 328, form: "sɛ̌ŋndáŋ", sense: "soap"}, example: JER.2.22, note: "Hali pulun bɛɛ a sodaa mà vownun sɛnndan coo taw « même si tu te laves avec du nitre et beaucoup de savon » (JER.2.22) ; pulun … a sɛnndan (JOB.9.30)."}
- {lemma: sɛvala, status: attested, pos: noun, gloss: {fr: "écriture (système d'écriture)", en: "script, writing (system)"}, domains: ["3.5.7"], childs: {page: 329, form: "sɛ̀wàláŋ", sense: "writings, publications (plural of 'write')"}, example: EST.3.12, note: "De sɛvaa « écrire ». sɛbɛla lan la sɛwviaan o sɛvala yɛ́-yɛ́lan nin « les lettres furent écrites dans l'écriture de chaque province » (EST.3.12)."}
- {lemma: siama, status: attested, pos: adj, gloss: {fr: "nombreux, beaucoup de", en: "many, numerous"}, domains: ["8.1"], childs: {page: 329, form: "síáámá-", sense: "a lot, many"}, example: LUK.4.41, note: "Un seul emploi : ɲinaa vɔɔnda bɛɛ va fulaa vanaa siama nin « des démons sortaient aussi de beaucoup de gens » (LUK.4.41)."}
- {lemma: siɛɛliaa, status: attested, pos: verb, forms: [siɛɛlia], gloss: {fr: "glisser, chanceler, tituber ; (nɛi … siɛɛliaa) chemin glissant", en: "slip, stagger, totter; (nɛi … siɛɛliaa) slippery path"}, domains: ["7.2.1"], childs: {page: 331, form: "sìɛ̀ɛ̀lìá", sense: "slip, slide (plural)"}, example: PSA.66.9, note: "Pluriel de siɛlaa « trébucher ». o co naa malɔɔ siɛɛliaa « il ne laisse pas nos pieds glisser » (PSA.66.9) ; mɛɛ vana mɔiyan ma co o hɔl-lo siɛɛliaa « comme un homme ivre qui titube » (ISA.24.20) ; nɛi vana siɛɛliaa coo (PSA.35.6)."}
- {lemma: siɛɛnduu, status: attested, pos: verb, forms: [siɛɛnduunin], gloss: {fr: "aplanir, rendre droit (les chemins)", en: "make straight, level (paths)"}, domains: ["8.3.1", "6.5.4"], childs: {page: 331, form: "sìɛ̀ɛ̀ndùùwó", sense: "straighten (plural of 'be straight'); sharpen"}, example: MAT.3.3, note: "Pluriel de sandu « être droit ». la siɛɛnduu nɛila ndɔla pɔmbɔlan « aplanissez ses sentiers » (MAT.3.3) ; ndu siɛɛnduunin nɛila nɔmndan « il aplanira tes sentiers » (PRO.3.6)."}
- {lemma: sii, status: attested, pos: adv, gloss: {fr: "seulement, rien que ; (haliko sii) pourvu que", en: "only, just, merely; (haliko sii) provided that"}, domains: ["9.2.2", "8.1"], childs: {page: 332, form: "síí", sense: "only, just"}, example: GAL.1.23, note: "Tueyɔɔ sii ndáà tuei ni « ils entendaient seulement dire » (GAL.1.23) ; Loonun maa hoeiye sii yoomu nuu co ni « souviens-toi que ma vie n'est qu'un souffle » (JOB.7.7) ; haliko sii sɔɛi Krista-e i co diminndo « pourvu que le Christ soit annoncé » (PHP.1.18)."}
- {lemma: siilian, status: attested, pos: verb, forms: [siilianndo], gloss: {fr: "s'exhorter, s'avertir (mutuellement)", en: "admonish, exhort (one another)"}, domains: ["3.5.1", "3.6"], childs: {page: 332, form: "sììlìá", sense: "advise (plural)"}, example: COL.3.16, note: "Pluriel de silaa « conseiller ». La pɛɛkuan mì la siilian vellaa-velle « instruisez-vous et exhortez-vous les uns les autres » (COL.3.16) ; siilianndo vellaa-velle (ROM.15.14, HEB.10.25)."}
- {lemma: siinian, status: attested, pos: verb, gloss: {fr: "connaître (des gens) ; (vanaa … siinian) connaissances, relations", en: "know (people); (vanaa … siinian) acquaintances"}, domains: ["3.2.3", "4.1"], childs: {page: 333, form: "sììnìáŋndó", sense: "know (many things), benefactive plural of 'know'"}, example: JOB.42.11, note: "Pluriel de sinaa « savoir, connaître ». vanaa ndáà siinian-nda kpede « tous ceux qui le connaissaient » (JOB.42.11) ; vanaa nda siinian-nda (2KI.12.6)."}
- {lemma: simnun, status: attested, pos: verb, gloss: {fr: "rester (immobile, tranquille), se tenir ; rester en arrière", en: "stay (still), stand; stay behind"}, domains: ["7.2.7", "7.1.1"], childs: {page: 334, form: "sìmnɔ̌ŋndó", sense: "stand by itself; change, turn into (middle of 'stand')"}, example: EXO.14.14, note: "Moyen de sim « s'arrêter, se tenir ». niaa la simnun yili « vous, restez tranquilles » (EXO.14.14) ; vanaa … kɔɔli-a nda simnun « ceux qui restèrent en arrière » (1SA.30.9) ; mà kɔ simnun o kɔngɔ « ils se tiendront sur le rivage » (EZK.27.29)."}
- {lemma: masindɛ, status: attested, pos: adj, forms: [masindɛa, masindɛlan, masindɛla, masindɛi, masindɔɔ, masindɔn, masindɛ-sindɔɔ, masindɛ-sindɔn], gloss: {fr: "ancien, d'autrefois ; (kabi masindɛ) depuis toujours ; (Bɛndu Yuu Masindɛ-Sindɔɔ) l'Ancien des jours", en: "ancient, of old; (kabi masindɛ) from of old; (Bɛndu Yuu Masindɛ-Sindɔɔ) the Ancient of Days"}, domains: ["8.4.5"], childs: {page: 335, form: "sìndè", sense: "(adj.) of an earlier time; sìndɔ̀ɔ́ 'old days'"}, example: PSA.78.2, note: "De sindɛ « autrefois ». Kabi masindɛ (1KI.14.30, PSA.74.12) ; dɛnnda viannannda masindɛlan « les mystères des temps anciens » (PSA.78.2) ; pembun masindɔn « les collines antiques » (GEN.49.26) ; tale masindɔɔ « un proverbe ancien » (1SA.24.14) ; Masindɛ-Sindɔɔ (DAN.7.9)."}
- {lemma: siondoolen, status: attested, pos: noun, class: len, forms: [siondoole, siondoei], gloss: {fr: "sort (tiré au sort) ; bâton, verge", en: "lot (cast); stick, rod"}, domains: ["4.7", "6.7"], childs: {page: 335, form: "sìòndòòléŋ", sense: "stick, twig, small whip, match"}, example: LEV.16.9, note: "Variante de sionnden. cuin toovi siondoolen le bii le Mɛlɛka-o « le bouc sur lequel le sort est tombé pour le Seigneur » (LEV.16.9) ; Siondoolen le nɔla … « le bâton peut-il … » (ISA.10.15) ; malnin siondoei « il a jeté le sort » (ISA.34.17)."}
- {lemma: pilɔɔ, status: attested, pos: adj, forms: [pilla, pilɔn, pilɛn], gloss: {fr: "un, un seul ; le même (accordé au nom)", en: "one, a single; the same (agreeing with the noun)"}, domains: ["8.1.1"], childs: {page: 301, form: "pìlé", sense: "one, a single, the same, alone; some"}, example: GEN.1.9, note: "Formes d'accord de pilɛ « un ». o baa pilɔɔ « en un seul lieu » (GEN.1.9) ; o diom pilɔɔ nin « d'un commun accord » (GEN.5.22) ; vanaa pilla « un seul peuple » (GEN.34.16) ; sɔɔn pilɔn mun « les mêmes paroles » (JDG.16.16) ; sɔɔn pilɛn mun (MAT.26.44)."}
- {lemma: pumndo, status: attested, pos: verb, gloss: {fr: "être rassasié ; satiété", en: "be full, satisfied; fullness"}, domains: ["5.2.2"], childs: {page: 312, form: "pùmndó", sense: "be full"}, example: DEU.8.10, note: "la vanin dioo mì la va pumndo « tu mangeras et tu seras rassasié » (DEU.8.10) ; mɛɛ ndóò nɔla pumndo yɛ « selon ce qu'il pouvait manger » (EXO.16.21). Voir pim « être rassasié »."}
- {lemma: salamayɛi, status: attested, pos: noun, forms: [sálámaa], gloss: {fr: "splendeur, gloire, beauté ; (sálámaa) beau, gracieux", en: "splendour, glory, beauty; (sálámaa) handsome, graceful"}, domains: ["8.3.7", "4.5.6"], childs: {page: 319, form: "sálámáá", sense: "favourite or cherished child"}, example: ISA.60.21, note: "o cɔm salamayɛi masɛi-yo « la splendeur des royaumes » (ISA.13.19) ; le salamayɛi nii cɔmndo « pour manifester ma gloire » (ISA.60.21) ; sálámaa lekɛ́ndɛi o va ni « il était beau de figure » (GEN.39.6). Le lien avec le sens de Childs (enfant chéri) est incertain."}
- {lemma: siɔ́ŋndo, status: attested, pos: verb, forms: [sɛŋ], gloss: {fr: "dépecer, découper (une bête abattue) ; écorcher", en: "butcher, cut up (a slaughtered animal); flay"}, domains: ["5.2.1", "6.3"], childs: {page: 336, form: "sìɔ́ŋndó", sense: "butcher, slaughter"}, example: 2CH.35.11, note: "leviia nda va cɔlua sálàá siɔ́ŋndo « les lévites dépeçaient les bêtes » (2CH.35.11) ; a sɛŋ saa kóndó kon, a diw ndu kundalan « tu découperas le bélier en morceaux » (EXO.29.17) ; mà sɛŋ ndu (1KI.18.23)."}
- {lemma: solɔɔ, status: attested, pos: noun, forms: [sol], gloss: {fr: "besoin naturel, excréments ; (sol) faire ses besoins", en: "need to defecate, excrement; (sol) relieve oneself"}, domains: ["2.2.8"], childs: {page: 338, form: "sòlɔ̀ɔ́", sense: "defecate"}, example: DEU.23.14, note: "te solɔɔ bii ndu pɛ, o kɔ tow soondo … o sol lenin « quand le besoin le prend, il creusera un trou … et s'y soulagera » (DEU.23.14)."}
- {lemma: sooluula, status: attested, pos: noun, forms: [sooluulan], gloss: {fr: "lieux de culte (pl.), sanctuaires ; (o sooluulan) aux hauts lieux", en: "places of worship (pl.), shrines; (o sooluulan) at the high places"}, domains: ["4.9.8"], childs: {page: 339, form: "sòòlúúláŋ", sense: "place of worship or praise"}, example: LEV.26.30, note: "De sooloo « adorer ». mì tɛɛmbuu sooluula niaalan « je détruirai vos hauts lieux » (LEV.26.30) ; o sooluulan vannda va sálàlan solio ni « le peuple sacrifiait sur les hauts lieux » (1KI.3.2)."}
- {lemma: sɔmndo, status: attested, pos: verb, forms: [sɔm], gloss: {fr: "mâcher, manger, dévorer ; (ciŋndon sɔmndo) grincer des dents", en: "chew, eat, devour; (ciŋndon sɔmndo) gnash one's teeth"}, domains: ["5.2.2"], childs: {page: 338, form: "sɔ̀mndó", sense: "chew"}, example: MAT.13.42, note: "Childs le cite comme base des formes sòmìó, sòmìlló. nɛɛ caŋndan a ciŋndon sɔmndo vanin « là il y aura des pleurs et des grincements de dents » (MAT.13.42) ; mì la va saa kóndóa téndéa sɔmndo « vous mangez les agneaux » (AMO.6.4) ; le ya sɔmndo « pour me dévorer » (PSA.27.2)."}
- {lemma: sɔndan, status: attested, pos: verb, forms: [sɔndanndo, sɔndannin], gloss: {fr: "s'enfuir, se sauver, s'échapper ; (sɔndanndo) aller à l'écart (faire ses besoins)", en: "flee, run away, escape; (sɔndanndo) go aside (to relieve oneself)"}, domains: ["7.2.3", "2.2.8"], childs: {page: 340, form: "sɔ̀ndǎŋndó", sense: "enter the woods (also a euphemism for defecating)"}, example: EXO.2.15, note: "mí Moise sɔndan, mó kɔ viannun o lɛŋnde Madian-nden nin « Moïse s'enfuit et alla se cacher au pays de Madian » (EXO.2.15) ; fondokpaa … le vaa kɔlan sɔndanndo lon « un endroit où aller faire tes besoins » (DEU.23.13) ; Bɔɔle sɔndanndo o co ni « il doit se soulager » (JDG.3.24)."}
- {lemma: sɔɔsɔɔ, status: attested, pos: adv, gloss: {fr: "en secret, en cachette, à part", en: "secretly, in private"}, domains: ["7.6", "9.2.2"], childs: {page: 341, form: "sɔ́ɔ́sɔ́ɔ́"}, example: MAT.17.19, note: "má ɲuna ndu sɔɔsɔɔ « ils lui demandèrent en particulier » (MAT.17.19) ; Ɲɛm kean sɔɔsɔɔ-on « les présents donnés en cachette » (PRO.17.23)."}
- {lemma: suendi, status: attested, pos: verb, forms: [suendì-suendiaalan], gloss: {fr: "recoudre, rapiécer ; (suendì-suendiaalan) rapiécé de toutes parts", en: "sew up, patch; (suendì-suendiaalan) patched all over"}, domains: ["6.6.1", "7.9.4"], childs: {page: 342, form: "sùèndìó", sense: "sew (plural)"}, example: JOS.9.4, note: "Pluriel de sɔndɔɔ « coudre ». bɔlɔla yáwla … sɛɛsiɛila ndáà mingi suendi lan « des outres usées, déchirées et recousues » (JOS.9.4) ; samtala yuulula suendì-suendiaalan « des sandales usées et rapiécées » (JOS.9.5)."}
- {lemma: sɔɛi, status: attested, pos: noun, class: i, plural: sɔɔn, gloss: {fr: "parole, affaire, chose dite ; (pl. sɔɔn) paroles, langues, nouvelles", en: "word, matter, thing said; (pl. sɔɔn) words, languages, news"}, domains: ["3.5.1", "3.5.3"], childs: {page: 343, form: "sùɛ́í", sense: "discussion, matter, palaver, trouble (pl. sɔ̀ɔ́ŋ)"}, example: GEN.18.21, note: "Le nom correspondant au verbe sɔɛi « parler ». toɲaa sɔɔn ya co tueyɔɔ « si ce que j'entends est vrai » (GEN.18.21) ; sɔɔn ndan mangalan « leurs langues » (GEN.10.5) ; sɔɛi he « cette affaire » (EZR.6.9)."}
- {lemma: suɛɛnde, status: attested, pos: noun, class: i, gloss: {fr: "charbon de bois", en: "charcoal"}, domains: ["5.5.6"], childs: {page: 343, form: "sùɛ́ɛ́ŋndé"}, example: PRO.26.21, note: "Suɛɛnde yɔngu dɛngultan ni « le charbon donne la braise » (PRO.26.21) ; mì i mɛndul suɛɛnde « il allume les charbons » (JOB.41.13) ; yinnden fuulaa le suɛɛnde biyɔɔ (ISA.54.16)."}
- {lemma: sulan, status: attested, pos: verb, gloss: {fr: "être égal à, être semblable à (… a)", en: "be equal to, be like (… a)"}, domains: ["8.3", "9.6"], childs: {page: 344, form: "sùlâŋndó", sense: "(noun) an equal, equivalent"}, example: EXO.8.6, note: "vana-vana sulan a Mɛlɛka le, Hala naa pɛɛn « nul n'est semblable au Seigneur notre Dieu » (EXO.8.6) ; i sulan bɛɛ a buɛyaa nɔmaa laandua ha o pilɛ le « je ne suis même pas l'égale d'une de tes servantes » (RUT.2.13)."}
- {lemma: sumaa, status: attested, pos: verb, forms: [suma], gloss: {fr: "être aveugle, devenir aveugle ; cécité", en: "be blind, go blind; blindness"}, domains: ["2.5.4"], childs: {page: 344, form: "sùmàá"}, example: GEN.19.11, note: "mí vana-vana suma « et chacun fut frappé de cécité » (GEN.19.11) ; seemɛilan, sumaa « la folie, la cécité » (DEU.28.28) ; o suma « il est né aveugle » (JHN.9.2). Voir sumɛiyo, suumiaa."}
- {lemma: sɔngɔ, status: attested, pos: prep, gloss: {fr: "à la place de, en échange de, pour (compensation)", en: "in place of, in exchange for, for (compensation)"}, domains: ["6.8.4", "9.2.4"], childs: {page: 340, form: "sɔ́ŋgɔ́ɔ́", sense: "(noun) substitute, replacement"}, example: EXO.21.26, note: "Homographe de sɔngɔ « querelle ». o bɛnda mò ke ndu hɔ́ɔ́yɛi ndɔɛi sɔngɔ hɔlte « il lui rendra la liberté en compensation de l'œil » (EXO.21.26) ; o sala cɔlua nda ŋiɔn sɔngɔ cɔlu pilɛ « il rendra deux bêtes pour une » (EXO.22.3) ; nakɔ … celen sɔngɔ nakɔ nɔmndo ho « une autre vigne à la place de celle-ci » (1KI.21.2)."}
- {lemma: sùnndo, status: attested, pos: noun, class: o, gloss: {fr: "pilon ; meule (supérieure)", en: "pestle; (upper) millstone"}, domains: ["6.7.2", "5.2.1"], childs: {page: 345, form: "sùŋndó", sense: "tree whose wood is used for pestles; pestle; its leaves"}, example: DEU.24.6, note: "bii sùnndo a ciei o landei nin « prendre en gage la meule ou le mortier » (DEU.24.6) ; mɛɛ vana cu kullon a sunndo « comme on pile le grain au pilon » (PRO.27.22) ; diom lasunndo « le bruit de la meule » (JER.25.10)."}
- {lemma: susul, status: attested, pos: verb, gloss: {fr: "vomir, cracher (un flot d'eau)", en: "spew, spout (a stream of water)"}, domains: ["2.2.3", "1.3.2"], childs: {page: 345, form: "sùsùlló", sense: "spit, spray a liquid from the mouth"}, example: REV.12.15, note: "mí tambálakáà susul mɛnndan vanalanɔɔ kɔɔli maa pee bɛndu « le dragon vomit de l'eau comme un fleuve derrière la femme » (REV.12.15, REV.12.16)."}
- {lemma: súúndùla, status: attested, pos: noun, gloss: {fr: "prépuces (pl.)", en: "foreskins (pl.)"}, domains: ["2.1.2", "4.9.5"], childs: {page: 346, form: "súùndóó", sense: "foreskin; also elephant shrew"}, example: 1SA.18.25, note: "Pluriel ; le singulier n'est pas dans la Bible. Ɲɛ o yeema daama-o co súúndùla Filistia kɛmɛ « il ne demande que cent prépuces de Philistins » (1SA.18.25, 1SA.18.27, 2SA.3.14)."}
- {lemma: tafiei, status: attested, pos: noun, class: i, plural: tafion, gloss: {fr: "dartre, éruption (de la peau), croûte", en: "rash, scab, eruption (of the skin)"}, domains: ["2.5.2", "2.1.4"], childs: {page: 347, form: "tàfìèí", sense: "skin disease with dry flaky skin"}, example: LEV.13.2, note: "Te kpukpuei, tafiei, te kon te sɔŋndo pum fula pɛ vanndo lekɔɔ « s'il paraît sur la peau d'un homme une tumeur, une dartre ou une tache » (LEV.13.2) ; le tafion (LEV.14.55)."}
- {lemma: tambei, status: attested, pos: noun, class: i, forms: [tambɛi], gloss: {fr: "ruine, perdition, désolation ; (kɔl tambɛi) tristesse, regret", en: "ruin, destruction, desolation; (kɔl tambɛi) sorrow, grudging"}, domains: ["7.9.3", "4.4.2"], childs: {page: 348, form: "tàmbèí", sense: "poverty"}, example: NUM.14.41, note: "Nom de tambu « être ruiné ». A sina vɔ maa tambei le Esipte tambu « ne sais-tu pas que l'Égypte est ruinée ? » (EXO.10.7) ; Tambei niaa co kɔlan « vous allez à votre perte » (NUM.14.41) ; o va a kɔl tambɛi le « sans regret » (DEU.15.10) ; dɛnɛ tambɛi « les ravages » (PSA.46.9)."}
- {lemma: tangulta, status: attested, pos: noun, plural: tangultan, gloss: {fr: "bâtiments, constructions (pl.) ; (tangulta) villes bâties", en: "buildings, constructions (pl.)"}, domains: ["6.5.1"], childs: {page: 350, form: "tàŋúlló", sense: "(noun) building (pl. tàŋúltáŋ)"}, example: MRK.13.1, note: "Nom de tangullo « bâtir ». Tangultan ndan la naŋ dɛ! « quelles constructions ! » (MRK.13.1) ; mó tosa tangultan taw « il fit beaucoup de constructions » (2CH.27.3) ; tangulta sɛnɛilan (1CH.11.8)."}
- {lemma: tangulun, status: attested, pos: verb, forms: [tangulɔn, tangulɔnndo, tangulunnin], gloss: {fr: "se bâtir (pour soi) ; être bâti, construit", en: "build for oneself; be built"}, domains: ["6.5"], childs: {page: 350, form: "tàŋùlɔ̌ŋndó", sense: "be built (middle of 'build')"}, example: GEN.11.4, note: "Moyen de tangullo. N tangulun kobio « bâtissons-nous une ville » (GEN.11.4) ; Cɛi kon co tangulɔnndo tuŋ « la maison est en construction » (EZR.5.16) ; cɛi tangulun a yɔmii sɛɛdrei-yo nin « une maison bâtie en cèdre » (2SA.7.2)."}
- {lemma: tase, status: attested, pos: adj, forms: [tasela, taselan], gloss: {fr: "premier, aîné ; (pl.) premiers, anciens, précédents", en: "first, firstborn, elder; (pl.) first, former"}, domains: ["8.1.1", "8.4.5"], childs: {page: 350, form: "tàsé", sense: "first, at first, originally"}, example: GEN.25.25, note: "Forme d'accord de tasoo « premier ». O tase o velu-o « le premier qui naquit » (GEN.25.25) ; cua ndɔ tase « sa fille aînée » (GEN.19.34) ; powta yɛ́ndɛ́la tasela « les premières tables » (DEU.10.2) ; vɔsila taselan « les premières années » (GEN.41.31)."}
- {lemma: ɲumio, status: attested, pos: verb, gloss: {fr: "éteindre (le feu)", en: "extinguish, quench (fire)"}, domains: ["5.5"], childs: {page: 282, form: "ɲùmìó", sense: "extinguish, put out (causative of 'go out')"}, example: ISA.1.31, note: "Causatif de ɲumndo « s'éteindre » ; même forme que ɲumi « effacer, anéantir ». Vana-vana venin le yinnde len ɲumio le « personne ne l'éteindra » (ISA.1.31, AMO.5.6, JER.21.12) ; kɔɔn … kpow ɲumio « éteindre toutes les flèches enflammées » (EPH.6.16)."}
- {lemma: o kon kɔɔli, status: attested, pos: adv, gloss: {fr: "après cela, ensuite, puis", en: "after that, then, afterwards"}, domains: ["8.4.5", "9.6.3"], childs: {page: 285, form: "ó kɔ́ŋ kɔ́ɔ́lì", sense: "in addition, moreover, besides"}, example: GEN.2.8, note: "Litt. « derrière cela » : o … kɔɔli « derrière, après » et kon « cela ». O kon kɔɔli, mí Mɛlɛka Hala soli nakɔɔ … « ensuite le Seigneur Dieu planta un jardin … » (GEN.2.8). Très fréquent en début de phrase."}
- {lemma: paale siaalen, status: attested, pos: noun, gloss: {fr: "point du jour, aube", en: "daybreak, dawn"}, domains: ["8.4.1"], childs: {page: 286, form: "pààlé-síàléŋ"}, example: GEN.19.15, note: "De paalen « jour, soleil » et siɔu « se lever (le jour) ». A telen paale siaalen « à l'aube » (GEN.19.15) ; háá telen paale siaalen « jusqu'au lever du jour » (GEN.32.25)."}
- {lemma: pala, status: attested, pos: verb, forms: [palan, palanin], gloss: {fr: "nuire à, maltraiter, tourmenter ; tromper ; déranger ; (palan) se nuire, se tromper soi-même", en: "harm, wrong, torment; deceive; bother; (palan) harm or deceive oneself"}, domains: ["4.8", "4.3"], childs: {page: 287, form: "pàlàá", sense: "bother, tease, harass, hinder"}, example: LUK.11.7, note: "Pala ya le! « ne m'importune pas ! » (LUK.11.7) ; La pala miallo le « n'opprimez pas l'étranger » (JER.22.3) ; Kɛwvo pálá ya « le serpent m'a trompée » (GEN.3.13) ; ɲɔɔ pala nda taw « ils furent furieux » (ACT.7.54) ; paangei palanin nɔm icɔl te « la lune ne te frappera pas la nuit » (PSA.121.6)."}
- {lemma: pasa, status: check, pos: verb, gloss: {fr: "s'irriter, menacer (?)", en: "get angry, threaten (?)"}, domains: ["3.4.2"], childs: {page: 289, form: "pàsàá", sense: "spread one's legs; dance; bristle with vexation"}, example: 1PE.2.23, note: "Un seul emploi : ndu nda saangiaa, o pasa loo « quand on le maltraitait, il ne menaçait pas » (1PE.2.23). Sens déduit du contexte et du sens « s'irriter » donné par Childs ; à confirmer."}
- {lemma: pembulen, status: attested, pos: noun, class: len, forms: [pembule, pembulan], gloss: {fr: "région montagneuse (lɛŋnde n'pembulen « pays de montagnes »)", en: "hill country (lɛŋnde n'pembulen 'hill country')"}, domains: ["1.2.1", "4.6.7"], childs: {page: 292, form: "pèmbèí", sense: "hill, mountain"}, example: LUK.1.65, note: "Dérivé de pembei « montagne ». o lɛŋnde n'pembule Yuda len nin « dans le pays de montagnes de Juda » (LUK.1.65) ; o lɛŋnde n'pembulen nin (GEN.12.8, NUM.14.44)."}
- {lemma: pɛ́, status: attested, pos: ideo, gloss: {fr: "complètement, tout à fait (disparaître, s'effondrer)", en: "completely, entirely (vanish, collapse)"}, domains: ["9.2.8", "8.1.5"], childs: {page: 294, form: "pɛ́", sense: "all, completely, at all"}, example: JOB.8.22, note: "Accentué ; à distinguer de pɛ « si ». cɛila … vanaa vɔɔnda la lo pɛ́ « les tentes des méchants disparaîtront » (JOB.8.22) ; o lonnun pɛ́ « (la richesse) disparaît » (PRO.23.5) ; Ninivea vi n'diallon pɛ́ « Ninive s'effondre » (NAM.2.11)."}
- {lemma: pialaa, status: attested, pos: adj, gloss: {fr: "brisé, rompu ; (sɛbɛ pialaa) lettre de divorce", en: "broken; (sɛbɛ pialaa) certificate of divorce"}, domains: ["7.8.1", "2.6.1"], childs: {page: 298, form: "pìàlàá", sense: "cracked open (adj. from 'crack')"}, example: MAT.5.31, note: "De piɔlɔɔ « briser ». mɛɛ o yɔngu ndu sɛbɛ pialaa « qu'il lui donne une lettre de divorce » (MAT.5.31, MRK.10.4)."}
