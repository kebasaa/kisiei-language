- {lemma: seesiɛi, status: attested, pos: noun, class: i, gloss: {fr: "rébellion, révolte", en: "rebellion, revolt"}, domains: ["4.8", "4.6"], example: 2CH.10.19, note: "tosa seesiɛi a … « se révolter contre … » ; luɛi o seesiɛi « entrer en rébellion »."}
