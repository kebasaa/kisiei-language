# Words of the Kisiei Bible (BKG), batch 8: forms in pɛ, s, t, ɔ, ɛ not yet in the lexicon.
# Meanings are worked out from the verse contexts. All forms follow the Kisiei Bible (BKG).

- {lemma: pɛɛn, status: attested, pos: part, gloss: {fr: "c'est-à-dire, à savoir (particule d'apposition)", en: "namely, that is (appositive particle)"}, domains: ["9.2.6", "9.6.3"], example: GEN.4.2, note: "Suit un groupe qui précise le précédent : Abɛl, pɔmbɔɔ Kain pɛɛn « Abel, le cadet de Caïn » (Gn 4,2) ; koovan pɛɛn « c'est-à-dire son sang » (Gn 9,4)."}
- {lemma: pɛngɛlaa, status: attested, pos: verb, forms: [pɛngɛla, pɛngɛliaa], gloss: {fr: "étendre, étaler (un tissu sur qqch.)", en: "spread out (a cloth over something)"}, domains: ["7.3.7", "7.3.2"], childs: {page: 297, form: "pɛ̀ŋgɛ̀làá", sense: "spread out (e.g. cloth to dry); also make a matter big"}, example: NUM.4.7, note: "pɛngɛliaa (Pr 7,16 ; Mt 21,8 « étendre des vêtements sur le chemin ») semble en être la forme plurielle ou intensive."}
- {lemma: pɛngɛlanndo, status: attested, pos: verb, forms: [pɛngɛlan, pɛngɛlannin], gloss: {fr: "s'étendre, se répandre", en: "spread, extend (itself)"}, domains: ["8.2", "7.2"], childs: {page: 297, form: "pɛ̀ŋgɛ̀lăŋndó", sense: "spread oneself out"}, example: LEV.13.6, note: "Moyen de pɛngɛlaa : sɔŋndo … pɛngɛlan « la tache s'est étendue » (Lv 13,51)."}
- {lemma: pɛŋnden, status: attested, pos: noun, class: len, forms: [pɛŋnde], gloss: {fr: "manque, besoin, pauvreté", en: "want, need, poverty"}, domains: ["6.8.1", "4.4.2"], childs: {page: 297, form: "pɛ̀ŋndéŋ", sense: "lack, need, poverty; also state of being jammed"}, example: DEU.28.48, note: "pɛŋnde ɲɛdiaa « manque de pain, famine » (Am 8,11)."}
- {lemma: pɛɛliaa, status: attested, pos: verb, forms: [pɛɛliaanin], gloss: {fr: "rugir, gronder (lion, tonnerre) ; hurler (chiens)", en: "roar, rumble (lion, thunder); howl (dogs)"}, domains: ["1.6.4", "1.1.3"], example: JOB.37.4}
- {lemma: pɛɛngaa, status: attested, pos: verb, forms: [pɛɛnga, pɛɛngaalan], gloss: {fr: "déployer (les ailes), planer ; s'ouvrir (fleur)", en: "spread (wings), hover; open (of flowers)"}, domains: ["1.6.4", "7.2.1"], example: DEU.32.11, note: "Kɔl Hala-o va o pɛɛngaa o mɛmma man coo « l'Esprit de Dieu planait au-dessus des eaux » (Gn 1,2) ; peengela pɛɛngaalan « fleurs épanouies » (1 R 6,32)."}
- {lemma: sabu, status: attested, pos: noun, gloss: {fr: "cause, raison ; (le sabu yɛɛ) pourquoi ; (le sabu kon) c'est pourquoi", en: "cause, reason; (le sabu yɛɛ) why; (le sabu kon) therefore"}, domains: ["9.6"], childs: {page: 318, form: "sábòó", sense: "reason, cause, meaning; also an act of kindness"}, example: DEU.10.9}
- {lemma: sanaa, status: attested, pos: adv, gloss: {fr: "tout droit, directement", en: "straight, straight ahead, directly"}, domains: ["8.5.2", "9.2.2"], childs: {page: 320, form: "sánáá"}, example: JOS.6.5}
- {lemma: sandu, status: attested, pos: verb, forms: [sandunin], gloss: {fr: "être droit, être juste ; paraître bon (à qqn)", en: "be upright, be right; seem right (to someone)"}, domains: ["4.3.1"], childs: {page: 320, form: "sàndɔ̀ɔ́", sense: "be straight, be honest; also be bright, blaze (lamp, fire)"}, example: 1KI.9.4, note: "Verbe correspondant à l'adjectif sandaa ; vana sandu-o « l'homme juste » (Ez 18,5) ; mɛɛ o sandu nɔm o hɔl « comme il te semble bon » (Jos 9,25). En Nb 11,3, yinnde … le sandu vannda tɛɛn « le feu brûla parmi eux » : sens « flamber », comme en kissi du Sud."}
- {lemma: sangalaa, status: attested, pos: verb, forms: [sangala, sangalanin], gloss: {fr: "louer, glorifier, exalter", en: "praise, glorify, exalt"}, domains: ["4.9.5", "3.5.1"], childs: {page: 321, form: "sàŋàlàá", sense: "praise, esp. by singing; also tie logs together to make a ladder"}, example: JDG.16.24, note: "À distinguer de sangalan « peines, souffrances » (Gn 3,16), de la famille de sangaa « peiner »."}
