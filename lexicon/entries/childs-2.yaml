# Words found by going through Childs (2000), A Dictionary of the Kisi Language, printed pages 71-140,
# and looking for the northern counterpart of each headword in the Kisiei Bible (BKG).
# Forms, tones and meanings follow the Bible; Childs gives only the page, the Southern headword
# and, where it differs, the Southern sense. Words found only in Keita (1979) are respelled.

- {lemma: dangalaa, status: attested, pos: noun, plural: dangaltan, gloss: {fr: "bord, lisière, côté ; (pl.) bords (d'un champ)", en: "edge, border, side; (pl.) edges (of a field)"}, domains: ["8.6.6"], childs: {page: 71, form: "dáŋgáláá", sense: "boundary, edge; the area just outside a cleared field"}, example: LEV.19.9, note: "o mɛmma ihɛllan dangalaa « au bord de la mer Rouge » (EXO.14.2) ; háá o dangaltan « jusqu'aux bords (du champ) » (LEV.23.22)."}
- {lemma: dengelaa, status: attested, pos: verb, forms: [dengela, dengelan, dengelanndo, dengeliaa], gloss: {fr: "entasser, amonceler ; (dengelanndo) s'amonceler, s'attrouper", en: "heap up, pile up; (dengelanndo) pile up, crowd together"}, domains: ["7.5.1", "7.5.9"], childs: {page: 73, form: "dèŋgèlàá", sense: "stack, pile up"}, example: PRO.25.22, note: "dɛngultan … n co ndu dengelaa o lebol « tu amasses des charbons sur sa tête » (PRO.25.22) ; sɛ́lɛ́ bɛndoo dengelanndo « une foule qui accourait » (MRK.9.25)."}
- {lemma: deŋullo, status: attested, pos: verb, forms: [deŋul], gloss: {fr: "crier à, apostropher ; menacer, réprimander", en: "shout at, call out to; rebuke, threaten"}, domains: ["3.5.1"], childs: {page: 74, form: "dèŋùlló", sense: "yell at someone, shout for or after someone"}, example: 1SA.17.43, note: "Bénéfactif de deŋio « crier ». Mó deŋul mɛmma ihɛlma makpɛ̀ndɛ̀an « il menaça la mer Rouge » (PSA.106.9)."}
- {lemma: diikɔnndo, status: attested, pos: verb, gloss: {fr: "servir, être au service de (qqn)", en: "serve, wait on (someone)"}, domains: ["4.5", "6.1"], childs: {page: 78, form: "dìkɔ̌ŋndó", sense: "show loyalty, be obedient or submissive"}, example: 1KI.1.4, note: "Une seule occurrence : a ndu diikɔnndo « elle le servait » (1KI.1.4)."}
- {lemma: diilɛn, status: attested, pos: adv, gloss: {fr: "le matin, ce matin, de bon matin", en: "in the morning, this morning, early"}, domains: ["8.4.1"], childs: {page: 78, form: "dìílɛ̀ŋ"}, example: LUK.24.22, note: "Diilɛn púŋ « de grand matin » (LUK.24.22) ; kabi diilɛn « depuis ce matin » (RUT.2.7)."}
- {lemma: dikpisiie, status: attested, pos: adj, gloss: {fr: "épais, très sombre (nuage)", en: "thick, very dark (cloud)"}, domains: ["8.3.3", "1.1.3"], childs: {page: 79, form: "díkpìsìì", sense: "looming, dark like a thundercloud"}, example: 2SA.22.10, note: "Une seule occurrence : kumii tiŋii dikpisiie « une nuée noire et épaisse » (2SA.22.10)."}
- {lemma: diɔmnde, status: attested, pos: noun, gloss: {fr: "folie, sottise, stupidité", en: "folly, foolishness, stupidity"}, domains: ["3.2", "4.3"], childs: {page: 83, form: "dìɔ̀mndé"}, example: PRO.9.6, note: "Voir diɔmndo « sot ». La mal diɔmnde « abandonnez la sottise » (PRO.9.6)."}
- {lemma: diuvɛi, status: attested, pos: adj, gloss: {fr: "mûr (fruit)", en: "ripe (fruit)"}, domains: ["1.5.6", "5.2.3"], childs: {page: 85, form: "dìùwɔ̀ɔ́", sense: "be red (yellow), be ripe; also temper iron, be drunk"}, example: AMO.8.1, note: "yɔmii koamɛi diuvɛi « des fruits mûrs » (AMO.8.1-2)."}
- {lemma: doŋ, status: attested, pos: ideo, forms: [doŋ-doŋ], gloss: {fr: "silencieusement, dans un calme complet (ɲɔɔ mei doŋ « tout se tut »)", en: "silently, in complete calm (ɲɔɔ mei doŋ 'all was still')"}, domains: ["9.2.8", "2.3.2"], childs: {page: 87, form: "dóŋ", sense: "quietly, silently, gently"}, example: MAT.8.26, note: "doŋ-doŋ (ISA.64.9, REV.8.1)."}
- {lemma: dɔndɔɔ, status: attested, pos: noun, forms: [dɔndɔ], gloss: {fr: "prêt, emprunt, dette", en: "loan, debt"}, domains: ["6.8.4"], childs: {page: 88, form: "dɔ́ndɔ́ɔ́", sense: "loan, credit"}, example: EZK.18.13, note: "niaa cuenin dɔndɔ le « vous n'emprunterez pas » (DEU.28.12) ; Mɛlɛka salanin dɔndɔ kon « le Seigneur rendra ce prêt » (PRO.19.17)."}
- {lemma: dɔndan, status: attested, pos: verb, gloss: {fr: "emprunter", en: "borrow"}, domains: ["6.8.4"], childs: {page: 88, form: "dɔ̀ndǎŋndó"}, example: PSA.37.21, note: "Moyen de dɔndaa « prêter ». Vana kɔlvesɛiyo dɔndan pɛ ɲɔɔ, o mingi le « le méchant emprunte et ne rend pas » (PSA.37.21)."}
- {lemma: dɔ́ɔ́, status: attested, pos: part, gloss: {fr: "alors, dès lors (moment atteint) ; (te … dɔ́ɔ́ pɛ) dès que, aussitôt que", en: "then, by then (point reached); (te … dɔ́ɔ́ pɛ) as soon as, once"}, domains: ["9.2.6", "8.4.5"], childs: {page: 88, form: "dɔ́ɔ́", sense: "as soon as; marks a moment that is now relevant"}, example: GEN.3.5, note: "te la de dɔ́ɔ́ pɛ … « le jour où vous en mangerez … » (GEN.3.5) ; mí Noe sina dɔ́ɔ́ maa … « Noé sut alors que … » (GEN.8.11)."}
- {lemma: dumbulen, status: attested, pos: noun, class: len, plural: dumbon, forms: [dumbule, dumbun], gloss: {fr: "racine ; souche", en: "root; stock"}, domains: ["1.5.5"], childs: {page: 90, form: "dùmbùéí", sense: "buttress or stilt roots, roots standing above the ground"}, example: ISA.14.30, note: "dumbule ndɔlen le vesa « leur racine est desséchée » (HOS.9.16) ; mó soli dumbon « elle poussa des racines » (PSA.80.10) ; o dumbun ndɔn « de ses racines » (ISA.11.1)."}
- {lemma: duuva, status: attested, pos: verb, gloss: {fr: "rabrouer, faire honte à, écarter", en: "rebuff, reproach, keep away"}, domains: ["4.8", "3.5.1"], childs: {page: 91, form: "dùùwàá", sense: "exclude, discriminate against, ostracize"}, example: RUT.2.15, note: "Une seule occurrence : vana-vana bɛnda mò duuva ndu le « que personne ne la rabroue » (RUT.2.15)."}
- {lemma: dúkúdúkùlan, status: attested, pos: noun, forms: [dúkúdúkùla], gloss: {fr: "collines, buttes, bosses (du terrain)", en: "hills, humps, rounded heights"}, domains: ["1.2.1"], childs: {page: 90, form: "dùkúlú", sense: "(ideophone) stout, stocky, short and round"}, example: ISA.40.4, note: "Pluriel. Pembii nɔ dúkúdúkùlan « montagne aux nombreux sommets » (PSA.68.16)."}
- {lemma: ɛ̀ɛ̀, status: attested, pos: interj, gloss: {fr: "eh bien ! ah ! (constat, insistance)", en: "well! ah! (realization, emphasis)"}, domains: ["9.2.7"], childs: {page: 92, form: "ɛ̀ɛ̀hɛ́ɛ́", sense: "expresses realization or discovery"}, example: 1SA.1.27, note: "Ɛ̀ɛ̀ lekɛ́ndɛi « oui, vraiment » (1SA.1.27) ; voir hɛ́ɛ̀ (Ɛ̀ɛ̀ hɛ́ɛ̀ !, GEN.2.23)."}
- {lemma: éé, status: attested, pos: interj, gloss: {fr: "ô ! (vocatif, en s'adressant à qqn)", en: "O! (vocative, addressing someone)"}, domains: ["9.2.7"], childs: {page: 92, form: "ê", sense: "vocative particle"}, example: GEN.49.18, note: "Éé Mɛlɛka ! « Ô Seigneur ! » (GEN.49.18) ; Éé Pua « Ô mon père » (GEN.27.34)."}
- {lemma: fandaa, status: attested, pos: verb, forms: [fanda, faandia], gloss: {fr: "donner en présent, offrir ; (nom) présent, cadeau ; (faandia) distribuer des présents", en: "give as a present, offer; (noun) gift, present; (faandia) hand out gifts"}, domains: ["7.4.1"], childs: {page: 97, form: "fàndàá", sense: "give as a gift; (noun) gift, present"}, example: GEN.21.27, note: "Mó fanda Abimelɛk « il en fit présent à Abimélek » (GEN.21.27) ; masaa koma soli fandaa pum « un présent de la part du roi » (2SA.11.8) ; mó faandia vannda ɲɛm kɛndɛn « il distribua des présents » (EST.2.18 ; Childs p. 94 fààndìá)."}
- {lemma: fasaŋa, status: attested, pos: verb, forms: [fasaŋanin, fasaŋan, fasaŋanndo], gloss: {fr: "asperger ; secouer (pour faire tomber) ; (fasaŋanndo) se déployer", en: "sprinkle; shake off; (fasaŋanndo) spread out"}, domains: ["7.3.2", "4.9.5"], childs: {page: 98, form: "fàsàŋàá", sense: "splash, sprinkle; throw down, sow"}, example: HEB.9.19, note: "Singulier de fasaŋiaa. Mí Pol fasaŋa kɛw kon o yin « Paul secoua la bête dans le feu » (ACT.28.5) ; kooma ndɔma fasaŋan-ndan « son sang répandu par aspersion » (HEB.12.24)."}
- {lemma: fasaka-fasaka, status: attested, pos: ideo, gloss: {fr: "en bouillonnant, tumultueusement (eaux)", en: "surging, turbulently (water)"}, domains: ["9.2.8", "1.3.2"], childs: {page: 98, form: "fásàkà-fásàkà", sense: "quickly, roughly, in a tumbling manner"}, example: AMO.8.8, note: "Une seule occurrence : mɛnndan ma fula fasaka-fasaka « les eaux se soulèvent » (AMO.8.8)."}
- {lemma: fefele, status: attested, pos: adj, gloss: {fr: "léger (de poids)", en: "light (in weight)"}, domains: ["8.2"], childs: {page: 100, form: "féfélé"}, example: MAT.11.30, note: "bɔndii nuu connun fefele « mon fardeau est léger » (MAT.11.30) ; dɛ̀ndɔ̀ɔ́ … muungu fefele « (pour) alléger le bateau » (JON.1.5)."}
- {lemma: fɛ́-fɛ́i, status: attested, pos: ideo, gloss: {fr: "doucement (vent) ; (hoeyii fɛ́-fɛ́i) la brise légère", en: "gently (wind); (hoeyii fɛ́-fɛ́i) the light breeze"}, domains: ["9.2.8", "1.1.3"], childs: {page: 103, form: "fé-fé", sense: "sound of wind blowing gently"}, example: GEN.3.8, note: "Une seule occurrence : o hoeyii fɛ́-fɛ́i paale delɛi nin « à la brise du soir » (GEN.3.8)."}
- {lemma: fɛ́lio, status: attested, pos: noun, gloss: {fr: "nudité, dénuement ; (a fɛ́lio) nu, sans vêtement", en: "nakedness, lack of clothing; (a fɛ́lio) naked"}, domains: ["5.3.7", "4.4.2"], childs: {page: 104, form: "fèlíó", sense: "lacking clothes, being destitute"}, example: MAT.25.36, note: "I va a fɛ́lio, mí la cuɛi ya « j'étais nu et vous m'avez vêtu » (MAT.25.36)."}
- {lemma: fisaa, status: attested, pos: verb, gloss: {fr: "valoir mieux (que), être préférable à", en: "be better (than), be preferable to"}, domains: ["8.3.7"], childs: {page: 107, form: "fìsàá", sense: "be better or equal"}, example: PSA.118.8, note: "Voir l'adjectif fisa. Mɛlɛka yɔngɔnndo co fisaa vanacieo tiindanndo « mieux vaut se réfugier auprès du Seigneur que se fier à l'homme » (PSA.118.8)."}
- {lemma: fó-fó, status: attested, pos: ideo, forms: [fo-fo], gloss: {fr: "complètement, tout à fait ; (humbu fo-fo) tout blanc", en: "completely, thoroughly; (humbu fo-fo) pure white"}, domains: ["9.2.8", "9.3"], childs: {page: 107, form: "fó", sense: "all, completely, thoroughly, very"}, example: LEV.19.2, note: "o diandaa fó-fó « (je suis) saint » (LEV.19.2) ; humbu fo-fo maa fengbɔ « blanc comme la neige » (EXO.4.6) ; la dindin fó-fó « purifiez-vous » (ISA.52.11)."}
- {lemma: fulal, status: attested, pos: verb, forms: [fulal-le], gloss: {fr: "apparaître à, se montrer à ; surgir contre, tomber sur (l'ennemi)", en: "appear to; come out against, fall upon (an enemy)"}, domains: ["7.2.3", "4.8.3"], childs: {page: 111, form: "fùlàlló", sense: "go out for someone"}, example: JDG.13.3, note: "Bénéfactif de fula « sortir ». mɛlɛkanɔ Hala-o fulal laa ndɔ « l'ange de Dieu apparut à la femme » (JDG.13.3) ; fulal nda fɛlɛmɛndɛn a cɔwvo « il fondit sur eux » (JDG.9.43)."}
- {lemma: fungbula, status: attested, pos: noun, forms: [fungbulan], gloss: {fr: "meurtrissures, plaies, blessures (des coups)", en: "bruises, welts, wounds (from blows)"}, domains: ["2.5.3"], childs: {page: 113, form: "fùŋgbòó", sense: "welt, swelling from a blow or insect bite"}, example: ISA.53.5, note: "Pluriel. le fungbula ndɔlan naa n sengu ni « c'est par ses meurtrissures que nous sommes guéris » (ISA.53.5)."}
- {lemma: fuulaa, status: attested, pos: verb, gloss: {fr: "souffler (le feu, avec un soufflet)", en: "blow (a fire, with bellows)"}, domains: ["5.5", "6.6.2"], childs: {page: 114, form: "fùùlàá"}, example: ISA.54.16, note: "o co yinnden fuulaa « il souffle sur le feu » (ISA.54.16) ; kùùlan la co fuulaa tuŋ « le soufflet souffle avec force » (JER.6.29)."}
- {lemma: helnɔnndo, status: attested, pos: verb, forms: [helnɔn], gloss: {fr: "monter, s'élever (au ciel)", en: "go up, ascend, rise (into the sky)"}, domains: ["7.2.2"], childs: {page: 120, form: "hèlnɔ̀ŋndó", sense: "climb, ascend"}, example: JDG.13.20, note: "Moyen de helɔɔ « monter ». mɛlɛkanɔ Hala-o helnɔnndo coocoo o yelenyelen kon nin « l'ange de Dieu montait dans la flamme » (JDG.13.20) ; sunsun i co helnɔn « maintenant je m'élève » (ISA.33.10)."}
- {lemma: hɛlul, status: attested, pos: verb, forms: [hɛlulun], gloss: {fr: "choisir pour (qqn) ; (hɛlulun) se choisir", en: "choose for (someone); (hɛlulun) choose for oneself"}, domains: ["3.3.1"], childs: {page: 122, form: "hɛ̀lìlló", sense: "select for someone (variant hɛlul)"}, example: EXO.17.9, note: "Bénéfactif de hɛlio « choisir ». Hɛlul naa kuubaa « choisis-nous des hommes » (EXO.17.9) ; nda pila hɛlulun masaa « ils se donnèrent un roi » (2KI.8.20)."}
- {lemma: hɛlle, status: attested, pos: noun, gloss: {fr: "sel", en: "salt"}, domains: ["5.2.3"], childs: {page: 122, form: "hɛ̀llé"}, example: LEV.2.13, note: "A bɛnda ma vow hɛlle « vous y mettrez du sel » (LEV.2.13) ; mó saŋ hɛlle o fonda kobio va-o « il sema du sel sur l'emplacement de la ville » (JDG.9.45)."}
- {lemma: hɛiyo, status: attested, pos: verb, forms: [hɛi, hɛinin, hɛyaa], gloss: {fr: "vanner ; cribler ; (fɛlɛ hɛyaa) van", en: "winnow; sift; (fɛlɛ hɛyaa) winnowing fork"}, domains: ["6.2.6"], childs: {page: 122, form: "hɛ̀ìyó", sense: "winnow, fan; also flutter; trick, fool"}, example: RUT.3.2, note: "o co lakɔ ɔrse ndɔɔ lɔɔ a hɛiyo « il va vanner son orge » (RUT.3.2) ; Setana hɛi niaa maa mɛɛ vana hɛi maalon nuaa yɛ « (que) Satan vous passe au crible comme on vanne le blé » (LUK.22.31) ; Fɛlɛ ndɔ hɛyaa « son van » (MAT.3.12)."}
- {lemma: hiluan, status: attested, pos: noun, gloss: {fr: "envie, convoitise (de nourriture, de viande), appétit", en: "craving (for food, meat), appetite"}, domains: ["3.3", "5.2.2"], childs: {page: 125, form: "hìlùáŋ", sense: "greed, excessive appetite (esp. for meat and fish)"}, example: DEU.12.20, note: "te hiluan ma bii pɛ niaa le vision dioo « si tu as envie de manger de la viande » (DEU.12.20) ; ma soli nda hiluan « assouvir l'appétit (des lionceaux) » (JOB.38.39)."}
- {lemma: hiownɔnndo, status: attested, pos: verb, forms: [hiownɔn], gloss: {fr: "passer, s'écouler (temps) ; passer (en chemin)", en: "pass, go by (time); pass by"}, domains: ["8.4.2", "7.2.2"], childs: {page: 127, form: "hìòùnɔ̀ŋndó", sense: "pass (middle)"}, example: PSA.102.12, note: "Moyen de hiovɔɔ « passer ». Palɛi nii co hiownɔnndo maa vundule icɔl « mes jours passent comme l'ombre du soir » (PSA.102.12) ; o hiownɔn nin « en passant » (1CO.16.7)."}
- {lemma: hòólan, status: attested, pos: noun, forms: [hòóla], gloss: {fr: "champs, pâturages, terres (de culture)", en: "fields, pastures, (farm) lands"}, domains: ["6.2.9", "6.3"], childs: {page: 131, form: "hòó", sense: "old or abandoned farm, recently cultivated land"}, example: ISA.30.23, note: "Pluriel. cɔlua niaa vanin kɔlan diólano hòóla bɛndu-bɛndulan nin « tes troupeaux paîtront dans de vastes pâturages » (ISA.30.23) ; niaa saa co o hòóla nilan nin-nda « vous, brebis de mon pâturage » (EZK.34.31)."}
- {lemma: hovihovio, status: attested, pos: verb, gloss: {fr: "piquer (à plusieurs reprises)", en: "prick, pierce (repeatedly)"}, domains: ["7.8.5"], childs: {page: 131, form: "hɔ̀wìhɔ̀wìó", sense: "prick many times"}, example: JOS.23.13, note: "Une seule occurrence : maa n'yɔɔ le niaa hɔltan hovihovio « comme des épines qui piquent vos yeux » (JOS.23.13). Cf. hɔwvɔɔ « enfoncer »."}
- {lemma: hɔllo, status: attested, pos: noun, gloss: {fr: "bout, extrémité (d'un bâton, d'un sceptre) ; (o … hɔllo) devant, contre", en: "tip, end (of a stick, sceptre); (o … hɔllo) before, against"}, domains: ["8.6.7"], childs: {page: 132, form: "hɔ̀lló", sense: "point, tip, top, end"}, example: EST.5.2, note: "mó pilan tindaa hɔllo « elle toucha le bout du sceptre » (EST.5.2) ; ya vow hɔllo o lɛan nin « j'ai trempé le bout (du bâton) dans le miel » (1SA.14.43) ; o sim Mɛlɛka o hɔllo « (rien ne) tient devant le Seigneur » (PRO.21.30)."}
- {lemma: hɔŋnɔnndo, status: attested, pos: verb, gloss: {fr: "sonner, retentir (trompette)", en: "sound, be blown (trumpet)"}, domains: ["4.2.3", "2.3.2"], childs: {page: 132, form: "hɔ̀ŋnɔ̀ŋndó", sense: "be blown"}, example: JOS.6.13, note: "Moyen de hɔŋndo « souffler, sonner ». bululan la va hɔŋnɔnndo « les trompettes sonnaient » (JOS.6.13)."}
- {lemma: hùíyé, status: attested, pos: noun, gloss: {fr: "sifflement ; (hɔŋ hùíyé) siffler", en: "whistle, hiss; (hɔŋ hùíyé) whistle, hiss"}, domains: ["2.3.2", "3.5"], childs: {page: 134, form: "hùíyé", sense: "a whistle"}, example: ISA.5.26, note: "o hɔŋ hùíyé le nda veeloo « il siffle pour les appeler » (ISA.5.26) ; mà hɔŋ hùíyé a mɔnɛi « ils siffleront de stupeur » (JER.25.9)."}
- {lemma: huinɔnndo, status: attested, pos: verb, forms: [huinan], gloss: {fr: "se tromper soi-même ; (huinan) se trahir les uns les autres", en: "deceive oneself; (huinan) betray one another"}, domains: ["4.3"], childs: {page: 134, form: "hùìnɔ̀ŋndó", sense: "fool or trick oneself"}, example: JAS.1.22, note: "Moyen de huiyo « tromper ». mɛɛ niaa pila co huinɔnndo ni « vous vous trompez vous-mêmes » (JAS.1.22) ; mà huinan « ils se trahiront » (MAT.24.10)."}
- {lemma: huinndon, status: attested, pos: noun, gloss: {fr: "gale, maladie de peau (qui démange)", en: "scab, itching skin disease"}, domains: ["2.5.2"], childs: {page: 134, form: "hùíŋndé", sense: "craw-craw, a skin disease with mottled skin; smallpox"}, example: DEU.28.27, note: "Pluriel. Une seule occurrence : nààla bondokpalan, huinndon a tɛɛnndan « ulcères, gale et démangeaisons » (DEU.28.27)."}
- {lemma: hullo, status: attested, pos: verb, forms: [hul], gloss: {fr: "souffler (sur) ; insuffler", en: "blow (on); breathe into"}, domains: ["1.1.2", "2.2.1"], childs: {page: 135, form: "hùllò", sense: "blow on something; also lie to someone"}, example: GEN.2.7, note: "Mó hul ndu hoeyii yoomuɛi o tɛɛngun lamilinndon nin « il souffla dans ses narines un souffle de vie » (GEN.2.7) ; mó hul nda « il souffla sur eux » (JHN.20.22) ; hoeiye pum va ya hɔlla hullo « un souffle passa sur mon visage » (JOB.4.15)."}
- {lemma: hunnun, status: attested, pos: verb, gloss: {fr: "(hunnun a) emmener, ramener avec soi", en: "(hunnun a) bring along, bring back"}, domains: ["7.3.3"], childs: {page: 137, form: "hùŋnɔ̀ŋndó", sense: "arrive, come by one's own power"}, example: 1CH.13.3, note: "Moyen de hunɔɔ « venir ». mì n kɔ hunnun a kesu kpema Hala naa « allons ramener l'arche de notre Dieu » (1CH.13.3) ; ma hunnun a nda « tu les as emmenées » (GEN.31.26)."}
- {lemma: hunan, status: attested, pos: adj, gloss: {fr: "en crue, qui monte (eau) ; (mɛmma hunan) eaux en crue, flot", en: "rising, in flood (water); (mɛmma hunan) flood waters"}, domains: ["1.3.2"], childs: {page: 137, form: "hùùnâŋ", sense: "flooded (mɛŋmà hùùnâŋ 'the flooding water')"}, example: JER.46.7, note: "maa mɛmma hunan o peo Nil « comme les eaux du Nil en crue » (JER.46.7). On trouve aussi mɛmma hunaa « le flot, l'inondation » (JOB.27.20, DAN.11.40). Le rattachement à hunɔɔ « venir » ou à hulɔɔ « verser » (Childs) reste à préciser."}
- {lemma: inɛɛ, status: attested, pos: adv, forms: [inɛɛle], gloss: {fr: "quelque part, ailleurs ; (avec négation) nulle part", en: "somewhere, elsewhere; (with negation) anywhere"}, domains: ["8.5.1"], childs: {page: 139, form: "ìnéé", sense: "somewhere, anywhere (said by older speakers)"}, example: LUK.10.33, note: "Samarinɔɔ pum va kɔlan inɛɛ « un Samaritain en voyage » (LUK.10.33) ; la kɔa inɛɛ le « n'allez pas ailleurs » (EXO.8.21) ; inɛɛle (ZEC.7.14)."}
