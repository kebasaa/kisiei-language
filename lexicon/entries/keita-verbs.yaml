- {lemma: diinɔnndo, status: attested, pos: verb, gloss: {fr: se tuer ; suicide, en: kill oneself; suicide}, domains: [2.6.6], keita: {form: Diinönndo, page: 110}, lexique: {page: 13, form: diinɔnndo/ diinun}, terminologie: {list: histoire, number: 585, form: 'Diyönndo, diinönndo'}, childs: {page: 78, form: dììnɔ̀ŋndó}, note: 'Moyen de diyɔɔ (ACT 16,27). Ne pas confondre avec diinun « se rassembler » (GEN 1,9). Académie des langues (terminologie, histoire n° 585) : « suicide » (aussi diyɔnndo).'}
