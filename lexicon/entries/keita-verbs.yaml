- {lemma: nɔ, status: attested, pos: verb, forms: [nɔ], gloss: {fr: avoir ; posséder, en: have; own}, domains: ['7.4'], keita: {form: Nöw, page: 110}, paulme: {page: 69, form: nɔ}, lexique: {page: 38, form: nɔu/ nɔ}, terminologie: {list: langue, number: 324, form: Nöö (nöw)}, note: 'Keita : « Avoir, … » (glose tronquée). nɔ « avoir » est courant dans la Bible ; la forme longue nɔw n''y est pas (nɔ̀u = « épouse »). Le Lexique kissi–français, p. 38, confirme nɔu/ nɔ « avoir ». Paulme 1964, p. 69 : ɔ nɔ wuryɔ̃ tau « il possède beaucoup d''argent ». La Bible écrit nɔ (GEN.13.5). Académie des langues (terminologie, langue n° 324) : nöö (nöw) « possession ». Aussi Terminologie, p. 487 : « Nöö (nöu) ». Académie des langues (terminologie, histoire n° 487) : nɔɔ (nɔu) « possession ».'}
