- {lemma: kɔlan, status: attested, pos: verb, forms: [kɔ, kɔa, kɔɛ, kue, kɔanin, kuenin], gloss: {fr: 'aller, partir ; (kɔlan a …) conduire', en: 'go, leave; (kɔlan a …) lead, take along'}, domains: [7.2.3], keita: {form: Kölan, page: 116}, paulme: {page: 46, form: kɔ̄}, lexique: {page: 26, form: 'kɔlan/ kɔ, kɔɛ, kɔa, koɛ'}, childs: {page: 182, form: kɔ̀láŋ, sense: 'go, walk; pass by'}, example: GEN.4.8, note: 'kue, kuenin : radical négatif. kɔ s''emploie aussi en série : « aller (faire) ». Lexique kissi–français, p. 26-27 : aussi kɔran « aller, marcher » ; kɔa a ndu, kɔran a ndu, kɔran ndu taci « conduire ». Paulme 1964, p. 46 et 48 : kɔ̄, kɔra « aller, partir ; voyage » (kɔ̄ ndu lo « va chez lui », ma kwa « ils vont », ɔ kwɛ « il est parti »).'}
- {lemma: miolɔɔ, status: attested, pos: verb, forms: [miol, mial, mil, mialnin], gloss: {fr: avaler, en: swallow}, domains: [5.2.2], keita: {form: Miolöö, page: 116}, lexique: {page: 35, form: 'miolɔɔ/ miol, mel, mial, mil'}, terminologie: {list: langue, number: 147, form: Miolöö (mi a dimi; ma dimi)}, childs: {page: 250, form: mìòlɔ̀ɔ́}, note: 'mil : radical négatif (GEN 41,21). Lexique kissi–français, p. 33-35 : aussi mal, molɔɔ/ mal « avaler ». Aussi Lexique kissi–français, p. 35 : « mulɔɔ/ mul ». Lexique kissi–français, p. 35 écrit mulɔɔ/ mul « avaler ». Académie des langues (terminologie, langue n° 147) : « élision » (exemple : mi a dimi → ma dimi).'}
- {lemma: piɔlɔɔ, status: attested, pos: verb, forms: [piɔl, pɛl, pial, pel, pialnin, piɔlnin], gloss: {fr: 'briser, casser, écraser ; prononcer (un nom) ; crever, éclater', en: 'break, crush; pronounce (a name); burst'}, domains: [7.8.1], keita: {form: Piölöö, page: 116}, paulme: {page: 81, form: pɔl}, lexique: {page: 43, form: 'piɔlɔɔ/ piɔl, pɛl, pial, pel'}, terminologie: {list: histoire, number: 514, form: 'Piölöö , Salöö selemenden'}, note: 'pel : radical négatif (EXO 12,46). diola pial « prononcer le nom » (EXO 20,7). Lexique kissi–français, p. 40 et 44 : aussi pɔlɔɔ/ pal « casser ; parler par nom ». Le Lexique kissi–français donne aussi : pal. Paulme 1964, p. 81 : pɔl « crever, éclater » ; pɛta n ta pɔl « l''œuf est cassé » ; hindo pɔl « la fièvre est tombée » ; tyando pɔlo « annoncer le deuil » ; ɔ puɔ pɔlɔ « il casse la pierre ». Académie des langues (terminologie, histoire n° 476, 514) : piɔlɔɔ « pillage, ravage » (aussi salɔɔ selemenden). Académie des langues (terminologie, idéologie n° 501) : piɔlɔɔ vɔwvɔ « pillage ».'}
- {lemma: siɔw, status: respelled, pos: verb, gloss: {fr: pourrir, en: rot}, domains: [1.4.1], keita: {form: Siöw, page: 116}, paulme: {page: 90, form: sɛ}, lexique: {page: 45, form: '[s]a'}, note: 'La Bible a siɔu, siɔ « (le jour) se lever » (JDG 19,26), sens différent. Lexique kissi–français, p. 45 : [s]a (rad) « pourrir » (lecture incertaine). Aussi Lexique kissi–français, p. 50 : « siɔu/ siɔ, sɛ, sia, si ». Lexique kissi–français, p. 50 : siɔu/ siɔ, sɛ, sia, si « pourrir ». Homographe de siɔu « poindre (le jour) ». Paulme 1964, p. 90 : sɛ « pourri » ; dɛmbe nɔndo sɛ « ton ventre est pourri » ; nyɛy sayɛye « chose pourrie ». Aussi Paulme 1964, p. 99 : « suve, suwo, sɔwu ». Paulme 1964, p. 99 : nyɛy''suve « chose pourrie », yɔm''suwo « arbre pourri ».'}
- {lemma: siongɔɔ, status: attested, pos: verb, forms: [siongu, sengu, siangu, singu, siangunin, singunin], gloss: {fr: guérir ; se soigner, en: heal; treat oneself}, domains: [2.5.7], keita: {form: Siongöö, page: 116}, paulme: {page: 91, form: 'seŋu, siŋu'}, lexique: {page: 50, form: 'siongɔɔ/ siongu, sengu, siangu, singu'}, childs: {page: 335, form: sìŋìó, sense: 'heal, cure'}, note: 'singu, singunin : radical négatif (JER 10,19 ; 2KI 20,1). Lexique kissi–français, p. 51 : aussi songɔɔ/ sangu « guérir, se soigner ». Paulme 1964, p. 91 : ɔ seŋu re « il ne guérit pas » ; ɔ tyu suŋo « il est guéri ».'}
- {lemma: cɔu, status: attested, pos: verb, forms: [ca, ce, ci, cɔ, canin], gloss: {fr: voir, en: see}, domains: [2.3.1], keita: {form: Työw, page: 116}, paulme: {page: 112, form: tyɛ}, lexique: {page: 11, form: 'cɔu/ cɔ, ce, ca, ci'}, childs: {page: 58, form: cɔ̀ɔ́, sense: 'see, perceive, think'}, example: GEN.1.4, note: 'Keita écrit työw ; la Bible écrit cɔu (GEN 2,19 ; 13,15) ; cɔw y signifie « créer ». ci : radical négatif (GEN 31,33). Verbe à alternance : ca, ce (accompli), cɔ, ci (négatif), canin (futur). Paulme 1964, p. 112 : ɔ tyɛ dusua « il a vu des chasseurs » ; la tyɛ – tyɔ tyi « il faut bien regarder ».'}
- {lemma: cɔnɔnndo, status: attested, pos: verb, forms: [cɔn, can, cen, cɔnnun], gloss: {fr: 'se lever, partir ; se lever contre ; lever (du soleil)', en: 'get up, set out; rise against; rising (of the sun)'}, domains: [7.1.1], keita: {form: Työnönndo, page: 116}, lexique: {page: 11, form: 'cɔnɔnndo/ cɔn, cɛn, can, cen'}, terminologie: {list: ideologie, number: 415, form: 'Nyaaloo, työnönndo'}, childs: {page: 57, form: cɔ̀ŋɔ̀ɔ́, sense: 'get up, arise; grow'}, note: 'cen : radical négatif (GEN 31,35). Lexique kissi–français, p. 11 : « se lever ; se lever pour aller quelque part ; se lever contre » ; « le lever (du soleil) ». Académie des langues (terminologie, idéologie n° 415) : « manifestation » (aussi ɲaaloo). Académie des langues (terminologie, idéologie n° 595) : « soulèvement » (aussi piasaa).'}
- {lemma: viɔw, status: attested, pos: verb, forms: [viɔ, via], gloss: {fr: 'cogner, heurter ; tirer (flèche)', en: 'knock, strike; shoot'}, domains: [7.7.1], keita: {form: Viöw, page: 116}, lexique: {page: 61, form: 'viɔu/ viɔ, vɛ, via, ve'}, note: 'via « atteindre (d''une flèche) » (2CH 35,23). Lexique kissi–français, p. 61 : radicaux viɔ, vɛ, via, ve.'}
- {lemma: yomɔɔ, status: attested, pos: verb, forms: [yomnin], gloss: {fr: 'casser en deux, briser ; casser, détacher ; fixer (le jour d''une fête)', en: 'break in two; break, detach; fix (the day of a feast)'}, domains: [7.8.1], keita: {form: Yomöö, page: 116}, paulme: {page: 128, form: yɔmo}, lexique: {page: 66, form: 'yomɔɔ/ yom, yom, yam, yim'}, childs: {page: 410, form: yòmɔ̀ɔ́, sense: break}, note: 'yomnin te « ne sera pas brisé » (JHN 19,36). Lexique kissi–français, p. 63, 66 : yomɔɔ/ yom, yam, yim « casser, détacher » ; yom « casser en deux ». Paulme 1964, p. 128 : yɔmo « briser, rompre ; annoncer » ; lɔ yɔmo « fixer le jour d''une fête » ; i yim yɔmdo « je casse du bois ».'}
