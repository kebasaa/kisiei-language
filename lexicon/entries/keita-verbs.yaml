# Verbs from the verb list of Keita (1979), Kisiei fondamental, p. 110-116 (four groups).
# Lemma = long form (verbal noun) in Bible spelling; `forms` = short stems and futures found in the Bible.
# `keita` gives the long form exactly as printed in 1979. Childs (2000) is Southern Kissi:
# its senses go in `childs.sense` only.

# --- 1er groupe (Keita p. 110-114) ---
