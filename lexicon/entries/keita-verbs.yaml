- {lemma: boŋaa, status: check, pos: verb, forms: [boŋnin], gloss: {fr: faire trébucher ; piège ; talocher (Keita), en: make stumble; snare; slap (Keita)}, domains: [7.2.1, 7.7.1], keita: {form: Bonhaa, page: 110}, lexique: {page: 7, form: boŋaa/ boŋa}, childs: {page: 23, form: bòŋɔ̀ɔ́, sense: 'trip, stumble, stub one''s toe; knock, strike'}, note: 'Dans la Bible, pow boŋaa « pierre d''achoppement, piège » (JDG 2,3 ; ISA 8,14) et boŋnin « (ne) trébuchera (pas) » (PSA 62,3). Le sens « talocher » de Keita correspond au bɔ̀ŋàá « frapper » de Childs (p. 22). Le Lexique kissi–français, p. 7 : boŋaa/ boŋa « accueillir, talocher ».'}
- {lemma: bɔŋaa, status: attested, pos: verb, forms: [bɔŋa, bɔŋan], gloss: {fr: 'rencontrer, aller à la rencontre de ; accueillir', en: 'meet, go to meet; welcome'}, domains: [7.2.3, 4.2.1], keita: {form: Bönhaa, page: 110}, lexique: {page: 8, form: bɔŋaa/ bɔŋa}, terminologie: {list: ideologie, number: 549, form: Bönhaa}, childs: {page: 28, form: bɔ̀ŋàá, sense: 'bring together, join, cover; be sufficient'}, note: 'Lexique kissi–français, p. 7-8 : « rencontrer, accueillir (G.) ». Académie des langues (terminologie, idéologie n° 549) : « réception ».'}
