- {lemma: vàá, status: attested, pos: verb, forms: [vee, veenin], gloss: {fr: 'cultiver, labourer', en: 'farm, plough'}, domains: [6.2.2], keita: {form: Vaa, page: 115}, paulme: {page: 119, form: waā}, lexique: {page: 59, form: 'vaa/ va, vee'}, note: 'le vàá « labourer » (DEU 22,10) ; vee, veenin : radical négatif (PRO 20,4 ; GEN 45,6). Homonyme de vaa « être ». Confirmé au Nord par le Lexique kissi–français, p. 59 (vaa/ va, vee « labourer ») ; la Bible a le vàá « labourer » (DEU.22.10), ɲɛm niaa vàá « ce que vous cultivez » (DEU.14.22). Paulme 1964, p. 119 : tout le travail de la terre ; wana wa, wana va « cultivateur ».'}
