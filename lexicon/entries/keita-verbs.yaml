- {lemma: bɛŋio, status: attested, pos: verb, forms: [bɛŋi, bɛŋin], gloss: {fr: 'arracher, démonter, détacher', en: 'knock out, pull out, dismantle'}, domains: [7.3.2, 7.9.3], keita: {form: Bènhia, page: 110}, lexique: {page: 6, form: bɛŋio/ bɛŋi}, childs: {page: 14, form: bèŋìó, sense: come out (as a blade from its handle)}, note: 'Keita écrit bènhia ; la Bible a la forme longue bɛŋio (GEN 19,9). bɛŋi : faire sauter une dent (EXO 21,27) ; bɛŋin : se détacher (fer de hache, DEU 19,5).'}
- {lemma: bɛsio, status: check, pos: verb, forms: [bɛsi], gloss: {fr: 'écobuer (Keita) ; porter, prendre soin (?)', en: 'burn-clear a field (Keita); carry, care for (?)'}, domains: [6.2.2], keita: {form: Bèsio, page: 110}, lexique: {page: 6, form: bɛsio/ bɛsi}, note: 'Dans la Bible, bɛsio (DEU 32,10) et bɛsi (ISA 46,3) semblent signifier « porter, entourer de soins », pas « écobuer ». À vérifier. Le Lexique kissi–français, p. 6, glose aussi « écobuer ».'}
