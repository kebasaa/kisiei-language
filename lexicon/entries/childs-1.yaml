# Words of the Kisiei Bible (BKG) found by going through Childs (2000), A Dictionary of the Kisi Language,
# printed pages 1-70 (a- to d-), and looking for the northern counterpart of each headword.
# Meanings are worked out from the verse contexts. All forms follow the Kisiei Bible (BKG).

- {lemma: baavaa, status: attested, pos: noun, forms: [baava], gloss: {fr: "seau ; bath (mesure de liquides)", en: "bucket, pail; bath (liquid measure)"}, domains: ["6.7.7", "8.2.8"], childs: {page: 4, form: "báávàá"}, example: ISA.40.15, note: "mɛmma ... o baava « une goutte d'un seau » (ISA.40.15) ; mesure de liquides en EZK.45.11."}
- {lemma: baltan, status: attested, pos: noun, forms: [bali], gloss: {fr: "conversation, propos ; (dɔw baltan) causer, s'entretenir", en: "talk, conversation; (dɔw baltan) talk, converse"}, domains: ["3.5.1"], childs: {page: 5, form: "bàlíó"}, example: LUK.24.14, note: "Pluriel ; dɔw baltan « s'entretenir » (DAN.1.19, ACT.10.27). Forme bali dans dow ... bali « informer » (GEN.21.26, 1SA.22.8). À distinguer de báltan « lances »."}
- {lemma: baŋulɛiyo, status: attested, pos: adj, forms: [baŋulɛi, baŋulɛiya], gloss: {fr: "sourd ; (vana nila baŋulɛiyo) un sourd", en: "deaf; (vana nila baŋulɛiyo) a deaf person"}, domains: ["2.5.4"], childs: {page: 8, form: "bàŋúléí", sense: "deaf; closed"}, example: LEV.19.14, note: "Litt. « aux oreilles bouchées », de baŋullo « boucher ». Pluriel vanaa nila baŋulɛiya (MAT.11.5)."}
- {lemma: bɛlɔɔ, status: attested, pos: noun, plural: bɛlla, gloss: {fr: "rat, souris", en: "rat, mouse"}, domains: ["1.6.1"], childs: {page: 13, form: "bèlɔ̀ɔ́"}, example: LEV.11.29, note: "bɛlla « souris (d'or) » (1SA.6.4) ; vanaa co bɛlla dioo « ceux qui mangent des souris » (ISA.66.17)."}
- {lemma: bɛɛsa, status: attested, pos: verb, gloss: {fr: "casser, arracher (une branche, une pousse)", en: "break off (a branch, a shoot)"}, domains: ["7.8.1"], childs: {page: 12, form: "bèèsàá", sense: "break off or prune branches"}, example: EZK.17.4, note: "Forme de base ; voir bɛɛsiaa « tailler, émonder »."}
- {lemma: biondɔɔ, status: attested, pos: verb, forms: [biondu, bindu, bindunin], gloss: {fr: "manquer (la cible), rater ; échapper à ; se tromper", en: "miss (a target), fail to catch; escape; err"}, domains: ["7.7", "4.3"], childs: {page: 19, form: "bìòndɔ̀ɔ́", sense: "miss; (of a trap) spring without catching"}, example: AMO.3.5, note: "yaŋɔɔlen le ... biondu « le piège ne se détend pas (à vide) » (AMO.3.5) ; ndóò bindu len te « sans manquer (la cible) » (JDG.20.16) ; o ve biondɔɔ le « sans se tromper » (ACT.18.25). Voir bendun, biondɔnndo."}
- {lemma: boŋio, status: attested, pos: verb, forms: [boŋi, boŋinin], gloss: {fr: "trébucher, buter (plusieurs, ou à plusieurs reprises)", en: "stumble, trip (of several, or repeatedly)"}, domains: ["7.2.1"], childs: {page: 22, form: "bòŋìó"}, example: JER.6.21, note: "Pluriel verbal de boŋ « trébucher » : boŋndo o boŋ « il trébuche » (JHN.11.10) ; boŋilan « fautes, faux pas » (JAS.3.2). Voir boŋaa « faire trébucher »."}
- {lemma: boŋiboŋio, status: attested, pos: verb, forms: [boŋiboŋi], gloss: {fr: "chanceler, tituber", en: "stagger, totter, keep stumbling"}, domains: ["7.2.1"], childs: {page: 22, form: "bòŋìó", sense: "keep stubbing one's toe"}, example: ISA.29.9, note: "Redoublement de boŋio. vana-vana co boŋiboŋi le « personne ne chancelle » (ISA.5.27)."}
- {lemma: boosei, status: attested, pos: noun, gloss: {fr: "sorte d'instrument de musique (calebasse)", en: "a musical instrument (gourd instrument)"}, domains: ["4.2.3"], childs: {page: 24, form: "bòòsèí", sense: "gourd from a thorny tree; a gourd instrument that is blown or shaken"}, example: DAN.3.5, note: "Dans la liste des instruments de l'orchestre de Nabuchodonosor (DAN.3.5, 3.7, 3.10, 3.15)."}
- {lemma: booson, status: attested, pos: noun, gloss: {fr: "plantes épineuses, chardons", en: "thorny plants, thistles"}, domains: ["1.5.2"], childs: {page: 24, form: "bòòsòó", sense: "a thorny tree whose gourds are used as containers and instruments"}, example: HEB.6.8, note: "Pluriel ; yɔɔn booson « épines et chardons » (JER.12.13, HEB.6.8)."}
- {lemma: bɔ̀mbillon, status: attested, pos: noun, gloss: {fr: "sorte d'instrument de musique", en: "a kind of musical instrument"}, domains: ["4.2.3"], childs: {page: 27, form: "bɔ̀mbìllé", sense: "a metal percussion instrument, a slit pipe struck with a stick"}, example: NEH.12.27, note: "Pluriel ; cité avec les cymbales (kɛŋun) et les harpes (bangalan) (NEH.12.27)."}
- {lemma: bɔndii, status: attested, pos: noun, gloss: {fr: "charge, fardeau", en: "load, burden"}, domains: ["7.3.1"], childs: {page: 27, form: "bɔ́ndìíyó", sense: "head load wrapped in cloth"}, example: MAT.11.30, note: "bɔndii nuu connun fefele « mon fardeau est léger » (MAT.11.30)."}
- {lemma: bɔɔ, status: attested, pos: noun, plural: bɔɔlan, gloss: {fr: "buisson, fourré ; (bɔ̀ɔ̀ n'yɔɔ) buisson d'épines, ronce", en: "bush, thicket; (bɔ̀ɔ̀ n'yɔɔ) thornbush, bramble"}, domains: ["1.5.2"], childs: {page: 29, form: "bɔ̀ɔ́"}, example: EXO.3.2, note: "Le buisson ardent (EXO.3.2) ; le bélier pris o bɔɔ nin « dans le fourré » (GEN.22.13) ; o bɔɔlan bɛngu « dans les buissons » (1SA.13.6, JOB.30.7). Ne pas confondre avec bɔɔ « cour » ni avec bɔɔlan « plumes, ailes »."}
- {lemma: bɔɔ, status: attested, pos: adv, gloss: {fr: "très, beaucoup, fort", en: "very, much, greatly"}, domains: ["9.3"], childs: {page: 29, form: "bɔ̀ɔ́"}, example: GEN.29.20, note: "ndóò kaola bɔɔ Rasɛl « il aimait beaucoup Rachel » (GEN.29.20) ; a hiw bɔɔ « il est très grand » (GEN.18.20)."}
- {lemma: bulio, status: attested, pos: verb, forms: [buli, bulinin, bulin], gloss: {fr: "percer, trouer ; faire une brèche, ouvrir (un passage)", en: "pierce, bore through; break through, open (a way)"}, domains: ["7.8.5"], childs: {page: 31, form: "bùlìó", sense: "drill, bore; (of soil) be fertile, loose"}, example: EXO.21.6, note: "o buli ndu nilen a yɔɛi buliaa « il lui percera l'oreille avec un poinçon » (EXO.21.6) ; buli soondo « faire une brèche (dans le mur) » (2KI.14.13). Adj. buliɛiyo « troué » (HAG.1.6). Voir buuluuo."}
- {lemma: buloo, status: attested, pos: noun, plural: bululan, forms: [bulu], gloss: {fr: "trompette, cor", en: "trumpet, horn (wind instrument)"}, domains: ["4.2.3"], childs: {page: 31, form: "búlóó", sense: "horn, any wind instrument; bread"}, example: JOS.6.5, note: "hɔŋ buloo « sonner de la trompette » (JDG.3.27, 2SA.2.28) ; bululan hɔŋndo (LEV.23.24). Même mot que buloo « pain »."}
- {lemma: bumbula, status: attested, pos: verb, forms: [bumbulan], gloss: {fr: "s'émousser, être émoussé ; (bumbulan) défaillir, s'affaiblir", en: "become blunt, be dull; (bumbulan) grow faint, weaken"}, domains: ["8.3.2", "2.4.2"], childs: {page: 32, form: "bùmbàlàá"}, example: ECC.10.10, note: "Te cuei bumbula pɛ « si le fer est émoussé » (ECC.10.10) ; o sanga le, o bumbulan te « il ne se fatigue ni ne se lasse » (ISA.40.28)."}
- {lemma: busɔɔ, status: attested, pos: verb, forms: [busullo], gloss: {fr: "aboyer, hurler (animal) ; (busullo) aboyer contre", en: "bark, howl; (busullo) bark at"}, domains: ["1.6.4"], childs: {page: 33, form: "bùsɔ̀ɔ́", sense: "bark; (of a young animal) open the eyes"}, example: ISA.56.10, note: "a nɔla busɔɔ le « ils ne peuvent aboyer » (ISA.56.10) ; tunndo ... vanacieo busullo « aucun chien n'aboiera contre personne » (EXO.11.7)."}
- {lemma: buŋnde, status: attested, pos: noun, gloss: {fr: "poitrine ; (buŋnde lɔɔnɔnndo) se frapper la poitrine", en: "chest, breast; (buŋnde lɔɔnɔnndo) beat one's breast"}, domains: ["2.1.2"], childs: {page: 33, form: "bùŋndé", sense: "chest cold, head cold"}, example: LUK.18.13, note: "mo va buŋnde lɔɔnɔnndo « il se frappait la poitrine » (LUK.18.13) ; voir aussi ISA.51.22."}
- {lemma: buulanndo, status: attested, pos: verb, forms: [buulan, buulannda], gloss: {fr: "s'inquiéter, se faire du souci ; (buulan te) n'aie pas peur", en: "worry, be anxious; (buulan te) do not be afraid"}, domains: ["3.4.2"], childs: {page: 34, form: "bùùlǎŋndó"}, example: GEN.21.17, note: "Buulan te « ne crains pas » (GEN.21.17, GEN.26.24) ; kɔɔyɔlɔɔ a buulanndo « tristes et soucieux » (GEN.40.6) ; vana-vana buulan le ya « personne ne se soucie de moi » (1SA.22.8). Le sens « chercher, consulter » est déjà enregistré ailleurs ; c'est sans doute le même verbe (« se soucier de »)."}
- {lemma: buun, status: attested, pos: noun, gloss: {fr: "bosses (du chameau)", en: "humps (of camels)"}, domains: ["1.6.2"], childs: {page: 35, form: "bùùwé", sense: "unripe palm nut; hump"}, example: ISA.30.6, note: "o buun ɲɔɔmɛɛa coo « sur la bosse des chameaux » (ISA.30.6)."}
- {lemma: buusial, status: attested, pos: verb, gloss: {fr: "reparler de, revenir sur (une affaire) avec qqn", en: "bring up (a matter) again with someone, speak of"}, domains: ["3.5.1"], childs: {page: 35, form: "bùùsìálló", sense: "restart (a discussion); remind someone"}, example: DEU.3.26, note: "I tuɛi lɛ ma buusial-la sɔɛi ken te « ne me reparle plus de cette affaire » (DEU.3.26) ; buusial ndu sɔɛi nɔmnde « lui parler de toi » (1SA.19.3)."}
- {lemma: càá, status: attested, pos: noun, gloss: {fr: "vers, asticots", en: "maggots, worms"}, domains: ["1.6.1"], childs: {page: 36, form: "càá"}, example: EXO.16.20, note: "càá luɛi o ɲɛ nda manda kon-ndo nin « il s'y mit des vers » (EXO.16.20) ; Hérode « mangé des vers » (ACT.12.23) ; voir aussi JOB.7.5, ISA.14.11, ISA.66.24."}
- {lemma: cacɔɔa, status: attested, pos: verb, gloss: {fr: "tamiser, cribler", en: "sift, sieve"}, domains: ["6.2.6"], childs: {page: 37, form: "càcɔ̀ɔ"}, example: ISA.30.28, note: "vanaa-mangalaa-isɔɔa cacɔɔa tɛmɛ tɛɛmbua « cribler les nations au crible de la destruction » (ISA.30.28). Seule occurrence."}
- {lemma: calan, status: attested, pos: adv, gloss: {fr: "beaucoup, en grande quantité, nombreux", en: "much, a great deal, many"}, domains: ["8.1"], childs: {page: 37, form: "cálán", sense: "big enough, sufficient; clearly"}, example: 2KI.12.11, note: "volion n co nin calan o kesoo nin « il y avait beaucoup d'argent dans le coffre » (2KI.12.11) ; volion calan « une forte somme » (ACT.22.28)."}
- {lemma: cɛlnun, status: attested, pos: verb, gloss: {fr: "être agréé, être accepté ; accepter, consentir à", en: "be accepted, be approved; agree to, accept"}, domains: ["3.3.1", "7.4.2"], childs: {page: 41, form: "cèlnɔ̌ŋndó"}, example: LEV.1.4, note: "Moyen de cɛlɔɔ « accepter ». haliko mo cɛlnun « afin qu'il soit agréé » (LEV.1.4) ; n cɛlnun sɔɛi nda dimi-e « consentons à ce qu'ils disent » (GEN.34.23)."}
- {lemma: ciei, status: attested, pos: noun, gloss: {fr: "mortier ; meule", en: "mortar; millstone"}, domains: ["5.1", "6.7.2"], childs: {page: 43, form: "cìéí", sense: "mortar (for pounding rice)"}, example: NUM.11.8, note: "cu ndu o ciei nin « le piler au mortier » (NUM.11.8) ; vanin cúo o ciei « moudre à la meule » (MAT.24.41) ; pow ... maa ciei « pierre comme une meule » (REV.18.21)."}
- {lemma: cica, status: attested, pos: verb, gloss: {fr: "sauter ; s'élancer", en: "jump, leap"}, domains: ["7.2.1"], childs: {page: 42, form: "cìcàá"}, example: HAB.1.10, note: "a cica lekɔɔli « ils s'élancent dessus (pour prendre les villes) » (HAB.1.10). Seule occurrence, sens à confirmer."}
- {lemma: ciinun, status: attested, pos: verb, gloss: {fr: "dévoiler, révéler (son cœur) ; anéantir ; (pila ciinun labɛɛ) se déshonorer", en: "open up, reveal (one's heart); wipe out; (pila ciinun labɛɛ) dishonour oneself"}, domains: ["3.5.1", "7.9.3"], childs: {page: 46, form: "cììnɔ̌ŋndó", sense: "be finished, come to an end; lose all self-respect"}, example: JDG.16.18, note: "Samsɔn ciinun kɔl ya o ba « Samson m'a ouvert tout son cœur » (JDG.16.18) ; nɔm pila ciinun labɛɛ « tu te déshonores » (EZK.22.16, LEV.18.10) ; n kɔ ciinun vanaa-mangalaa-isɔɔa ha « anéantissons ces nations » (PSA.83.5). Moyen de cii « finir »."}
- {lemma: ciindian, status: attested, pos: verb, gloss: {fr: "se sauver soi-même ; (pila ciindian) se sauver", en: "save oneself"}, domains: ["4.4"], childs: {page: 46, form: "cììndìáŋndó"}, example: MAT.27.40, note: "Moyen de ciindiaa « sauver ». nɔm pila ciindian « sauve-toi toi-même » (MAT.27.40, MAT.27.42)."}
- {lemma: ciiye, status: attested, pos: noun, gloss: {fr: "souche (d'arbre)", en: "tree stump"}, domains: ["1.5.5"], childs: {page: 47, form: "cììyé", sense: "tree stump; foundation of a house"}, example: DAN.4.12, note: "mì la mɛi ciiye a puundon yondoo nin « mais laissez la souche avec ses racines dans la terre » (DAN.4.12, 4.20, 4.23)."}
- {lemma: cìíyo, status: attested, pos: noun, gloss: {fr: "buffle ; bœuf sauvage", en: "buffalo, wild ox"}, domains: ["1.6.1"], childs: {page: 47, form: "cìíyó"}, example: NUM.23.22, note: "maa cìíyo « comme le buffle » (NUM.23.22) ; JOB.39.9. À distinguer de ciiyo « vivre »."}
- {lemma: cimbɔɔ, status: attested, pos: verb, gloss: {fr: "s'enfuir, se sauver (de chez son maître)", en: "run away, flee (from one's master)"}, domains: ["7.2.3"], childs: {page: 48, form: "cìmbɔ̀ɔ́", sense: "flee, run away; steal"}, example: 1SA.25.10, note: "cɛa ... cimbɔɔ o ba mà kɔannun « des esclaves qui s'enfuient de chez leurs maîtres » (1SA.25.10). Seule occurrence. Voir ciimbuu « voler »."}
- {lemma: cimbullon, status: attested, pos: noun, forms: [cimbulun], gloss: {fr: "épines, ronces", en: "thorns, briers"}, domains: ["1.5.2"], childs: {page: 48, form: "cìmbùllé"}, example: JDG.8.7, note: "Pluriel. cimbulun co o lɛŋnde veselɛilen nin-ndon a siɛmbullon « les épines du désert et les ronces » (JDG.8.7, JDG.8.16) ; ISA.5.6."}
- {lemma: ciŋan, status: attested, pos: verb, forms: [ciŋanin], gloss: {fr: "toucher, joindre ; boire en approchant la bouche (de l'eau) ; (yinnde ciŋanin) cuire sur le feu", en: "touch, join; drink by putting the mouth to (water); (fire) be stoked"}, domains: ["7.5.2", "5.2.2"], childs: {page: 49, form: "cìŋǎŋndó", sense: "join edges; put the mouth to (water), drink; plead not guilty"}, example: JDG.7.6, note: "Moyen de ciŋaa. má ciŋan le kolɔɔ « ils s'agenouillèrent pour boire » (JDG.7.6) ; kumban ... ciŋan a cìì cɛi « l'aile touchait le mur » (2CH.3.11) ; yinnde n ciŋanin a poola « un feu alimenté d'excréments » (EZK.4.12)."}
- {lemma: condu, status: attested, pos: verb, gloss: {fr: "chanter", en: "sing"}, domains: ["4.2.3"], childs: {page: 51, form: "còndèí"}, example: PSA.47.7, note: "La solul Hala condon, la condu ! « chantez à Dieu, chantez ! » (PSA.47.7) ; voir condei « chant »."}
- {lemma: congòó, status: attested, pos: verb, forms: [congu, cóngù], gloss: {fr: "médire de, calomnier, dénigrer", en: "slander, speak ill of, backbite"}, domains: ["3.5.1", "4.3"], childs: {page: 52, form: "còŋgòó", sense: "gossip, backbite; send a message; bid farewell; bet"}, example: PSA.50.20, note: "la cal puapilɛa niaa congòó « tu dénigres tes frères » (PSA.50.20) ; La cóngù vanaa niaa ... le « ne calomnie pas » (LEV.19.16) ; la congan vellaa-velle le « ne médisez pas les uns des autres » (JAS.4.11). Voir congɔnndo « prendre congé »."}
- {lemma: congulan, status: attested, pos: noun, gloss: {fr: "médisances, calomnies", en: "slander, malicious gossip"}, domains: ["3.5.1", "4.3"], childs: {page: 52, form: "còŋgòó"}, example: COL.3.8, note: "Pluriel de congòó. À distinguer de congúlan « épaules »."}
- {lemma: congɔɔ, status: attested, pos: verb, gloss: {fr: "garder (un animal confié)", en: "keep (livestock entrusted to one), look after"}, domains: ["6.3"], childs: {page: 52, form: "còŋgɔ̀ɔ́", sense: "keep or raise livestock for someone"}, example: EXO.22.9, note: "cɔlu súú-súù congɔɔ « tout animal confié à garder » (EXO.22.9). Seule occurrence."}
- {lemma: cɔɔlɔnndo, status: attested, pos: verb, gloss: {fr: "augmenter, s'accroître ; empirer", en: "increase, grow (in number); get worse"}, domains: ["8.1.4"], childs: {page: 58, form: "cɔ̀ɔ̀lɔ̃ŋndó"}, example: ACT.5.14, note: "Moyen de cɔɔlu « ajouter ». kunda vanaa laalannda va cɔɔlɔnndo « le nombre des croyants augmentait » (ACT.5.14) ; sanga nuu ... cɔɔlɔnndo « ma douleur s'aggravait » (PSA.39.3)."}
- {lemma: cɔɔmullo, status: attested, pos: verb, forms: [cɔɔmul], gloss: {fr: "révéler, dévoiler, mettre au jour (à qqn)", en: "reveal, disclose, expose (to someone)"}, domains: ["3.5.1"], childs: {page: 58, form: "cɔ̀ɔ̀mùlló", sense: "show something hidden"}, example: MIC.3.8, note: "le Israɛlla haki ndaa cɔɔmullo « pour révéler à Israël ses péchés » (MIC.3.8) ; Yoongu Hala cɔɔmul Habakuk « la parole que Dieu révéla à Habacuc » (HAB.1.1). Voir cɔɔmuuo."}
- {lemma: cɔwvian, status: attested, pos: verb, forms: [cɔwvianninmɛɛ], gloss: {fr: "ramasser, piller (le butin) ; être grappillé", en: "gather up, plunder (spoil); be gleaned"}, domains: ["7.5.1", "4.8.3"], childs: {page: 59, form: "cɔ̀ɔ̀wìáŋndó", sense: "pick up one by one; steal"}, example: 2KI.3.23, note: "Moyen pluriel de cɔwviaa « ramasser ». n kɔ cɔwvian ɲɛm ndan « allons piller leurs biens » (2KI.3.23) ; N'tiŋ cɔwvian « l'argent est pillé » (NAM.2.11) ; JER.6.9."}
- {lemma: cɔ́-cɔ́, status: attested, pos: ideo, gloss: {fr: "vite, rapidement, sans tarder", en: "quickly, at once, hurriedly"}, domains: ["8.4.8", "9.2.8"], childs: {page: 55, form: "cɔ́(-cɔ́)"}, example: GEN.18.6, note: "Abraham luɛi cɔ́-cɔ́ o cɛi-kola-toandaa ndɔɔ nin « Abraham se hâta d'entrer dans sa tente » (GEN.18.6)."}
- {lemma: cɔnndo, status: respelled, pos: noun, gloss: {fr: "régime (de bananes, de noix de palme)", en: "bunch (of bananas, palm nuts)"}, domains: ["1.5.5"], keita: {form: "TYönndo", page: 16}, childs: {page: 57, form: "cɔ̀ŋndó", sense: "bunch or stalk of bananas"}, note: "Keita le distingue de työnndon « mil » (voir cɔnndon)."}
- {lemma: cualen, status: attested, pos: noun, class: len, gloss: {fr: "petit (d'un animal), nouveau-né ; fillette", en: "young (of an animal), newborn; little girl"}, domains: ["1.6.3", "2.6.4"], keita: {form: "Tyualen", page: 35}, childs: {page: 61, form: "cùàléŋ", sense: "fetus; small (female) child"}, example: LEV.22.27, note: "cualen le bɛnda mì le lo kala ndɔ ikɛi « le petit restera avec sa mère » (LEV.22.27) ; un lionceau (EZK.19.5). Keita : Tyualen = Tyuaa + len « fillette »."}
- {lemma: cuanndo, status: attested, pos: noun, gloss: {fr: "ma fille (en s'adressant à une jeune femme)", en: "daughter, my daughter (in address)"}, domains: ["4.1.9"], childs: {page: 61, form: "cùàŋndó", sense: "girl, daughter"}, example: RUT.3.11, note: "Toujours en apostrophe : Noémi et Boaz à Ruth (RUT.2.2, RUT.3.10), Jephté à sa fille (JDG.11.35)."}
- {lemma: cuiyo, status: attested, pos: verb, gloss: {fr: "broyer, écraser, réduire en poussière", en: "crush, grind to powder"}, domains: ["7.7.6"], childs: {page: 63, form: "cùìyó"}, example: DAN.7.7, note: "O va dioo a cuiyo « elle dévorait et broyait » (DAN.7.7, DAN.7.19) ; I co nda cuiyo ... maa cundu « je les broie comme la poussière » (2SA.22.43). Moyen : cuinun « se briser »."}
- {lemma: cunndo, status: attested, pos: verb, gloss: {fr: "sentir, dégager une odeur ; puer", en: "smell, give off a smell; stink"}, domains: ["2.3.4"], childs: {page: 66, form: "cùŋndo"}, example: JHN.11.39, note: "O co nin cunndo fulaa « il sent déjà » (JHN.11.39) ; i co cunndo kuí-kuí « je pue » (PSA.38.6) ; aussi en bonne part : Po nuu co cunndo ... « l'odeur de mon fils » (GEN.27.27). Voir cun « odeur »."}
- {lemma: cuunɔnndo, status: attested, pos: verb, forms: [cuunun], gloss: {fr: "s'écouler, passer, prendre fin (des jours, de la vie)", en: "pass away, run out, come to an end (of days, life)"}, domains: ["8.4.6"], childs: {page: 68, form: "cùùnɔ̌ŋndó", sense: "be used up, be finishing"}, example: JOB.9.25, note: "Moyen de cuu « finir ». Palɛi nii ... keleŋaa cuunɔnndo « mes jours passent vite » (JOB.9.25) ; Palɛi nii cuunun « mes jours sont finis » (JOB.17.11)."}
- {lemma: bàà, status: attested, pos: part, gloss: {fr: "est-ce que (en tête de question) ; ou bien", en: "question marker (sentence-initial); or"}, domains: ["9.4.6", "9.6.3"], childs: {page: 2, form: "bàà", sense: "or, whether"}, example: GEN.3.1, note: "Bàà nuaa Hala dimul niaa ni ... ? « Dieu a-t-il vraiment dit ... ? » (GEN.3.1) ; Bàà mì vin Abraham ... ? « Cacherai-je à Abraham ... ? » (GEN.18.17). Ne pas confondre avec baa « main »."}
- {lemma: baa, status: respelled, pos: noun, gloss: {fr: "prix", en: "price"}, domains: ["6.8.4"], keita: {form: "Baa (T H D)", page: 17}, childs: {page: 3, form: "báá"}, note: "Keita oppose Baa (ton haut) « le prix » à Baa (ton bas) « la main » ; Fallo vèè kolaa hoo nö yè baa « Monsieur, quel est le prix de ce pagne ? » (p. 59). La forme baa est dans la Bible, mais au sens de « main »."}
- {lemma: bɛɛŋun, status: attested, pos: noun, gloss: {fr: "morceaux de viande, chair (sans os)", en: "pieces of meat, flesh (boneless)"}, domains: ["5.2.3", "2.1.7"], childs: {page: 12, form: "bèèŋndé", sense: "boneless meat, fillet"}, example: GEN.4.4, note: "Pluriel. visin bɛɛŋun macuɛin « les morceaux gras » (GEN.4.4) ; visin bɛɛŋun cɔlu kon « la chair du taureau » (EXO.29.14)."}
- {lemma: bɛɛsio, status: respelled, pos: noun, gloss: {fr: "porc (parler de Towve)", en: "pig (Towve dialect)"}, domains: ["6.3.1"], keita: {form: "Bèèsio"}, childs: {page: 12, form: "bèèsìó"}, note: "Keita, tableau des parlers (introduction) : Bèèsio à Towve (kpekeduei), Pewvo à Luannde et Sayaaninnde, Poovo en kisiduei. Le mot courant et biblique est pewvo."}
- {lemma: bɔɔndɔɔ, status: respelled, pos: noun, plural: bɔɔndɔɛi, gloss: {fr: "espèce d'arbre", en: "a species of tree"}, domains: ["1.5.1"], keita: {form: "Bööndöö : bööndöèi", page: 26}, childs: {page: 30, form: "bɔ̀ɔ̀ndɔ̀ɔ́", sense: "flowering tree with light softwood, used for soap; viscous sap"}, note: "Keita le cite comme exemple de nom d'arbre en -ɔ au pluriel -ɛi."}
- {lemma: capo, status: respelled, pos: adv, gloss: {fr: "beaucoup (adverbe de quantité)", en: "much, a lot (adverb of quantity)"}, domains: ["8.1"], keita: {form: "tyapo", page: 117}, childs: {page: 39, form: "cápò"}, note: "Keita, adverbes de quantité : Faya yöngu ndu maalon tyapo « Faya lui a donné beaucoup de riz »."}
- {lemma: ciee-piɔ́m, status: attested, pos: noun, gloss: {fr: "séjour des morts, pays des ancêtres", en: "abode of the dead, land of the ancestors"}, domains: ["4.9.6", "2.6.6"], childs: {page: 43, form: "cíéé-pìɔ̀mndó", sense: "town of the dead"}, example: GEN.25.8, note: "De ciee « ville » et piɔ́m- « mort ». diam vanaa ndɔa ciee-piɔ́m « être réuni aux siens (mourir) » (GEN.25.8, JDG.2.10)."}
