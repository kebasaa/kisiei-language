# Words found by going through Childs (2000), A Dictionary of the Kisi Language, printed pages 351-418,
# and looking for the northern counterpart of each headword in the Kisiei Bible (BKG) or in Keita (1979).
# Forms and meanings follow the Bible (status attested) or Keita respelled (status respelled).

- {lemma: tɛɛnuu, status: attested, pos: verb, gloss: {fr: "dégager, défricher (un chemin)", en: "clear (a way), clear of vegetation"}, domains: ["6.2.2", "6.5.4"], childs: {page: 354, form: "tèènùùwó", sense: "clear an area of large vegetation for cultivation"}, example: ISA.40.3, note: "La tɛɛnuu nɛi Mɛlɛka-oo « préparez le chemin du Seigneur » (ISA.40.3)."}
- {lemma: tɛilullo, status: attested, pos: verb, forms: [tɛilul, tɛilu], gloss: {fr: "tendre, étendre (les mains) vers ; tendre (la joue) à", en: "stretch out, spread (the hands) to; offer (the cheek) to"}, domains: ["7.3.4", "7.1"], childs: {page: 355, form: "tèìlúlló", sense: "spread out (e.g. to dry) for someone; open one's hands to someone"}, example: ISA.65.2, note: "Bénéfactif d'un verbe « étendre » (Childs tèìyó). tɛilul ndu balan « tends les mains vers lui » (JOB.11.13) ; mò tɛilu vana co ndu lɔɔ-o kpannde « qu'il tende la joue à celui qui le frappe » (LAM.3.30)."}
- {lemma: tííndííyo, status: attested, pos: noun, forms: [tííndíí], gloss: {fr: "talon (bɛngu tííndííyo)", en: "heel (bɛngu tííndííyo)"}, domains: ["2.1.3"], childs: {page: 360, form: "tíndííyé", sense: "heel, ankle"}, example: GEN.3.15, note: "Toujours avec bɛngu « pied » : bɛngu tííndííyo « talon » (GEN.3.15, GEN.25.26, JOB.18.9)."}
- {lemma: tindima, status: attested, pos: noun, forms: [tindian], gloss: {fr: "vagues, flots", en: "waves, billows"}, domains: ["1.3.2"], childs: {page: 360, form: "tìndíléŋ", sense: "a place with a fast current, rapids in a river"}, example: JOB.9.8, note: "Pluriel (classe ma ; aussi tindian). Le singulier n'est pas attesté dans ce sens (tindilen « colonne » est un autre mot). tindian ma sim maa lakpaki « les flots se dressèrent comme un mur » (EXO.15.8)."}
- {lemma: tindi, status: attested, pos: noun, plural: tindila, gloss: {fr: "cicatrice (d'un ulcère, d'une brûlure) ; (pl.) marques", en: "scar (of a boil, burn); (pl.) marks"}, domains: ["2.5.3", "2.1.4"], childs: {page: 360, form: "tìndìó"}, example: LEV.13.23, note: "tindi piɔŋndo « cicatrice de l'ulcère » (LEV.13.23) ; tindi paw « cicatrice de la brûlure » (LEV.13.28) ; tindila « les marques (de Jésus) » (GAL.6.17). Homographe de tindi « réveiller »."}
- {lemma: tiŋndo, status: attested, pos: noun, gloss: {fr: "distance, intervalle, espace (entre deux lieux)", en: "distance, space (between two places)"}, domains: ["8.2.6"], childs: {page: 361, form: "tíŋndó", sense: "a measure of distance, roughly a mile; also a demijohn bottle"}, example: GEN.30.36, note: "Mó bɛndi tiŋndo nda tɛɛn nda Yakɔb « il mit une distance (de trois jours) entre lui et Jacob » (GEN.30.36). Homographe de tiŋndo « île » (Keita)."}
- {lemma: tongei, status: attested, pos: noun, forms: [tongii], gloss: {fr: "largeur ; largeur de main, palme", en: "width, breadth; handbreadth, span"}, domains: ["8.2.8"], childs: {page: 365, form: "tɔ̀ŋgéí", sense: "(adjective) wide (from tɔ̀ŋɔ̀ɔ́ 'widen')"}, example: 1KI.7.23, note: "tongei dunndo tɔ́ « large de dix coudées » (1KI.7.23) ; pɛngɔn tongei a ba kɔllo « une bordure large d'une main » (EXO.25.25) ; tongii « palme, empan » (PSA.39.6, ISA.40.12). Cf. tongu « être large »."}
- {lemma: tóndóó, status: attested, pos: noun, forms: [tóndó], gloss: {fr: "fournaise, four", en: "furnace, kiln"}, domains: ["6.6.2", "5.5.7"], childs: {page: 365, form: "tóndóó", sense: "blacksmith's furnace; also the base of elephant grass; a young cow"}, example: DAN.3.23, note: "tóndó bɛndu « grande fournaise » (EXO.9.8) ; tóndó icilin tuwvo « fournaise à fondre le fer » (DEU.4.20)."}
- {lemma: tɔ́ɔ́, status: attested, pos: noun, plural: tɔ́ɔ́lan, gloss: {fr: "renommée, réputation ; nouvelle, bruit", en: "fame, renown, reputation; news, report"}, domains: ["3.5.1", "4.5.6"], childs: {page: 369, form: "tɔ́ɔ́"}, example: GEN.6.4, note: "vana tɔ́ɔ́ « homme renommé » (GEN.34.19) ; mí tɔ́ɔ́ tiw o cɛi lemasa « la nouvelle parvint au palais » (GEN.45.16) ; tɔ́ɔ́lan « nouvelles » (JER.4.15)."}
- {lemma: tɔndaa, status: attested, pos: verb, forms: [tɔnda], gloss: {fr: "tisser, ourdir (le fil)", en: "weave, warp (thread)"}, domains: ["6.6.1"], childs: {page: 369, form: "tɔ̀ndàá", sense: "make the warp thread for weaving, wrap spools; also defame someone"}, example: ISA.19.9, note: "kola nda tɔnda « l'étoffe qu'ils tissèrent » (EXO.39.22) ; vanaa co funnden tɔndaa « ceux qui travaillent le lin » (ISA.19.9) ; kola-yɔɔsɔɔ o ndu tɔndaa « ensouple de tisserand » (1CH.11.23)."}
- {lemma: tuɛi, status: attested, pos: verb, gloss: {fr: "rôtir, griller (la viande)", en: "roast (meat)"}, domains: ["5.2.1"], childs: {page: 370, form: "tùèìyɔ̀ɔ́"}, example: EXO.12.8, note: "Homographe de tuɛi « entendre » (tueyɔɔ). A bɛnda mà tuɛi visin mun « vous rôtirez la viande » (EXO.12.8) ; o tuɛi vision « il rôtit la viande » (ISA.44.16)."}
- {lemma: tuɛndɔɔ, status: attested, pos: noun, gloss: {fr: "burin, ciseau (à graver)", en: "chisel, engraving tool"}, domains: ["6.7.1", "3.5.7"], childs: {page: 371, form: "túéndɔ́ɔ́", sense: "a blacksmith's chisel for cutting iron"}, example: JER.17.1, note: "tuɛndɔɔ a á ciliŋii « burin de fer » (JOB.19.24) ; aussi « outil » de taille (EXO.20.25)."}
- {lemma: tuiŋio, status: attested, pos: verb, forms: [tuiŋi], gloss: {fr: "retirer, arracher du feu", en: "take out of the fire, snatch from the fire"}, domains: ["7.3.2", "5.5"], childs: {page: 371, form: "tùìŋìó"}, example: JUD.1.23, note: "La tuiŋi nda o yin « arrachez-les du feu » (JUD.1.23) ; yoomu ndaa tuiŋio o yinnden nin « sauver leur vie des flammes » (ISA.47.14)."}
- {lemma: tuituiyaa, status: attested, pos: verb, gloss: {fr: "plié, roulé (à plusieurs plis)", en: "folded, rolled up"}, domains: ["7.5"], childs: {page: 372, form: "tùìtùìyó", sense: "fold together, roll up (plural of tùwɔ̀ɔ́ 'fold')"}, example: JHN.20.7, note: "o va o tuituiyaa « (le linge) était plié » (JHN.20.7)."}
- {lemma: tumndo, status: attested, pos: noun, plural: tumnda, gloss: {fr: "base, pied, socle ; cep, souche (de vigne) ; (pl.) vignes", en: "base, foot, socket; stock (of a vine); (pl.) vineyards"}, domains: ["8.6.2", "1.5.5"], childs: {page: 373, form: "tùmndó", sense: "bottom, base, background; buttocks, anus; palm nut head"}, example: GEN.40.9, note: "rɛsɛn tumndo « cep de vigne » (GEN.40.9) ; tumnda n'rɛsɛnndan « les vignes » (JDG.21.21) ; tumnda fondo « nu » (GEN.2.25)."}
- {lemma: tumulu, status: attested, pos: verb, forms: [tumulnin], gloss: {fr: "pourrir, se corrompre, puer", en: "rot, putrefy, become foul"}, domains: ["1.4.1", "2.3.4"], childs: {page: 373, form: "tùmùlló"}, example: PSA.38.6, note: "Pavii nii tumulu « mes plaies pourrissent » (PSA.38.6) ; peela pɔmbɔlan la tumulnin « les canaux deviendront infects » (ISA.19.6)."}
- {lemma: tumulɛi, status: attested, pos: adj, forms: [tumulɛiyon, tumulɛin], gloss: {fr: "pourri, corrompu, impur", en: "rotten, putrid, unclean"}, domains: ["8.3.7"], childs: {page: 373, form: "tùmúléí"}, example: LEV.19.7, note: "De tumulu. visin tumulɛiyon « viande avariée » (LEV.19.7) ; maa ɲɛ tumulɛi « comme une chose impure » (EZK.7.19)."}
- {lemma: tundɔɔ, status: attested, pos: verb, forms: [tundan], gloss: {fr: "courber, tordre ; pervertir (la justice, les paroles) ; accabler, opprimer", en: "bend, twist; pervert (justice, words); oppress"}, domains: ["8.3.1", "4.7"], childs: {page: 373, form: "tùndɔ̀ɔ́", sense: "bend or curve"}, example: JOB.8.3, note: "le nda tundɔɔ o baala « pour les accabler de travaux » (EXO.1.11) ; dɛnɛ sandaa tundɔɔ « pervertir la justice » (JOB.8.3) ; vanaa co a tundan-nda « ceux qui sont courbés » (PSA.145.14). Aussi « délibérer » (MAT.27.7, ACT.25.12). Cf. tundu « se prosterner »."}
- {lemma: tùúlen, status: attested, pos: noun, gloss: {fr: "un peu, petite quantité, juste ce qu'il faut", en: "a little, a small amount, (just) enough"}, domains: ["8.1"], childs: {page: 374, form: "tùùléŋ", sense: "being enough, sufficient"}, example: PRO.15.16, note: "O co fisa mì vana nɔ tùúlen « mieux vaut peu de bien » (PRO.15.16) ; a dio man tùúlen « manges-en avec mesure » (PRO.25.16)."}
- {lemma: tuŋndo, status: attested, pos: verb, gloss: {fr: "frire, cuire (des gâteaux) pour (qqn)", en: "fry, bake (cakes) for (someone)"}, domains: ["5.2.1"], childs: {page: 374, form: "tùŋndó", sense: "fry for someone (benefactive of tòŋɔ̀ɔ́ 'fry')"}, example: JER.44.19, note: "Bénéfactif de toŋɔɔ « frire » (JER.7.18) : tuuliaala ndɔlan-ndo tuŋndo a ndu « lui cuire des gâteaux à son image » (JER.44.19)."}
- {lemma: tuvaa, status: attested, pos: noun, plural: tuvaala, forms: [tuvaalen], gloss: {fr: "mesure, unité de mesure ; (pl.) poids et mesures ; (yoole tuvaalen) cordeau", en: "measure, measuring unit; (pl.) weights and measures; (yoole tuvaalen) measuring line"}, domains: ["8.2.8"], childs: {page: 376, form: "tùùwó", sense: "(verb) measure, take the size of; decide"}, example: EXO.16.36, note: "De tuuvo « mesurer ». ɲɛla tuvaala « poids, mesures » (LEV.19.36) ; yoole tuvaalen « cordeau à mesurer » (ZEC.2.5)."}
- {lemma: tuulul, status: attested, pos: verb, forms: [tuululnin], gloss: {fr: "mesurer (pour qqn), mesurer à ; montrer (le modèle) à", en: "measure out (to someone); show (a pattern) to"}, domains: ["8.2.8"], childs: {page: 375, form: "tùùlùlló", sense: "measure for someone"}, example: LUK.6.38, note: "Bénéfactif de tuuvo « mesurer ». A tuululnin niaa ɲɔɔn ɲɛkɛndɛi « on vous versera une bonne mesure » (LUK.6.38) ; mɛɛ ya tuulul nɔm ndu « selon le modèle que je t'ai montré » (HEB.8.5)."}
- {lemma: tuuŋanndan, status: attested, pos: verb, gloss: {fr: "se comparer (les uns aux autres)", en: "compare oneselves with one another"}, domains: ["8.3.5"], childs: {page: 375, form: "tùùŋǎŋndó", sense: "compare, make comparisons"}, example: 2CO.10.12, note: "nda pilaa tɛɛn nda co tuuŋanndan ni « ils se comparent entre eux » (2CO.10.12). Moyen pluriel de tuuvo « mesurer »."}
- {lemma: tuunduɛiyo, status: attested, pos: adj, forms: [tuunduɛiyan, tuundɛilan], gloss: {fr: "tortueux, détourné ; pervers, rusé", en: "crooked, twisted; perverse, crafty"}, domains: ["8.3.1", "4.3"], childs: {page: 375, form: "túúndúéí-"}, example: PRO.10.9, note: "vana kela pɛ kela tuunduɛiyo « celui qui suit des voies tortueuses » (PRO.10.9) ; silala ndala tuundɛilan « les desseins des rusés » (JOB.5.13). De tundɔɔ « courber »."}
- {lemma: tuunduanndo, status: attested, pos: adj, forms: [tuunduanndan, tuunduan], gloss: {fr: "tortueux, courbe ; pervers (conduite)", en: "crooked, winding; perverse (conduct)"}, domains: ["8.3.1", "4.3"], childs: {page: 375, form: "tùùndɔ̌ŋndó", sense: "bend over, be bent (middle plural of 'bend')"}, example: PRO.28.6, note: "nɛila tuunduan-ndan la sandunin « les chemins tortueux seront redressés » (LUK.3.5) ; kela tuunduanndo « conduite perverse » (PSA.18.27)."}
- {lemma: tuunduuvo, status: attested, pos: verb, gloss: {fr: "rendre tortueux, embrouiller (un chemin)", en: "make crooked, confuse (a path)"}, domains: ["8.3.1"], childs: {page: 375, form: "tùùndùùwó", sense: "bend many things (plural of 'bend')"}, example: ISA.3.12, note: "nɛi niaa co kɔlan coo-o tuunduuvo « ils embrouillent le chemin que vous suivez » (ISA.3.12)."}
- {lemma: tuvɔɔ, status: attested, pos: verb, gloss: {fr: "replier, retirer (le bras)", en: "draw back, fold back (the arm)"}, domains: ["7.3.2"], childs: {page: 376, form: "tùwɔ̀ɔ́", sense: "fold, fold around, wrap; bury; embrace; sprain"}, example: JOS.8.26, note: "Toujours négatif : ba ndóò bii kon bállo-o tuvɔɔ le « il ne retira pas la main qui tenait le javelot » (JOS.8.26 ; aussi 1KI.13.4). Rapprochement avec Childs à confirmer."}
- {lemma: vaa, status: attested, pos: noun, gloss: {fr: "sorte, genre (vaa lende « de cette sorte, tel »)", en: "kind, sort (vaa lende 'of that kind, such')"}, domains: ["8.3.5"], childs: {page: 377, form: "wàà"}, example: GEN.39.9, note: "dɛnɛ kɔlvesɛi bɛndu vaa lende « un si grand mal » (GEN.39.9) ; ɲɛla vaa lende « de telles choses » (1SA.17.39). Homographe de vaa « mille », vaa « cultiver », vaa « être »."}
- {lemma: vana-solia-lasálàá, status: attested, pos: noun, plural: vanaa-solia-lasálàá, forms: [vana-solia-lasálà], gloss: {fr: "prêtre, sacrificateur", en: "priest"}, domains: ["4.9.7", "4.5.1"], childs: {page: 380, form: "wàná-làsálàá", sense: "people involved in initiation ceremonies"}, example: GEN.41.45, note: "Litt. « personne qui offre à l'autel » (lasálàá « autel », cf. fonda-loamaa-lasálàá « autel des holocaustes »)."}
- {lemma: valaa, status: attested, pos: noun, plural: valalan, forms: [vala], gloss: {fr: "natte ; grabat, couche", en: "mat; pallet, bed"}, domains: ["5.1.1", "5.7"], childs: {page: 379, form: "wàlàá", sense: "(sleeping) mat"}, example: ACT.5.15, note: "o ɲɛla hinialan coo a o valalan coo « sur des lits et des grabats » (ACT.5.15) ; cua vala nɔmndo « prends ton grabat » (ACT.9.34) ; maa vala « comme une natte (roulée) » (ISA.34.4)."}
- {lemma: valoo, status: attested, pos: noun, gloss: {fr: "sécheresse, temps sec, absence de pluie", en: "drought, dry weather, absence of rain"}, domains: ["1.1.3"], childs: {page: 379, form: "wàlòó", sense: "a short dry spell, a break in the rains"}, example: HAG.1.11, note: "o tuisi niaa valoo coo « il fera venir la sécheresse sur vous » (DEU.11.17) ; Valoo vanin ni « il fera beau » (MAT.16.2)."}
- {lemma: veeliaa, status: attested, pos: verb, forms: [veeliaanin], gloss: {fr: "dessécher, tarir (les eaux, les fleuves)", en: "dry up (waters, rivers)"}, domains: ["1.3.2", "1.3.3"], childs: {page: 382, form: "wèèlìá", sense: "dry up (plural of wèlàá 'become dry')"}, example: ISA.42.15, note: "Pluriel de velaa « tarir ». I veeliaa peelan Esipte kpow « j'ai tari tous les fleuves d'Égypte » (ISA.37.25)."}
- {lemma: veelul, status: attested, pos: verb, gloss: {fr: "appeler (qqn) pour (qqn), faire venir", en: "call (someone) for (someone), summon"}, domains: ["3.5.1"], childs: {page: 382, form: "wèèlùlló"}, example: NUM.22.5, note: "Bénéfactif de veeloo « appeler ». mà kɔ veelul ndu ndu « qu'ils aillent le lui appeler » (NUM.22.5)."}
- {lemma: viiku, status: attested, pos: verb, forms: [vííkù], gloss: {fr: "avorter, mettre bas avant terme ; (nom) avorton", en: "miscarry, cast young; (noun) untimely birth"}, domains: ["2.6.3", "1.6.3"], childs: {page: 385, form: "wììkùùwó", sense: "miscarry, abort; also lose a spouse through death"}, example: GEN.31.38, note: "saa nɔmnda a cuinaa nɔmnda ve viiku le « tes brebis et tes chèvres n'ont pas avorté » (GEN.31.38) ; cɛlɛkpɛ nda viiku-o « l'enfant mort-né » (PSA.58.9)."}
- {lemma: vilɛi, status: attested, pos: adj, forms: [vilɛiye, vilɛilan], gloss: {fr: "long, haut, élevé", en: "long, high, tall"}, domains: ["8.2.2", "8.2"], childs: {page: 385, form: "wìlɛ̀-", sense: "long, tall, sharp"}, example: MAT.17.1, note: "pembii vilɛiye « une haute montagne » (MAT.17.1) ; yiiŋii vilɛiye « longue chevelure » (1CO.11.15) ; cɛila coocoola vilɛilan « les hautes tours » (ISA.2.15). Écrit sans accents, à la différence de vílɛ́iyo « mort »."}
- {lemma: vilɛi-vilɛi, status: attested, pos: adj, forms: [vilɛi-vilɛiya, vilɛi-vilɛiye, vilɛi-vilɛiyo, vilɛi-vilɛiyon], gloss: {fr: "très grand, de haute taille ; (vanaa vilɛi-vilɛiya) géants", en: "very tall, huge; (vanaa vilɛi-vilɛiya) giants"}, domains: ["8.2"], childs: {page: 385, form: "wìlɛ̀-"}, example: GEN.6.4, note: "Redoublement de vilɛi. Esiptenɔ vilɛi-vilɛi « un Égyptien de haute taille » (2SA.23.21) ; kpɛŋɛ lemasa vilɛi-vilɛiyo « un trône très élevé » (ISA.6.1)."}
- {lemma: vomullo, status: attested, pos: verb, forms: [vomul, vomulaa], gloss: {fr: "filer (le coton, la laine) ; (vomulaa) fileuse, quenouille", en: "spin (thread); (vomulaa) spinner, spindle"}, domains: ["6.6.1"], childs: {page: 388, form: "wòmùlló", sense: "spin cotton, weave"}, example: EXO.35.25, note: "vanlaandua caa vomullo-a « les femmes habiles à filer » (EXO.35.25) ; bala ndɔlan la sanga a vomullo « ses mains tiennent la quenouille » (PRO.31.19) ; vanaa vomulaa (2SA.3.29)."}
- {lemma: vomɔɔ, status: attested, pos: verb, forms: [viomɔɔ, viomnun], gloss: {fr: "envoyer (qqn), dépêcher ; charger, ordonner", en: "send (someone), dispatch; charge, command"}, domains: ["7.2.8", "4.5"], childs: {page: 387, form: "wìòmɔ̀ɔ́"}, example: GEN.37.13, note: "i co nɔm vomɔɔ « je vais t'envoyer » (GEN.37.13) ; Mɛlɛka co nɔm mɛlɛkanɔ ndɔɔ vomɔɔ laci « le Seigneur enverra son ange devant toi » (GEN.24.7). Variante viomɔɔ (EXO.4.13). Cf. viamaa « envoyer »."}
- {lemma: vowlul, status: attested, pos: verb, forms: [vowlulnin, vowlu], gloss: {fr: "mettre (dans), remplir pour (qqn) ; jeter à ; (vowlul X sondo) répondre à X", en: "put (into), fill for (someone); throw to; (vowlul X sondo) answer X"}, domains: ["7.3.2", "3.5.1"], childs: {page: 389, form: "wòùlùlló", sense: "dress someone, put (clothes) on someone; put in for someone"}, example: GEN.44.1, note: "Vowlul vannda ha ɲɛdiaa o bɔlɔla ndalan nin « remplis de vivres les sacs de ces hommes » (GEN.44.1) ; Mɛlɛka vowlulnin niaa sondo le « le Seigneur ne vous répondra pas » (1SA.8.18) ; vowlu tunaa cuawva « le jeter aux petits chiens » (MAT.15.26)."}
- {lemma: vɔsɔkɔɔ, status: attested, pos: noun, gloss: {fr: "sol pierreux, terrain rocailleux", en: "stony ground, rocky soil"}, domains: ["1.2.1", "6.2.9"], childs: {page: 391, form: "wɔ̀sɔ̀kɔ́ɔ́", sense: "gravel; gravelly upland soils"}, example: MRK.4.5, note: "Mí n tiŋ deli o vɔsɔkɔɔ nin « d'autres tombèrent sur le sol pierreux » (MRK.4.5)."}
- {lemma: vɔ́yɔ́ɔ́, status: attested, pos: noun, gloss: {fr: "restes (de nourriture), reste", en: "leftovers, remainder (of food)"}, domains: ["5.2.2"], childs: {page: 392, form: "wɔ́yɔ́ɔ́"}, example: RUT.2.14, note: "mó dia, mó pum, mó mɛi vɔ́yɔ́ɔ́ « elle mangea, se rassasia et en garda un reste » (RUT.2.14)."}
- {lemma: vɔyɔn, status: attested, pos: ideo, gloss: {fr: "(s'asseoir par terre) tout abattu, prostré", en: "(sit on the ground) dejectedly, slumped"}, domains: ["9.2.8", "7.1.2"], childs: {page: 392, form: "wɔ́yɔ́ŋ", sense: "describes relaxing or sitting"}, example: ISA.47.1, note: "Toujours après cal lɛŋ « s'asseoir par terre » : La cal lɛŋ vɔyɔn « assieds-toi par terre » (ISA.47.1 ; aussi ISA.3.26, EZK.26.16)."}
