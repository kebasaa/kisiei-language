- {lemma: yoola, status: attested, pos: verb, gloss: {fr: "accorder (une faveur), faire en sorte que", en: "grant (favour), cause, bring about"}, domains: ["4.3.4"], childs: {page: 411, form: "yòòlàá", sense: "help, assist, sanction, bless"}, example: EXO.11.3, note: "Mí Mɛlɛka yoola mí Esiptea ca Israɛlla ɲia « le Seigneur fit que les Égyptiens regardent Israël avec faveur » (EXO.11.3 ; aussi EXO.12.36)."}
