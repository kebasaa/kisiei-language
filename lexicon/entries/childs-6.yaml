- {lemma: yɔŋulɔnndo, status: attested, pos: noun, plural: yɔŋulɔnnda, forms: [yɔŋulɔn, yɔŋulɔnndan, yɔŋulannda], gloss: {fr: "blessure, coup ; (yɔŋulannda) blessés", en: "wound, injury; (yɔŋulannda) the wounded"}, domains: ["2.5.3"], childs: {page: 415, form: "yɔ̀ŋùlɔ̌ŋndáŋ", sense: "harming oneself (middle plural of yɔ̀ŋùlló 'harm')"}, example: DEU.17.8, note: "De yɔŋul « blesser ». siangunin a yɔŋulɔn kon « guérir de cette blessure » (2KI.1.2) ; deli a yɔŋulannda « tombèrent blessés » (JDG.9.40)."}
- {lemma: yɔɔsɔɔ, status: attested, pos: noun, plural: yɔɔsɔla, gloss: {fr: "fil (à tisser) ; (kola-yɔɔsɔɔ) ensouple de tisserand", en: "thread, yarn (for weaving); (kola-yɔɔsɔɔ) weaver's beam"}, domains: ["6.6.1"], childs: {page: 416, form: "yɔ́ɔ́sɔ́ɔ́", sense: "thread of traditional woven cloth; also a young palm tree"}, example: EXO.25.4, note: "yɔɔsɔla nda yin a kaan-ndan « fils violet et bleu » (EXO.25.4) ; kola-yɔɔsɔɔ o ndu tɔndaa « ensouple de tisserand » (1CH.11.23)."}
