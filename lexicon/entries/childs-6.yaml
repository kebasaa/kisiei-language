- {lemma: yuunda, status: attested, pos: verb, gloss: {fr: "retirer, enlever (les vêtements à qqn), dépouiller", en: "take away, strip off (someone's clothes)"}, domains: ["5.3.7", "7.3.2"], childs: {page: 418, form: "yùùndàá", sense: "remove or strip, scrape clean"}, example: HOS.2.11, note: "kola ni ... va ndu siɛmbulan kumbɔɔ-o yuunda « je lui reprendrai ma laine et mon lin qui couvraient sa nudité » (HOS.2.11). Une seule attestation."}
- {lemma: yilili, status: attested, pos: ideo, gloss: {fr: "désert, solitaire, isolé (lieu)", en: "deserted, desolate, lonely (place)"}, domains: ["9.2.8", "8.5.4"], childs: {page: 407, form: "yílílí", sense: "sleepily, weakly, lackadaisically; by oneself"}, example: MAT.14.15, note: "Fondaa ho co bɔɔ yilili « cet endroit est désert » (MAT.14.15) ; o fonda yilili « dans un lieu désolé » (DEU.32.10). Rapprochement avec Childs (« seul, à l'écart ») à confirmer."}
- {lemma: yiyannda, status: attested, pos: noun, gloss: {fr: "pensées, projets, desseins (pl.)", en: "thoughts, plans, intentions (pl.)"}, domains: ["3.2"], childs: {page: 409, form: "yìyǎŋndó", sense: "thoughts, preoccupations, obsessions"}, example: GEN.6.5, note: "Pluriel ; le singulier yiyanndo se confond avec le verbe yiyanndo « penser ». yiyannda vɔɔnnda « de mauvaises pensées » (GEN.6.5) ; mí sina yiyannda ndalan « je connais leurs pensées » (DEU.31.21)."}
- {lemma: yangaa, status: attested, pos: verb, gloss: {fr: "tarder, s'attarder ; passer la matinée (a yangaa kɛndɛ : salutation dite entre 9 h et 11 h)", en: "delay, linger; spend the morning (a yangaa kɛndɛ: greeting used mid-morning, 9-11 a.m.)"}, domains: ["8.4.2", "8.4.1", "4.3.7"], keita: {form: "yangaa", page: 21}, childs: {page: 395, form: "yààŋàá", sense: "spend or pass the morning"}, example: ACT.9.38, note: "Bible : yangaa le, hun cɔ́-cɔ́ « ne tarde pas, viens vite » (ACT.9.38) ; yangaa le len timbio le « ne tarde pas à l'accomplir » (ECC.5.3). Keita : a yangaa kèndè, la yangaa kèndè ; forme abrégée a yangaa, la yangaa. Cf. lɔl kɛndɛ (le matin au réveil), niilu kɛndɛ (11 h-19 h)."}
- {lemma: yangaa, status: respelled, pos: noun, gloss: {fr: "crevette, écrevisse", en: "shrimp, crayfish"}, domains: ["1.6.1"], keita: {form: "Yangaa", page: 27}, childs: {page: 398, form: "yàŋàá"}, note: "Keita cite Yangaa « crevettes » parmi les noms invariables au pluriel (avec Saa et Nyinaa). Homographe de yangaa « tarder », seul attesté dans la Bible."}
- {lemma: vosɛ, status: respelled, pos: interj, gloss: {fr: "salut (adressé à plusieurs) : la vosɛ !", en: "greetings (to several people): la vosɛ!"}, domains: ["4.3.7", "9.2.7"], keita: {form: "lavosè", page: 21}, childs: {page: 389, form: "wósè"}, note: "Keita : isɛ s'adresse à une seule personne, lavosè à deux ou plusieurs. Pluriel de isɛ."}
- {lemma: yala, status: attested, pos: verb, gloss: {fr: "(auxiliaire, toujours négatif : yala X le) ne pas encore, ne pas … de sitôt ; être lent à", en: "(auxiliary, always negative: yala X le) not yet, not soon; be slow to"}, domains: ["9.4.1", "8.4.8"], childs: {page: 396, form: "yàlàá", sense: "spend a while doing (defective verb, used in the negative)"}, example: EXO.34.6, note: "I yala kɔl tuulu le « lent à la colère » (EXO.34.6) ; kani mun yala cuulu le « car ils n'avaient pas encore poussé » (EXO.9.32) ; o yala nda tovɔɔ le « il ne les chassa pas aussitôt » (JDG.2.23). Homographe de yala, forme de yàlàá « lion » et yalaa « filet »."}
- {lemma: tɛɛnduuo, status: attested, pos: verb, gloss: {fr: "couver (des œufs)", en: "hatch (eggs)"}, domains: ["1.6.3"], childs: {page: 354, form: "tèèndùùwó", sense: "hatch eggs"}, example: ISA.59.5, note: "A co pelta hɔ̀ɔ̀lɔ́ɔ̀ tɛɛnduuo « ils couvent des œufs de vipère » (ISA.59.5). Une seule attestation."}
- {lemma: tɛ̀i, status: attested, pos: verb, gloss: {fr: "étendre, étaler (au soleil, pour sécher)", en: "spread out (in the sun, to dry)"}, domains: ["7.5.9", "6.2.6"], childs: {page: 356, form: "tèìyó", sense: "spread, esp. in the sun to dry; spread one's hands or legs apart"}, example: 2SA.17.19, note: "mó tɛ̀i malun kullon lecoo « elle étendit du grain dessus » (2SA.17.19) ; ma tɛ̀i nda o dɔ́ɔ́ngɔ́ɔ̀ balɔɔ « ils les étalèrent autour du camp » (NUM.11.32) ; fonda vana tɛ̀i yalalan « lieu où l'on étend les filets » (EZK.26.5). Dans siow X tɛ̀i « tuer X sur le coup » (2SA.1.10, JDG.9.54) le sens est peut-être autre. Cf. tɛilullo."}
- {lemma: tɛ́ɛ́nɛí, status: attested, pos: noun, gloss: {fr: "petit caillou, grain (de poussière)", en: "small stone, grain (of dust)"}, domains: ["1.2.2"], keita: {form: "Tèènön", page: 155}, childs: {page: 357, form: "ténéí", sense: "small rock or stone; ten large sheaves of rice"}, example: PRO.8.26, note: "hali tɛ́ɛ́nɛí tasei o cundoo nin lɛŋ « ni le premier grain de la poussière du monde » (PRO.8.26). Pluriel : Keita tɛɛnɔn « gravier » (Childs ténɔ́ŋ)."}
- {lemma: tiŋ, status: attested, pos: adv, forms: [tíŋ], gloss: {fr: "un peu, quelque peu ; une partie, quelques-uns", en: "a little, slightly; some, a few"}, domains: ["8.1", "9.3"], childs: {page: 360, form: "tìŋ", sense: "(adj.) some, a few; (adv.) a little, slightly"}, example: GEN.18.2, note: "isisi tiŋ lándán « debout à quelque distance » (GEN.18.2) ; kpeyanndo o tiŋ « une partie du grain » (LEV.2.16) ; co tiŋ n'siaŋa « rougeâtre » (LEV.13.43) ; mel a tiŋ « laisser quelques-uns » (GEN.33.15)."}
- {lemma: tɔ́ɔ́yaa, status: attested, pos: noun, gloss: {fr: "faute, blâme, responsabilité (bii X tɔ́ɔ́yaa « tenir X pour responsable, blâmer X »)", en: "blame, fault, responsibility (bii X tɔ́ɔ́yaa 'hold X responsible, blame X')"}, domains: ["4.7", "3.5.1"], childs: {page: 370, form: "tɔ́ɔ́yáŋ"}, example: ROM.9.19, note: "le yɛɛ Hala kalaa co yɛ naa niko tɔ́ɔ́yaa biyɔɔ? « pourquoi Dieu blâme-t-il encore ? » (ROM.9.19 ; aussi ACT.19.40, JER.51.25)."}
- {lemma: tue, status: attested, pos: noun, gloss: {fr: "goutte ; (tue-tue) goutte à goutte", en: "drop; (tue-tue) drop by drop"}, domains: ["1.3", "8.1"], childs: {page: 370, form: "túé-túé", sense: "(ideophone) sound of water falling a drop at a time"}, example: JER.3.3, note: "tue bɛɛ piɔɔ del a sialten te « pas une goutte de pluie n'est tombée » (JER.3.3) ; mó va delio tue-tue « (la myrrhe) coulait goutte à goutte » (SNG.5.5). Childs a aussi túé « une goutte » (idéophone)."}
- {lemma: tueiyo, status: attested, pos: verb, gloss: {fr: "laver, rincer (l'intérieur des récipients)", en: "wash, rinse (the inside of vessels)"}, domains: ["5.6"], childs: {page: 370, form: "tùèìyó"}, example: MAT.23.25, note: "la co taala kólaa a hɛngɛiyo tueiyo o kɔɔ « vous lavez l'extérieur de la coupe et du plat » (MAT.23.25 ; aussi MRK.7.4)."}
- {lemma: vuilen, status: attested, pos: noun, class: len, gloss: {fr: "vol, larcin", en: "theft, stealing"}, domains: ["4.3", "4.7"], childs: {page: 385, form: "wììléŋ"}, example: EXO.22.1, note: "De vuiyo « voleur ». bulio le luɛyɔɔ vuilen « en train d'entrer par effraction pour voler » (EXO.22.1) ; mɛɛ vuilen ya tosa ni « ce serait un vol de ma part » (GEN.30.33) ; o kɔɛ vuilen « il va voler » (JOB.24.14)."}
