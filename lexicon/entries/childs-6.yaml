- {lemma: yifanndo, status: attested, pos: verb, forms: [yifan], gloss: {fr: "s'abriter, se réfugier ; se retirer, se tenir à l'écart", en: "take shelter, take refuge; withdraw, keep apart"}, domains: ["7.6", "7.2.3"], childs: {page: 406, form: "yìfǎŋndó", sense: "escape something, take precautions"}, example: ISA.30.2, note: "Moyen de yifa. le kɔlan yifanndo o vunduma Esipte « pour s'abriter à l'ombre de l'Égypte » (ISA.30.2) ; mó yifan « il se tint à l'écart » (GAL.2.12)."}
- {lemma: yimbu, status: attested, pos: verb, forms: [yimbɔɔ], gloss: {fr: "pousser en broussaille, croître sans soin (cheveux) ; (chemins) devenir déserts, envahis", en: "grow wild, grow long (hair); (roads) become deserted, overgrown"}, domains: ["1.5.6", "8.3"], childs: {page: 408, form: "yìmbàà", sense: "(adjective) overgrown, bushy"}, example: DAN.4.30, note: "yiiŋii ndɔɛi yimbu « ses cheveux poussèrent » (DAN.4.30) ; nɛila niaalan la yimbu « vos chemins seront déserts » (LEV.26.22) ; mal bolii ndɛi yimbɔɔ « laisser pousser leurs cheveux » (EZK.44.20)."}
- {lemma: yomɛiyo, status: attested, pos: adj, forms: [yomɛilen, yomɛiye], gloss: {fr: "cassé, brisé ; estropié (pied, main)", en: "broken; crippled (foot, hand)"}, domains: ["7.8.1", "2.5.4"], childs: {page: 410, form: "yòméí-", sense: "crippled, lame"}, example: LEV.21.19, note: "De yomɔɔ « casser ». vana bɛngu yomɛiyo « un homme au pied cassé » (LEV.21.19) ; kpɛ̀ndɛ̀le yomɛilen « un roseau brisé » (2KI.18.21)."}
- {lemma: yomio, status: attested, pos: verb, forms: [yomi, yominin], gloss: {fr: "briser, rompre (plusieurs choses)", en: "break (several things)"}, domains: ["7.8.1"], childs: {page: 410, form: "yòmìó", sense: "break (plural of yòmɔ̀ɔ́)"}, example: PSA.37.17, note: "Pluriel de yomɔɔ. kpaasiaala ndalan cɔu o yomio « les arcs des puissants sont brisés » (1SA.2.4) ; bala vanaa kɔlvesɛiya la yominin « les bras des méchants seront brisés » (PSA.37.17)."}
- {lemma: yomiyomio, status: attested, pos: verb, forms: [yomiyomi, yomiyominin, yomiyomiaa], gloss: {fr: "briser en morceaux, fracasser ; (vêtement) s'user, se déchirer", en: "break to pieces, shatter; (clothes) wear out"}, domains: ["7.8.1", "7.9"], childs: {page: 410, form: "yòmìyòmìó", sense: "break (double plural of yòmɔ̀ɔ́)"}, example: 1KI.22.49, note: "dɛ̀ndɛ̀la lan la yomiyomi « les navires se brisèrent » (1KI.22.49) ; bala ndɔlan bɛɛ la yomiyomi « ses mains furent brisées » (1SA.5.4) ; o kengelan mó yomiyomi « (le pain) s'est émietté » (JOS.9.12)."}
- {lemma: yoltan, status: attested, pos: noun, gloss: {fr: "grossesses, gestation (pl.)", en: "pregnancies, gestation (pl.)"}, domains: ["2.6.3", "1.6.3"], childs: {page: 410, form: "yǒltáŋ", sense: "pregnancy (plural of yǒlló)"}, example: JOB.39.2, note: "A cɔm nin mɛɛ kpɛ́ nda tosa paangon a yóltan yɛ? « sais-tu combien de mois dure leur gestation ? » (JOB.39.2) ; (JOB.21.10)."}
- {lemma: yondala, status: attested, pos: noun, gloss: {fr: "cris, clameurs (de joie, de victoire)", en: "cries, shouts (of joy, victory)"}, domains: ["3.5.1"], childs: {page: 411, form: "yòndàá", sense: "call, announcement, cry, complaint (yòndàlàŋ pl.)"}, example: PSA.118.15, note: "Yondala kɔlkɛndɛlan a yondala ɲaalelan « des cris de joie et de victoire » (PSA.118.15). Homographe de yondala « champs » (2SA.9.10), pluriel de yondoo."}
