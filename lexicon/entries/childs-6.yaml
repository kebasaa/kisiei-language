- {lemma: yɛlen, status: attested, pos: noun, class: len, gloss: {fr: "haine, animosité (tol X yɛlen « haïr X » ; yɛlen tollo « persécution, être persécuté »)", en: "hatred, animosity (tol X yɛlen 'hate X'; yɛlen tollo 'persecution, be persecuted')"}, domains: ["3.4.2", "4.8"], childs: {page: 404, form: "yɛ̀léŋ", sense: "hatred, bad feelings; (yɛ̀lɛ̀-tùlààléŋ) persecution"}, example: GEN.26.27, note: "O co niaa le tol-la yɛlen « vous me haïssiez » (GEN.26.27) ; vanaa co yɛlen tollo « ceux qui sont persécutés » (MAT.5.10) ; vanaa co ya yɛlen tollo-a « mes persécuteurs » (PSA.7.2)."}
- {lemma: yɛ́lɔ̀ɔ́, status: attested, pos: noun, gloss: {fr: "vipère, serpent venimeux", en: "viper, venomous snake"}, domains: ["1.6.1"], childs: {page: 404, form: "yɛ̀lɔ̀ɔ́", sense: "(spitting) cobra"}, example: JOB.20.16, note: "diɛɛmule yɛ́lɔ̀ɔ́ « la langue de la vipère » (JOB.20.16)."}
