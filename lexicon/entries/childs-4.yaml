- {lemma: mɛɛyaa, status: attested, pos: verb, forms: [mɛɛyanin], gloss: {fr: "sombrer, couler, s'enfoncer (dans l'eau)", en: "sink, go under (water)"}, domains: ["1.3.2", "7.2.2"], childs: {page: 245, form: "mɛ̀ɛ̀yàá", sense: "imbibe, drink deeply; sink, dive; get oneself into trouble"}, example: LUK.5.7, note: "mí la kandu mɛɛyaa « au point qu'elles enfonçaient » (LUK.5.7) ; mɛɛyanin o mɛmma ihɛllan tɛɛn « sombreront au cœur des mers » (EZK.27.27)."}
- {lemma: mɛɛyan, status: attested, pos: noun, class: an, gloss: {fr: "lait (maternel) ; seins", en: "(breast) milk; breasts"}, domains: ["2.1.2", "5.2.3"], childs: {page: 246, form: "mɛ̀ɛ̀yáŋ", sense: "breast, breast milk; also pus"}, example: HEB.5.12, note: "mɛɛyan … le ya vɔɛsio « des seins pour m'allaiter » (JOB.3.12) ; fɔ mɛɛyan « (il vous faut) du lait » (HEB.5.12). Cf. mɛɛlen « sein »."}
- {lemma: meilul, status: attested, pos: verb, forms: [meilu], gloss: {fr: "se taire (pour écouter), faire silence ; laisser (impuni)", en: "be quiet (and listen), stop talking; let off, leave (unpunished)"}, domains: ["3.5", "7.2.7"], childs: {page: 246, form: "mɛ̀ìlùlló", sense: "stop, desist (usually from talking) for someone"}, example: JOB.13.13, note: "Bénéfactif de meiyo « se taire ». Meilu vana nanu ! « Arrête ! » (1SA.15.16) ; meilul-la « taisez-vous » (JOB.13.13) ; mì meilul … « laisserais-je impunis … » (MIC.6.11)."}
- {lemma: mɛmi, status: attested, pos: verb, forms: [mɛminin], gloss: {fr: "faire rire ; amuser ; prêter à rire", en: "make laugh; amuse; make a laughing-stock"}, domains: ["3.4.1", "4.2.7"], childs: {page: 247, form: "mɛ̀mìó"}, example: GEN.21.6, note: "Causatif de mamɔɔ « rire ». Hala mɛmi ya « Dieu m'a fait rire » (GEN.21.6) ; mò hun mɛmi naa « qu'il vienne nous divertir » (JDG.16.25)."}
- {lemma: mɛngɛla, status: attested, pos: verb, gloss: {fr: "guetter, épier, tendre une embuscade à", en: "lie in wait for, watch secretly, ambush"}, domains: ["2.3.1", "4.8.3"], childs: {page: 247, form: "mɛ̀ŋɛ̀làá", sense: "watch secretly, spy on, sneak up on"}, example: HOS.13.7, note: "o mɛngɛla ndu « il le guettait » (EXO.21.13) ; mí mɛngɛla niaa … maa tambili « je vous guetterai comme un léopard » (HOS.13.7). Cf. mɛngɛlaa « poste de guet »."}
- {lemma: mɛngɔɔ, status: attested, pos: noun, gloss: {fr: "limace, escargot", en: "slug, snail"}, domains: ["1.6.1"], childs: {page: 248, form: "mɛ̀ŋɔ́ɔ́", sense: "slug, freshwater snail"}, example: PSA.58.9, note: "Une seule occurrence : mɛɛ mɛngɔɔ kɔa a tengaa « comme la limace qui fond en s'en allant » (PSA.58.9)."}
- {lemma: mɛllo, status: attested, pos: adj, forms: [mɛl], gloss: {fr: "gauche (o ba mɛllo coo « à gauche »)", en: "left (o ba mɛllo coo, on the left)"}, domains: ["8.5.2"], childs: {page: 249, form: "mìàllé", sense: "left side"}, example: GEN.13.9, note: "o ba mɛllo coo … o ba kɛndɔɔ coo « à gauche … à droite » (GEN.13.9) ; o ba mɛl ndaa « à leur gauche » (EXO.14.29). Correspondance ia (Childs) ~ ɛ (Bible), comme lìáŋ ~ lɛan « miel »."}
- {lemma: mɔɔva, status: attested, pos: verb, forms: [mɔɔvaa], gloss: {fr: "être englouti, recouvert ; s'enfoncer (dans la boue, l'eau)", en: "be engulfed, be covered over; sink (into mud, water)"}, domains: ["1.3.2", "7.3.7"], childs: {page: 252, form: "mɔ̀ɔ̀wàá", sense: "be buried, completely covered over"}, example: GEN.7.19, note: "pembun bɛndun … n mɔɔva lenin « les hautes montagnes furent recouvertes » (GEN.7.19) ; I co mɔɔvaa o loolio yingilaa nin « j'enfonce dans la boue profonde » (PSA.69.3). Correspondance w ~ v."}
- {lemma: mɔsɔŋan, status: attested, pos: verb, forms: [mɔsɔŋa, mɔsɔŋian, mɔsɔŋannin], gloss: {fr: "se joindre, s'unir, se liguer ; (mɔsɔŋa) réunir, faire ensemble", en: "join together, unite, ally; (mɔsɔŋa) put together, do together"}, domains: ["4.2.1", "7.5.3"], childs: {page: 253, form: "mɔ̀sɔ̀ŋàá", sense: "mix, combine, put together"}, example: JOS.10.6, note: "masaa Amoriaa … a mɔsɔŋian « les rois des Amoréens se sont ligués » (JOS.10.6) ; vanaa … mɔsɔŋan « qu'ils se joignent (à leur voisin) » (EXO.12.4) ; la mɔsɔŋa cɔloo diyɔɔ … nda cuale ndɔlen « n'égorgez pas ensemble la vache et son petit » (LEV.22.28)."}
- {lemma: muɛɛn, status: attested, pos: adv, gloss: {fr: "entièrement, tous sans exception", en: "completely, every one"}, domains: ["8.1.5", "9.2.2"], childs: {page: 253, form: "múɛ́ɛ́ŋ", sense: "all, completely"}, example: JDG.5.31, note: "Une seule occurrence : màá yaamɔaa nɔmnda cuu lende muɛɛn « que tous tes ennemis périssent ainsi » (JDG.5.31)."}
- {lemma: mulumulun, status: attested, pos: verb, forms: [mulumulu], gloss: {fr: "se rouler, se retourner (sans cesse), se tordre ; (mulumulu) faire rouler, retourner", en: "roll over, toss and turn, writhe; (mulumulu) roll, turn over"}, domains: ["7.2.1", "7.3.2"], childs: {page: 255, form: "mùlùmùlɔ̃ŋndó", sense: "roll oneself over; repeat one's words"}, example: PRO.26.14, note: "vana siɛlɛiyo mulumulun o ndu lo kpele « le paresseux se retourne sur son lit » (PRO.26.14) ; O co nɔm mulumulu « il te fera rouler » (ISA.22.18). Cf. mulio « tourner »."}
- {lemma: miun, status: attested, pos: num, forms: [miunndon], gloss: {fr: "deux (accord avec les pluriels en -on/-un : mún miun « les deux »)", en: "two (agreeing with plurals in -on/-un: mún miun, the two)"}, domains: ["8.1.1"], childs: {page: 255, form: "mùúŋ", sense: "two (ŋ class)"}, example: GEN.24.22, note: "Forme d'accord de tiɔn « deux ». kelan … mún miun « deux bracelets » (GEN.24.22) ; n'miunndon « deux (de l'autre côté) » (EXO.25.12)."}
- {lemma: mbooyaa, status: attested, pos: noun, forms: [mbooya], gloss: {fr: "potage, bouillon", en: "pottage, stew, broth"}, domains: ["5.2.3"], childs: {page: 256, form: "mbòòyàá", sense: "thin watery sauce served over rice, residue left after making palm oil"}, example: 2KI.4.38, note: "mà yowlu naa mbooyaa « fais-nous cuire un potage » (2KI.4.38)."}
- {lemma: namtanɔɔ, status: attested, pos: noun, class: o, plural: namtaa, gloss: {fr: "infirme, estropié ; personne ou animal ayant un défaut physique", en: "cripple, lame person; person or animal with a physical defect"}, domains: ["2.5.4"], childs: {page: 258, form: "nâmtàá", sense: "crippled or handicapped person"}, example: LEV.21.17, note: "vanaa sumɛiya a namtaa « les aveugles et les boiteux » (2SA.5.6). Cf. namtalen « défaut, infirmité »."}
- {lemma: naŋu, status: attested, pos: verb, forms: [naŋun], gloss: {fr: "incliner, abaisser ; (naŋun) se pencher", en: "bend down, bow (something); (naŋun) lean down, stoop"}, domains: ["7.1.5", "7.3.2"], childs: {page: 259, form: "nàŋɔ̀ɔ́", sense: "bend, be bent; tip; settle a matter secretly"}, example: PSA.18.10, note: "Mó naŋu halataalaa « il abaissa les cieux » (PSA.18.10) ; mó naŋun le tofaa « il s'est penché pour regarder » (PSA.102.20). À distinguer de naŋɔɔ « être bon »."}
- {lemma: nɛiyo, status: attested, pos: verb, gloss: {fr: "faire mal, être douloureux ; fouler, battre (le grain)", en: "hurt, be painful; tread, thresh (grain)"}, domains: ["2.5.6", "6.2.6"], childs: {page: 261, form: "nɛ̀ìyó", sense: "hurt, be in pain; step on, kick, thresh"}, example: 2KI.4.19, note: "Pua bollen le co ya nɛiyo ! « ma tête, ma tête ! (elle me fait mal) » (2KI.4.19) ; naw co maalon nɛiyo « le bœuf qui foule le grain » (DEU.25.4). À distinguer de nɛiyo « chemin »."}
- {lemma: nɛɛla, status: attested, pos: verb, gloss: {fr: "verrouiller, barrer (une porte)", en: "bolt, bar (a door)"}, domains: ["6.5.2", "7.3.6"], childs: {page: 260, form: "nɛ̀ɛ̀làá", sense: "secure, close or lock properly"}, example: 2SA.13.17, note: "mà mingi dioo nɛɛla « et verrouille la porte » (2SA.13.17) ; a yɔm ndáà nɛɛla koŋndan-ndo « avec la barre dont on fermait les portes » (JDG.16.3)."}
- {lemma: nɔɔla, status: attested, pos: verb, gloss: {fr: "être impur, devenir souillé", en: "be unclean, become defiled"}, domains: ["4.9.5", "5.6.1"], childs: {page: 264, form: "nɔ̀ɔ̀làá", sense: "soil, get dirty; make lazy"}, example: LEV.11.24, note: "vana pilan nda pɛ, vana kon nɔɔla « quiconque les touche sera impur » (LEV.11.24). Cf. nɔɔliaa « souiller » et nɔɔlɛiyo « impur »."}
- {lemma: nde, status: attested, pos: noun, gloss: {fr: "mère (terme d'adresse : « Mère ! »)", en: "mother (term of address, 'Mother!')"}, domains: ["4.1.9"], childs: {page: 267, form: "ndé"}, example: 1KI.2.20, note: "Nde, dimi sɔɛi n nɔ o kɔl-le « Ma mère, dis ce que tu as à cœur » (1KI.2.20) ; Pua nda Nde « mon père et ma mère » (1KI.19.20) ; yema ndɔ nde pilɔɔ « la fille de sa mère » (LEV.20.17). Cf. kalaa « mère »."}
- {lemma: ndeveiyo, status: attested, pos: noun, plural: ndeveila, forms: [ndeveilan], gloss: {fr: "mesure (de capacité), bath", en: "measure (of capacity), bath"}, domains: ["8.2.8"], childs: {page: 267, form: "ndéwèìyó", sense: "small measuring cup"}, example: EZK.45.11, note: "panila … a ndeveila « des épha et des bath » (LEV.19.36, EZK.45.10). Correspondance w ~ v."}
- {lemma: ŋoviŋovio, status: attested, pos: verb, forms: [ŋoviŋovi, ŋovian], gloss: {fr: "presser de tous côtés, bousculer ; (ŋovian) se bousculer", en: "press on all sides, jostle, crowd; (ŋovian) jostle one another"}, domains: ["7.7", "4.2.1"], childs: {page: 270, form: "ŋòwìó", sense: "press or lean against (repeatedly)"}, example: MRK.5.31, note: "sɛ́lɔ́ɔ́ co nɔm ŋoviŋovio « la foule te presse » (MRK.5.31) ; A co ŋovian mà kuindian te « ils ne se bousculent pas » (JOL.2.8). Cf. ŋɔvɔɔ « serrer, presser »."}
- {lemma: ŋoiyo, status: respelled, pos: noun, gloss: {fr: "crabe", en: "crab"}, domains: ["1.6.1"], keita: {form: "NHoiyo", page: 15}, childs: {page: 272, form: "ŋùèíyó"}}
- {lemma: ŋɔliŋɔliyo, status: respelled, pos: noun, gloss: {fr: "espèce d'insecte", en: "kind of insect"}, domains: ["1.6.1"], keita: {form: "NHöliNHöliyo", page: 15}, childs: {page: 270, form: "ŋɔ́líŋɔ̀líɔ́ɔ́", sense: "a kind of bee, larger than the honeybee"}, note: "Keita ne précise pas l'espèce ; l'identification avec le mot de Childs est probable."}
- {lemma: ɲangafeloo, status: attested, pos: noun, gloss: {fr: "caméléon", en: "chameleon"}, domains: ["1.6.1"], childs: {page: 275, form: "ɲàŋáféllóó"}, example: LEV.11.30, note: "Une seule occurrence, en fin de liste des reptiles impurs (LEV.11.30)."}
- {lemma: ɲavɛiyo, status: attested, pos: adj, forms: [ɲavɛi, ɲavɛiya, ɲavɛyaa], gloss: {fr: "maigre, chétif", en: "thin, lean, gaunt"}, domains: ["8.2.1", "2.4.2"], childs: {page: 275, form: "ɲàwéí-", sense: "thin, dry"}, example: GEN.41.19, note: "navaa … ɲavɛyaa « les vaches maigres » (GEN.41.4). Cf. ɲawvo « maigrir ». Correspondance w ~ v."}
- {lemma: ɲɛ-pɔmbɔ, status: attested, pos: adv, forms: [ɲɛ-pɔmbɔɔ], gloss: {fr: "un peu, un peu de ; (ɲɛ-pɔmbɔ bɛɛ) le moindre", en: "a little, a bit of; (ɲɛ-pɔmbɔ bɛɛ) the least"}, domains: ["8.1", "9.2.2"], childs: {page: 276, form: "ɲɛ̀ɛ̀mbɔ̀"}, example: GEN.18.4, note: "mɛnndan ɲɛ-pɔmbɔ « un peu d'eau » (GEN.18.4) ; Soar = « Ɲɛ-pɔmbɔɔ » (« petite chose », GEN.19.22). De ɲɛ « chose » et pɔmbɔ « petit »."}
- {lemma: ɲɛi laandui, status: attested, pos: noun, gloss: {fr: "vase, récipient, pot (en terre)", en: "vessel, container, (earthen) pot"}, domains: ["6.7.7", "5.1"], childs: {page: 276, form: "ɲɛ̀làànduéí", sense: "dish"}, example: NUM.19.15, note: "Ɲɛi laandu oo ɲɛi laandui « tout récipient » (NUM.19.15) ; o ɲɛi laandui va ŋolɔɔ-e nin « dans le récipient où l'on fait bouillir » (1SA.2.14)."}
- {lemma: ɲɛ-sɔlaa, status: attested, pos: noun, gloss: {fr: "biens, possessions, richesses ; argent, prix", en: "goods, possessions, wealth; money, price"}, domains: ["6.8.1", "6.8.6"], childs: {page: 278, form: "ɲɛ̀-sɔ̀làá", sense: "money"}, example: GEN.31.1, note: "mà hin a ɲɛ-sɔlaa taw « ils sortiront avec de grands biens » (GEN.15.14) ; pendu lɛŋnden … a ɲɛ-sɔlaa « acheter le terrain contre argent » (GEN.23.13). De ɲɛ « chose » et sɔlaa « obtenir »."}
