- {lemma: lólòó, status: attested, pos: noun, class: o, plural: lólòla, forms: [lólò], gloss: {fr: 'fiel, bile ; venin', en: 'gall, bile; venom'}, domains: ['2.1.8', '1.6.2'], childs: {page: 232, form: lólóó}, example: JOB.16.13, note: 'kɛvaa lólòla nɛyaa « serpents au venin mortel » (Dt 8,15).'}
