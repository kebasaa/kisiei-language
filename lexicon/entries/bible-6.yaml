- {lemma: lou, status: attested, pos: verb, forms: [lonin], gloss: {fr: 'rester, demeurer ; continuer (à), persister', en: 'remain, stay; keep on, persist'}, domains: ['5.9', '8.4.6'], childs: {page: 233, form: lòó, sense: 'remain, keep on; also get lost, disappear; adopt into the family'}, example: EXO.2.21, note: 'Radical lo : lo yoomu « rester en vie » ; à lo ndu dioo « ils continuèrent à le manger » (Ex 16,35). lou o diomnde … coo « rester fidèle à sa parole » (Gn 24,27).'}
