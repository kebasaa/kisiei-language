- {lemma: lolɛiyo, status: attested, pos: adj, forms: [lolɛima, lolɛiyan, lolɛilen], gloss: {fr: amer, en: bitter}, domains: ['2.3.3'], childs: {page: 231, form: lòlèí-}, example: NUM.5.18, note: 'mɛmma lolɛima « l''eau amère » (Nb 5,18).'}
- {lemma: lendulun, status: attested, pos: verb, forms: [lendulɔn], gloss: {fr: 'se vendre, se mettre en gage (comme serviteur)', en: 'sell oneself, pawn oneself (as a servant)'}, domains: ['6.8.4', '4.1.2'], childs: {page: 227, form: lèndùlɔ̀ŋndó}, example: LEV.25.39, note: 'o lendulun bɛngu « pendant le temps où il s''est vendu » (Lv 25,51).'}
