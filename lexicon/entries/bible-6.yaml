# Words of the Kisiei Bible (BKG), sixth batch (forms in k, l, m not yet in the lexicon).
# Meanings are worked out from the verse contexts. All forms follow the Kisiei Bible (BKG).

# --- Plants, food, materials
- {lemma: krenadeo, status: attested, pos: noun, class: o, plural: krenadeon, forms: [krenade, krenadelan], gloss: {fr: grenade (fruit), en: pomegranate}, domains: ['1.5.5', '5.2.3'], example: NUM.13.23, note: 'Emprunt (français grenade). Aussi motif ornemental : tuuliaa krenadeon « figures de grenades » (Ex 39,24 ; 1 R 7,18).'}
- {lemma: krenadiei, status: attested, pos: noun, class: i, plural: krenadiee, gloss: {fr: grenadier, en: pomegranate tree}, domains: ['1.5.1'], example: 1SA.14.2, note: 'yɔm krenadiee « grenadier » (1 S 14,2).'}
- {lemma: krisolite, status: attested, pos: noun, gloss: {fr: chrysolithe (pierre précieuse), en: chrysolite (precious stone)}, domains: ['5.4.1', '1.2.2'], example: EXO.28.20, note: 'Emprunt ; pow krisolite (Ez 1,16).'}
- {lemma: mandrakɔr, status: attested, pos: noun, gloss: {fr: mandragore, en: mandrake}, domains: ['1.5.3'], example: GEN.30.14, note: Emprunt.}
- {lemma: manne, status: attested, pos: noun, gloss: {fr: manne, en: manna}, domains: ['5.2.3', '4.9.4'], example: EXO.16.31, note: 'Nom donné par les Israélites à la nourriture du désert (Ex 16,31).'}
- {lemma: kúŋndo, status: attested, pos: noun, class: o, gloss: {fr: 'cruche, jarre (à huile)', en: 'jar, jug (for oil)'}, domains: ['6.7.7'], example: 1KI.17.12, note: 'Écrit kúŋndo ; ne pas confondre avec kuŋndo « grondement » (voir kuŋndan).'}

# --- Animals, body
- {lemma: kɔ́lɔ́vúloo, status: attested, pos: noun, class: o, plural: kɔ́lɔ́vúlua, forms: [kɔ́lɔ́vúlu], gloss: {fr: ours, en: bear}, domains: ['1.6.1'], example: 1SA.17.34, note: 'kɔ́lɔ́vúlu-bɛndoo « la Grande Ourse » (Jb 9,9).'}
- {lemma: kɔŋɔ, status: attested, pos: noun, plural: kɔŋɔla, gloss: {fr: 'poitrine (d''un animal de sacrifice)', en: 'breast (of a sacrificial animal), brisket'}, domains: ['1.6.2', '4.9.5'], example: LEV.7.30, note: 'kɔŋɔ saa kóndó « la poitrine du bélier » (Ex 29,26).'}
- {lemma: kusuan, status: attested, pos: noun, class: an, forms: [kusuma], gloss: {fr: 'pus ; écoulement (corporel)', en: 'pus; (bodily) discharge'}, domains: ['2.5.6', '2.2'], childs: {page: 197, form: kùsúáŋ}, example: LEV.15.2}
- {lemma: kuusuu, status: attested, pos: noun, gloss: {fr: vomissure, en: vomit}, domains: ['2.2'], example: JER.48.26, note: Cf. kuisio « vomir ».}

# --- Verbs of the body and feelings
- {lemma: kuisio, status: attested, pos: verb, forms: [kuisi], gloss: {fr: 'vomir, rejeter ; (n.) nausée', en: 'vomit, spew out; (n.) nausea'}, domains: ['2.2'], childs: {page: 192, form: kùìsìó}, example: JON.2.11, note: 'kuisio bii niaa « vous en aurez la nausée » (Nb 11,20).'}
- {lemma: kuisin, status: attested, pos: verb, forms: [kuisinin, kuisinndo], gloss: {fr: 'dégoûter, devenir odieux à ; avoir en horreur', en: 'disgust, become loathsome to; loathe'}, domains: ['3.4.2'], childs: {page: 192, form: kùìsíŋndó, sense: vomit on oneself}, example: 2SA.13.15, note: 'Moyen de kuisio « vomir » : X kuisin Y o kɔl « X devient odieux à Y » (2 S 13,15).'}
- {lemma: kusulan, status: attested, pos: verb, gloss: {fr: 'dégoûter, lasser jusqu''au dégoût', en: 'disgust, weary to the point of loathing'}, domains: ['3.4.2'], example: ECC.2.17, note: "ceendo kusulan ya « la vie m'a dégoûté » (Qo 2,17)."}
- {lemma: kɔmanndo, status: attested, pos: verb, forms: [kɔman], gloss: {fr: 'embrasser, donner un baiser', en: kiss}, domains: ['4.3.3'], example: GEN.27.26}
- {lemma: kɔɔmianndo, status: attested, pos: verb, forms: [kɔɔmian], gloss: {fr: 'embrasser, s''embrasser (avec effusion)', en: 'kiss, embrace (each other)'}, domains: ['4.3.3'], example: GEN.45.15, note: 'la yilan … a kɔɔmianndo « saluez-vous par un baiser » (Rm 16,16).'}
- {lemma: kuuliaa, status: attested, pos: verb, gloss: {fr: 'rugir ; gronder (tonnerre)', en: 'roar; thunder'}, domains: ['1.6.4', '2.3.2'], childs: {page: 198, form: kùùlìá, sense: 'shout (plural of kùlàá ''shout, cheer'')'}, example: JDG.14.5}
- {lemma: kuŋndan, status: attested, pos: verb, forms: [kuŋ, kuŋndo], gloss: {fr: 'gémir ; mugir, gronder (mer, pluie) ; (… te) ne pas dire mot', en: 'groan; roar (sea, rain); (… te) make no sound'}, domains: ['2.3.2', '3.4.2'], childs: {page: 197, form: kùŋndó, sense: 'grunt, groan; also a grunt of assent'}, example: EXO.2.23, note: 'kuŋndan et kuŋndo servent de forme longue : a va kuŋndan « ils gémissaient » (Ex 2,23) ; mɛmma … và kuŋndo « les eaux qui grondent » (Ez 1,24) ; Yakɔb kuŋ te « Jacob se tut » (Gn 34,5).'}

# --- Physical actions
- {lemma: kundɔɔ, status: attested, pos: verb, forms: [kundu], gloss: {fr: 'heurter, frapper ; encorner', en: 'strike, push against; gore, butt'}, domains: ['7.7.1', '1.6.4'], childs: {page: 195, form: kùndɔ̀ɔ́, sense: 'hit, knock, bump into; also knock on a door'}, example: EXO.21.28}
