- {lemma: kɛɛmiaa, status: attested, pos: verb, gloss: {fr: 'orner, décorer ; plaquer (d''or, d''argent)', en: 'adorn, decorate; overlay (with gold, silver)'}, domains: ['6.6.5', '5.4'], example: PRO.25.11, note: 'Moyen kɛɛmian « se parer » (Jr 4,30). Cf. kɛɛmianɔɔ « décorateur ».'}
- {lemma: kɛmikɛmiaa, status: attested, pos: verb, gloss: {fr: 'graver, sculpter (des ornements)', en: 'engrave, carve (ornaments)'}, domains: ['6.6.5', '6.6.3'], example: 1KI.7.36}
- {lemma: kuumiaa, status: attested, pos: verb, forms: [kuumiaanin], gloss: {fr: 'bourgeonner, pousser des bourgeons', en: 'bud, sprout'}, domains: ['1.5.6'], example: NUM.17.23}
- {lemma: kuundiaa, status: attested, pos: verb, gloss: {fr: 'agrandir ; élever, honorer', en: 'enlarge; exalt, honour'}, domains: ['8.2', '4.5.6'], childs: {page: 198, form: kùùndìá, sense: 'make big, fatten (plural of kùndàá ''be plentiful'')'}, example: JOS.3.7, note: 'Base de kuundian « s''enorgueillir ». lɛŋnde niaalen kuundiaa « agrandir votre territoire » (Dt 12,20).'}
