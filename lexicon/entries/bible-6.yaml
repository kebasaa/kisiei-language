- {lemma: kɛvaa, status: attested, pos: noun, gloss: {fr: serpents, en: snakes}, domains: ['1.6.1'], example: NUM.21.6, note: 'Pluriel ; le singulier n''est pas relevé. kɛvaa lólòla nɛyaa « serpents au venin mortel » (Dt 8,15).'}
- {lemma: lapi, status: attested, pos: adv, gloss: {fr: 'bien, clairement, de près', en: 'well, clearly, closely'}, domains: ['9.2.2', '2.3.1'], example: 1SA.3.2, note: 'o ve lɛ cɔ lapi le « il ne voyait plus bien » (1 S 3,2) ; tofa … lapi « regarder de près » (Ex 3,3).'}
