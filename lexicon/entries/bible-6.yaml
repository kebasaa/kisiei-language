- {lemma: kùndàá, status: attested, pos: adj, gloss: {fr: 'grand, important, honoré', en: 'great, important, honoured'}, domains: ['4.5.6'], childs: {page: 195, form: kùndàá, sense: 'be enough, be plentiful; grow fat'}, example: GEN.50.7, note: 'Écrit kùndàá dans ce sens : vanaa kùndàá « les notables » (Gn 50,7) ; vana kúndàá bɛndoo « un homme très considéré » (Ex 11,3).'}
- {lemma: lueiyo, status: attested, pos: verb, forms: [luei, lueinin], gloss: {fr: 'faire entrer, introduire, mettre dans ; causer (un malheur)', en: 'bring in, put in; cause (grief)'}, domains: ['7.3.2', '7.3.3'], childs: {page: 236, form: lùèìyó, sense: 'put in; also carry back, put away, return'}, example: GEN.19.10, note: 'Causatif de luɛyɔɔ « entrer ». luei … mɔnɛi lueiyo « causer du chagrin » (Gn 26,35). Bénéfactif lueilul « rapporter (un profit) à » (Pr 3,14).'}
