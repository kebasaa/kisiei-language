- {lemma: kudɛɛ-kudɛɛ, status: attested, pos: adv, gloss: {fr: 'très âgé, rassasié de jours', en: 'very old, full of years'}, domains: ['2.6.4'], example: GEN.25.8, note: 'yuuva fɔlɔn kudɛɛ-kudɛɛ « mourir âgé et rassasié de jours » (Gn 25,8).'}
- {lemma: kúlú, status: check, pos: ideo, gloss: {fr: 'en abondance, bien plein', en: 'abundantly, plump'}, domains: ['8.1', '9.2.8'], example: GEN.41.5, note: 'yasala … láà luɛi kúlú taw « des épis gros et beaux » (Gn 41,5) ; la luɛi kúlú « (vos récoltes) abonderont » (Dt 28,4).'}
- {lemma: latɔ́ɔ́, status: attested, pos: adj, forms: [latɔ́ɔ́a, latɔ́ɔ́lan, latɔ́ɔ́-tɔ́ɔ́], gloss: {fr: 'noble, grand, précieux', en: 'noble, great, precious'}, domains: ['4.5.6', '8.3.7'], example: JOB.3.14, note: 'vanaa latɔ́ɔ́a « les grands » (Jb 3,14). Redoublé latɔ́ɔ́-tɔ́ɔ́ : ɲɛ latɔ́ɔ́-tɔ́ɔ́ « un beau présent » (Gn 30,20) ; Hala latɔ́ɔ́-tɔ́ɔ́ « le Dieu puissant » (Is 10,21).'}
- {lemma: masa-ibungaa, status: attested, pos: noun, forms: [masa-ibunga], gloss: {fr: 'gouverneur, proconsul', en: 'governor, proconsul'}, domains: ['4.6.1'], example: LUK.2.2}
- {lemma: kɔnyaa, status: check, pos: noun, gloss: {fr: 'épidémie mortelle (nàà n''kɔnyaa « peste »)', en: 'deadly epidemic (nàà n''kɔnyaa ''pestilence'')'}, domains: ['2.5.2'], example: EXO.5.3, note: 'Seulement dans nàà n''kɔnyaa « la peste » (Ex 5,3 ; Lv 26,25).'}
- {lemma: kɔɔsallo, status: attested, pos: verb, forms: [kɔɔsal], gloss: {fr: 'accuser, intenter un procès à, plaider contre', en: 'accuse, bring a charge against, contend with'}, domains: ['4.7.5'], example: LUK.6.7, note: 'Bénéfactif de kɔɔsɔɔ « juger ».'}
- {lemma: lekáá, status: check, pos: noun, gloss: {fr: 'éloignement, exil (o lekáá « au loin, banni, perdu »)', en: 'absence, exile (o lekáá ''away, banished, lost'')'}, domains: ['7.6.3', '4.7.7'], example: 2SA.14.13, note: 'Simeɔn bɛɛ lo o lekáá « Siméon aussi n''est plus » (Gn 42,36) ; po nɔm co o lekáá-o « ton fils banni » (2 S 14,13).'}
- {lemma: lɛ, status: attested, pos: adv, gloss: {fr: 'encore ; (avec négation) ne … plus', en: 'still; (with negation) no longer, any more'}, domains: ['9.2.2', '8.4.6'], example: GEN.8.12, note: 'poonpoondo muungu lɛ ndu o ibuŋ te « la colombe ne revint plus vers lui » (Gn 8,12).'}
- {lemma: kɔngɔlanndo, status: attested, pos: verb, forms: [kɔngɔlan], gloss: {fr: 'projeter, avoir l''intention de ; chercher à (nuire)', en: 'plan, intend; seek (to harm)'}, domains: ['3.3.1'], example: GEN.27.42, note: 'Esau … co kɔngɔlanndo le pɔmbɔ ndɔ diyɔɔ « Ésaü projette de tuer son frère » (Gn 27,42) ; Mɛlɛka kɔngɔlan le kobio ho tɛɛmbuuo (Gn 19,14). Homographe : kɔngɔlan, pluriel de kɔngɔɔ « rive ».'}
- {lemma: laasi-laasi, status: attested, pos: ideo, forms: [laasi-laasio, laasi-laasian], gloss: {fr: 'dans la confusion, en désordre ; pervers', en: 'in confusion, in disarray; perverse'}, domains: ['9.2.8', '3.1.2'], childs: {page: 221, form: láásì-láásì}, example: 1SA.7.10, note: 'De laasiaa « troubler, corrompre ». yɔŋnun laasi-laasi « être mis en déroute » (1 S 7,10) ; sɔɔn laasi-laasi « paroles perverses » (Jr 15,19).'}
