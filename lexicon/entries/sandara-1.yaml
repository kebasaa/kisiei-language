# Words from Sandara Kissia (fables and proverbs, Mission protestante, Kissidougou), respelled to the Bible orthography.
# The source has no glosses: meanings are worked out from the context of the fables and proverbs.

- {lemma: "dom", status: respelled, pos: noun, gloss: {fr: "bruit, son", en: "noise, sound"}, domains: ["2.3.2"], sandara: {section: "fable 5", form: "dom"}, note: "Sens d'après le contexte : fable 5, ma pimbul a dom bɛnduo o buluraŋ niŋ « ils tombèrent avec un grand bruit dans la grotte » ; fable 9, il jette l'eau sur le feu a dom bɛnduo ; proverbe 32, tamba dom « le son du tambour » ; proverbe 76, o fura dom bɛnduo tau."}
- {lemma: "kpeleko", status: respelled, pos: noun, class: "o", forms: ["kpeleke"], gloss: {fr: "bâton, perche", en: "stick, pole"}, domains: ["6.7"], sandara: {section: "fable 1", form: "gbeleko"}, note: "Sens d'après le contexte : fable 1, le lièvre mesure le serpent contre le gbeleko (Gbeleko ho heu kɛwo bandie « ce bâton dépasse le serpent en longueur ») et l'y attache ; fable 8, l'aveugle brandit son bâton (mo hiŋ gbeleke ndɔ). Sandara écrit gb pour kp."}
- {lemma: "ta", status: check, pos: conj, gloss: {fr: "si (ta … pɛ)", en: "if (ta … pɛ)"}, domains: ["9.2.5"], sandara: {section: "fable 1", form: "ta"}, note: "Sens d'après le contexte : ta … pɛ « si » (fable 1, A ta tyɛl pɛ mi tuu nia « s'il se couche, nous mesurerons » ; fable 18, ta tyi pɛ do « s'il voit de la nourriture » ; proverbes 26, 54, 69). Correspond à te … pɛ de la Bible ; Sandara emploie aussi ti … pɛ. Peut-être contraction de te/ti + a. Homographe de ta « ils, elles » (Lexique)."}
- {lemma: "awa", status: respelled, pos: interj, gloss: {fr: "eh bien, alors (en tête de phrase)", en: "well, so (sentence-initial)"}, domains: ["9.2.7", "9.6.3"], sandara: {section: "fable 4", form: "Awa"}, note: "Sens d'après le contexte : ouvre une nouvelle étape du récit (fable 4, Awa, o laŋ nɔm nɔ ho lebɛŋgu ni « Eh bien, cette année c'est vous qui avez le bas » ; fable 17, Awa, mi tɔmndo dimul wɛindo…). Sans doute emprunt (malinké awa « bon, d'accord ») ; absent de la Bible."}
- {lemma: "ɲɔ", status: check, pos: det, gloss: {fr: "un certain, quelque (vana ɲɔ « quelqu'un, un certain homme »)", en: "a certain, some (vana ɲɔ 'someone, a certain man')"}, domains: ["9.2.3", "9.1.3"], sandara: {section: "fable 2", form: "nyɔ"}, note: "Sens d'après le contexte : fable 16, mi wana nyɔ wa yonda tau « un certain homme… » ; fable 17, lɔ pum mi wana nyɔ hun a tundo « un jour un homme vint avec un chien » ; fable 2, mo fɛya nyɔ loŋ « il défricha un peu (?) là ». Pluriel probable ɲɔn « des choses » (nyɔŋ, fable 1 ; proverbe 66). Homographe de ɲɔ « temps » (Lexique)."}
