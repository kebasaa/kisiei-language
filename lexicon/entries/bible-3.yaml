- {lemma: vanndo, status: attested, pos: noun, class: o, plural: vannda, forms: [van], gloss: {fr: 'personne, homme (être humain)', en: 'person, human being'}, domains: ['2', 4.1.2], lexique: {page: 60, form: vanndo}, terminologie: {list: langue, number: 303, form: Vanndo}, childs: {page: 381, form: wàŋndó}, example: GEN.27.42, note: 'Académie des langues (terminologie, langue n° 303) : « personne » (grammaire).'}
