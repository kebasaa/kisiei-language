# Words found by going through Childs (2000), A Dictionary of the Kisi Language (Southern Kissi),
# printed pages 141-210, and looking for the corresponding northern word in the Kisiei Bible (BKG).
# Forms and glosses follow the Bible; Childs's headword and page are recorded in `childs`, and a
# Southern sense that adds to or differs from the gloss in `childs.sense`.

- {lemma: kalaa, status: attested, pos: adj, forms: [kalalen, kalan, kalale], gloss: {fr: "même, lui-même, en personne ; tout entier", en: "itself, the very (one); whole, entire"}, domains: ["9.2.1", "9.3"], childs: {page: 144, form: "kálà-", sense: "indeed, very, particular, itself"}, example: GEN.6.16, note: "Intensif qui s'accorde avec le nom : dɛ̀ndɛ̀ kalaa « l'arche même » (GEN.6.16) ; lɛŋnde kalalen « le pays lui-même » (LEV.18.25) ; mɛmma kalan « l'eau elle-même » (EXO.7.18) ; paalen kalale (JDG.5.31). Homographe de kalaa « mère »."}
- {lemma: kalaŋaa, status: attested, pos: verb, forms: [kalaŋan, kalaŋanin, kalaŋanndo], gloss: {fr: "être déterré, mis à nu, retourné ; arracher, faire sortir", en: "be dug up, laid bare, turned up; pull out, bring up"}, domains: ["7.8.6", "7.3.2"], childs: {page: 145, form: "kàlàŋndó", sense: "(middle of 'dig up') be dug up, uprooted"}, example: 2SA.22.16, note: "lɛŋnde tumnden le kalaŋan « les fondements du monde furent mis à nu » (2SA.22.16) ; Hala kalaŋanin mun ndu o dembe « Dieu les fera sortir de son ventre » (JOB.20.15). Cf. kalaa « déterrer »."}
- {lemma: keeku, status: attested, pos: verb, forms: [keekan], gloss: {fr: "faire passer, conduire à travers", en: "lead through, make pass through"}, domains: ["7.2.4", "7.3.3"], childs: {page: 151, form: "kèèkòó", sense: "pass through or by; experience; repeat"}, example: PSA.106.9, note: "Mó keeku nda o lɛŋnde va o mɛmndan bɛngu len « il les conduisit à travers l'abîme » (PSA.106.9). Keita (p. 52) : « Vèènè n keeku yè ma bolin ? » (passer)."}
- {lemma: keenduu, status: attested, pos: verb, forms: [keendun], gloss: {fr: "cueillir, arracher, dépouiller (fruits, feuilles) ; (keendun) tomber (cheveux)", en: "pick off, strip off (fruit, leaves); (keendun) fall out (hair)"}, domains: ["6.2.5", "7.3.2"], childs: {page: 152, form: "kèèndùùwó", sense: "pick (many fruits), plural of 'pick, pluck'; (middle) drop, fall"}, example: DAN.4.11, note: "La keenduu pei ndɔɛi kpow « arrachez tout son feuillage » (DAN.4.11) ; keenduu kpɔ̀nyɔ̀la « vendanger les grappes » (REV.14.18) ; yiiŋii … keendun « les cheveux tombent » (LEV.13.40). Cf. kiɔndɔɔ « cueillir »."}
- {lemma: kefii, status: attested, pos: noun, class: i, plural: kefon, forms: [kefun], gloss: {fr: "dard, aiguillon (d'insecte) ; (kefun) balle (du grain)", en: "sting, stinger (of an insect); (kefun) chaff"}, domains: ["1.6.2", "6.2.6"], childs: {page: 153, form: "kèfèí", sense: "rice chaff, husks; stinger of an insect"}, example: 1CO.15.55, note: "Òó piɔ́mndo, ɔ́ɔ̀ kefii nɔmnde ? « Ô mort, où est ton aiguillon ? » (1CO.15.55) ; puiye a kefon « des queues et des dards » (REV.9.10) ; maa kefun hoeiye kɔandu « comme la balle que le vent emporte » (HOS.13.3)."}
- {lemma: kɛɛsiaa, status: attested, pos: verb, gloss: {fr: "décider, résoudre, projeter", en: "decide, resolve, plan"}, domains: ["3.3.1"], childs: {page: 159, form: "kèèsìá"}, example: ISA.14.27, note: "Mɛlɛka … kɛɛsiaa lende ni « c'est le Seigneur qui l'a décidé » (ISA.14.27). Le nom kɛɛsuula, kɛɛsuulan « projets, desseins » (PSA.33.10-11, JOB.5.12) en est dérivé."}
- {lemma: kɛndia, status: attested, pos: noun, gloss: {fr: "santé, bien-être ; paix, sécurité ; (muungu kɛndia) revenir sain et sauf", en: "health, well-being; peace, safety; (muungu kɛndia) come back safe and sound"}, domains: ["2.5", "4.8.4"], childs: {page: 161, form: "kéndíá", sense: "health, general well-being, being at peace with the ancestors"}, example: GEN.28.21, note: "mì muungu kɛndia fuɲa nuu o ibuŋ « si je reviens en paix chez mon père » (GEN.28.21) ; O co kɛndia le « il n'est pas bien » (1SA.19.14). Cf. kɛndɔɔ « bon »."}
- {lemma: kɛsɛ-kɛsɛ, status: attested, pos: adv, forms: [kɛsɛ-kɛsɛi], gloss: {fr: "vraiment, réellement, le vrai ; (parent) proche", en: "truly, really, the very one; (relative) close, own"}, domains: ["9.2.2"], childs: {page: 161, form: "késé", sense: "actual, real, the very, main"}, example: GEN.28.17, note: "Nanu ndu kɛsɛ-kɛsɛ Cɛi-Hala-o co nanu « c'est vraiment ici la maison de Dieu » (GEN.28.17) ; vanayɛi ndɔɛi kɛsɛ-kɛsɛi « ses proches parents » (LEV.21.2)."}
- {lemma: kiindiaa, status: attested, pos: verb, forms: [kiindian], gloss: {fr: "fermer (plusieurs portes) ; (kiindian) s'enfermer", en: "shut, close (several doors); (kiindian) shut oneself in"}, domains: ["7.3.6"], childs: {page: 163, form: "kììndíá", sense: "close (plural action of 'close')"}, example: JDG.3.23, note: "Mí Ehud kiindiaa diolan kpow « Ehud ferma toutes les portes » (JDG.3.23) ; Má kiindian diolan kɔɔli « ils fermèrent les portes derrière eux » (JDG.9.51). Pluriel verbal de kinda « fermer »."}
- {lemma: kiisuu, status: attested, pos: verb, gloss: {fr: "allumer (le feu)", en: "kindle (a fire)"}, domains: ["5.5"], childs: {page: 164, form: "kììsùùwó", sense: "kindle, start a fire; restart an argument"}, example: MAL.1.10, note: "la kue lɛnin yinnden kiisuu o fonda-loamaa-lasálà nuu coo fondo fúú le « vous n'allumerez plus en vain le feu sur mon autel » (MAL.1.10) ; yinnde vana kíísúú le len « un feu qu'on n'a pas allumé » (JOB.20.26)."}
- {lemma: kììyo, status: attested, pos: noun, gloss: {fr: "lie (du vin)", en: "dregs, lees"}, domains: ["5.2.3"], childs: {page: 164, form: "kììyó", sense: "dregs of palm wine"}, example: PSA.75.9, note: "kol man a kììyo kpede « en boire jusqu'à la lie » (PSA.75.9) ; maa mɔiyan ma cal o kììyo coo « comme le vin reposant sur sa lie » (JER.48.11)."}
- {lemma: kikil, status: attested, pos: noun, gloss: {fr: "cercle, voûte", en: "circle, vault"}, domains: ["8.3.1"], childs: {page: 164, form: "kíkílló", sense: "traditional round house with a cone-shaped roof; cone"}, example: ISA.40.22, note: "Ndu co icali o kikil lelɛŋndo bollen ni « il siège au-dessus du cercle de la terre » (ISA.40.22). Une seule occurrence."}
- {lemma: kindɔɔ, status: attested, pos: verb, gloss: {fr: "tendre, bander (l'arc)", en: "stretch, draw (a bow)"}, domains: ["6.4.1", "7.3.4"], childs: {page: 168, form: "kìndɔ̀ɔ́", sense: "stretch out (a rope), strain, make an effort"}, example: PSA.11.2, note: "vanaa kɔlvesɛiya co kpaasiaala ndalan kindɔɔ « les méchants bandent leurs arcs » (PSA.11.2) ; kpaasiaa idaɲaa kindɔɔ « tendre l'arc de bronze » (PSA.18.35)."}
- {lemma: konaa, status: attested, pos: noun, gloss: {fr: "nouvelles, récit, compte rendu ; (ɲuna … konaa) demander compte", en: "news, report, account; (ɲuna … konaa) call to account"}, domains: ["3.5.1"], childs: {page: 175, form: "kónáá", sense: "message, news, explanation"}, example: 2SA.11.18, note: "le ndu konaa downɔnndo « pour lui faire le récit (de la bataille) » (2SA.11.18) ; i ɲunanin konaa le man « je demanderai compte de votre sang » (GEN.9.5)."}
- {lemma: kolokoloo, status: attested, pos: noun, plural: kolokololan, forms: [kolokolo], gloss: {fr: "coin de rue, angle ; (pl.) carrefours, places", en: "corner, street corner; (pl.) street corners, open places"}, domains: ["8.6.3", "6.5.4"], childs: {page: 173, form: "kòlòkòlóó", sense: "corner, space between two houses"}, example: PRO.7.8, note: "mó kei o kolokoloo pum ikɛi « il passa près de l'angle (de sa rue) » (PRO.7.8) ; o kolokololan kpow ikɛi « à tous les coins de rue » (PRO.7.12)."}
- {lemma: koondan, status: attested, pos: verb, forms: [koondannin], gloss: {fr: "accrocher, faire trébucher ; saisir (le talon) ; arracher", en: "catch, trip up; seize (by the heel); snatch away"}, domains: ["7.3.4", "7.2.1"], childs: {page: 179, form: "kòòndǎŋndó", sense: "get caught, entangled (middle of 'scrape off, take from')"}, example: HOS.12.4, note: "Yakɔb koondan bɛ ndɔ pelei « Jacob saisit le talon de son frère » (HOS.12.4) ; ɲɛ-ɲɛ a keinin koondan ma del te « ton pied ne heurtera rien » (PRO.3.23) ; O koondannin nɔm « il t'arrachera » (PSA.52.7)."}
- {lemma: koondiaa, status: attested, pos: verb, forms: [koondiaanin], gloss: {fr: "balayer, entraîner ; ramasser", en: "sweep away, drag along; gather up"}, domains: ["7.3.2", "7.5.1"], childs: {page: 179, form: "kòòndìá", sense: "scrape up, take away (plural)"}, example: REV.12.4, note: "mó va kundaa pilɔɔ koondiaa a puile ndɔlen « sa queue entraînait le tiers des étoiles » (REV.12.4) ; vana-vana kɔ koondiaanin nɔm le « personne ne te ramassera » (EZK.29.5)."}
- {lemma: kovɔɔlan, status: attested, pos: noun, gloss: {fr: "moisson, temps de la moisson", en: "harvest, harvest time"}, domains: ["6.2.5", "8.4.1"], childs: {page: 181, form: "kòùwɔ̀ɔ̀láŋ"}, example: JHN.4.35, note: "o lo paangon n'hiɔɔlu le kovɔɔlan tiiyaa « encore quatre mois et vient la moisson » (JHN.4.35). Nom dérivé de kovɔɔ « moissonner »."}
- {lemma: kɔɔfiaa, status: attested, pos: verb, forms: [kɔɔfiaanin], gloss: {fr: "embaumer, préparer (un mort) ; fermer les yeux (d'un mourant)", en: "embalm, prepare (a dead body); close the eyes (of the dying)"}, domains: ["2.6.6"], childs: {page: 186, form: "kɔ̀ɔ̀fìá", sense: "kill off (a dying person or animal), mercy-kill; prepare a dead body; also rot"}, example: GEN.50.2, note: "le ndu kɔɔfiaa « pour l'embaumer » (GEN.50.2) ; Yosɛf kɔɔfiaanin nɔm ni mò kinda nɔm hɔltan « Joseph te fermera les yeux » (GEN.46.4)."}
- {lemma: kɔɔfɛɛ, status: attested, pos: noun, plural: kɔɔfɛɛlan, gloss: {fr: "chaudron, grande marmite", en: "cauldron, large cooking pot"}, domains: ["5.1", "6.7.7"], childs: {page: 187, form: "kɔ̀ɔ̀fíɔ̀ɔ́", sense: "large iron cooking pot"}, example: 1SA.2.14, note: "o va ikpɛɛnɛ, o va kɔɔfɛɛ, o va ibonyu « dans la marmite, le chaudron ou le pot » (1SA.2.14) ; o kɔɔfɛɛlan nin (2CH.35.13). Pluriel chez Childs kɔ̀ɔ̀féèláŋ."}
- {lemma: kuɛi, status: attested, pos: noun, class: i, gloss: {fr: "pauvreté, misère", en: "poverty, hardship"}, domains: ["6.8", "4.4.2"], childs: {page: 191, form: "kùéí", sense: "poverty, hardship, heavy toil"}, example: LEV.25.25, note: "Te kuɛi tol pɛ puapilɛ niaa coo « si ton frère devient pauvre » (litt. « si la pauvreté tombe sur… », LEV.25.25)."}
- {lemma: kuendio, status: attested, pos: verb, gloss: {fr: "rafler, emporter (tout)", en: "carry off, take away (everything)"}, domains: ["7.3.3", "7.4.3"], childs: {page: 191, form: "kùèndìó", sense: "scoop up, draw, take (plural of 'scoop up')"}, example: 1SA.23.1, note: "A co ɲɛm co o kpelela lɔaa n'maltan coo-on kuendio « ils pillent les aires de battage » (1SA.23.1). Une seule occurrence ; sens déduit du contexte. Cf. kɔndɔɔ « puiser, prendre »."}
- {lemma: kuindian, status: attested, pos: verb, forms: [kuindianndo, kuindiannin], gloss: {fr: "se heurter, se bousculer ; se pousser (l'un l'autre)", en: "knock against each other, jostle; push each other"}, domains: ["7.7.1"], childs: {page: 191, form: "kùìndìáŋ-", sense: "knock into each other (plural middle of 'hit')"}, example: JOL.2.8, note: "A co ŋovian mà kuindian te « ils ne se bousculent pas » (JOL.2.8) ; Mɛɛ pɛndua va kuindianndo ndu o dembe « comme les jumeaux se heurtaient dans son sein » (GEN.25.22)."}
- {lemma: kuindikuindi, status: attested, pos: verb, forms: [kuindikuindinin], gloss: {fr: "frapper à coups répétés, rouer de coups ; encorner", en: "strike repeatedly, beat; gore"}, domains: ["7.7.1", "4.8.2"], childs: {page: 192, form: "kùìndìkùìndìó"}, example: MAT.26.67, note: "má kuindikuindi ndu « ils le frappèrent à coups de poing » (MAT.26.67) ; a leelan ndan n kuindikuindinin vanaa cɔvaa Aramiia « avec ces cornes tu frapperas les Araméens » (1KI.22.11). Cf. kundɔɔ « heurter »."}
- {lemma: kùisiei, status: attested, pos: noun, class: i, forms: [kuisii], gloss: {fr: "rasoir", en: "razor"}, domains: ["6.7.1", "5.4.3"], childs: {page: 192, form: "kùìsìéí"}, example: NUM.6.5, note: "kùisiei bɛnda mì i kei ndu o lebol te « le rasoir ne passera pas sur sa tête » (NUM.6.5) ; sendinin a kuisii « raser avec un rasoir » (ISA.7.20)."}
- {lemma: kuilul, status: attested, pos: verb, forms: [kuil, kuilu], gloss: {fr: "multiplier, rendre nombreux ; enrichir, combler", en: "multiply, make numerous; enrich, fill with good things"}, domains: ["8.1.4"], childs: {page: 192, form: "kùìyó", sense: "be plentiful; also be mashed; harvest"}, example: GEN.17.2, note: "mì kuilul nɔm polale nɔmnden taw « je multiplierai beaucoup ta descendance » (GEN.17.2) ; mó kuilu nɔm ɲɛ-ɲɛ co ɲɛ kɛndɔɔ (JOB.36.16). Childs donne la base kùìyó « abonder »."}
- {lemma: kulaa, status: attested, pos: verb, forms: [kula, kulanndo], gloss: {fr: "rugir, gronder, crier", en: "roar, shout"}, domains: ["3.5.1", "1.6.4"], childs: {page: 193, form: "kùlàá", sense: "shout, yell; cheer or jeer"}, example: JER.6.23, note: "A co kulaa maa mɛmma ihɛl « leur voix gronde comme la mer » (JER.6.23) ; a kula pɛ « quand ils rugissent » (ISA.5.29, lions)."}
- {lemma: kulon, status: attested, pos: noun, gloss: {fr: "repas sacrificiels, festins (rituels)", en: "sacrificial meals, (ritual) feasts"}, domains: ["4.9.5", "4.2.2"], childs: {page: 193, form: "kùlèí kùlɔ̃ŋ", sense: "feast, party, sacrifice"}, example: NUM.25.2, note: "Pluriel. a va kulon dioo nda ndaa « ils mangeaient (les repas sacrificiels) avec eux » (NUM.25.2) ; de kulon o pembon coo « manger sur les montagnes » (EZK.18.11)."}
- {lemma: kùlúkúlù, status: attested, pos: noun, gloss: {fr: "chaleur brûlante", en: "scorching heat"}, domains: ["8.3.4"], childs: {page: 194, form: "kùlúkùlóó", sense: "heat"}, example: REV.7.16, note: "kùlúkúlù ve lɛnin nda le « aucune chaleur brûlante ne les frappera plus » (REV.7.16). Une seule occurrence."}
- {lemma: kisikisi, status: attested, pos: verb, forms: [kisikisinndo, kisikisianndo], gloss: {fr: "mordre à plusieurs reprises, dévorer, déchirer ; (kisikisinndo) se mordre ; (kisikisianndo) se mordre l'un l'autre", en: "bite repeatedly, devour, tear; (kisikisinndo) bite (one's tongue); (kisikisianndo) bite one another"}, domains: ["1.6.4", "7.8.4"], childs: {page: 171, form: "kìsìkìsìó"}, example: PSA.78.45, note: "sunbungaa kan kisikisi nda « ces mouches les dévorèrent » (PSA.78.45) ; ma kisikisi niaa « et ne vous déchirent » (MAT.7.6) ; diɛɛmuei kisikisinndo « ils se mordaient la langue » (REV.16.10) ; kisikisianndo (GAL.5.15). Pluriel verbal de kisio."}
- {lemma: kisio, status: attested, pos: verb, gloss: {fr: "piquer, mordre (insecte)", en: "sting, bite (insect)"}, domains: ["1.6.4"], childs: {page: 171, form: "kìsìó", sense: "bite, sting, pinch; also throb (of a sore)"}, example: EXO.8.14, note: "Mí muiya va vanndacieea a visia kisio « les moustiques piquaient hommes et bêtes » (EXO.8.14). Une seule occurrence."}
- {lemma: kɔsɔɔ, status: attested, pos: noun, forms: [kɔsɔ], gloss: {fr: "langueur, dépérissement ; (luɛi kɔsɔ) dépérir, se flétrir, être en deuil (terre)", en: "languor, wasting; (luɛi kɔsɔ) languish, wither, mourn (of the land)"}, domains: ["2.5.1", "1.5.6"], childs: {page: 189, form: "kɔ́sɔ̀ɔ́", sense: "sick person; (pl.) sickness, illness"}, example: JOL.1.10, note: "lɛŋnden le luɛi kɔsɔ « la terre est en deuil » (JOL.1.10) ; tumnda n'rɛsɛnndan la luɛi kɔsɔ « la vigne languit » (ISA.24.7) ; mì mal naa kɔsɔɔ luɛyɔɔ « nous sommes tous flétris » (ISA.64.6) ; dii ndu kɔsɔ « l'anéantir » (JDG.4.24)."}
- {lemma: kisɛi, status: respelled, pos: noun, class: i, forms: [kisai], gloss: {fr: "piment", en: "chili pepper"}, domains: ["1.5", "5.2.3"], keita: {form: "Kisèi - Kisai", page: 139}, childs: {page: 171, form: "kìsǎŋ kìsèí"}, note: "Keita (p. 31) : Kisèi + tyuinndo = kisɛi cuinnde."}
- {lemma: kuilio, status: respelled, pos: noun, class: o, gloss: {fr: "culotte, pantalon", en: "trousers, shorts"}, domains: ["5.3"], keita: {form: "Lèmböö ; Kuilio", page: 144}, childs: {page: 191, form: "kùìlíó kùìlíláŋ"}}
- {lemma: kosion, status: respelled, pos: noun, gloss: {fr: "cubes de bouillon", en: "bouillon cubes"}, domains: ["5.2.3"], keita: {form: "kosion", page: 126}, childs: {page: 180, form: "kósíéí kósíóŋ", sense: "bouillon cube; chicken soup"}, note: "Pluriel. Keita (p. 126) : bɛlɔɔ cua kosion o bɔlɔɔ nin « le rat a pris les cubes de bouillon dans le sac »."}
- {lemma: kundei, status: respelled, pos: noun, class: i, gloss: {fr: "motte de terre ; (parler de Guéckédou) matrice", en: "clod of earth; (Guéckédou dialect) womb"}, domains: ["1.2.1", "2.1.8"], keita: {form: "Kundei", page: 8}, childs: {page: 195, form: "kúndéí kúndóŋ", sense: "cervix"}, note: "Keita (p. 8) le cite comme exemple de mot dont le sens change selon le parler : « motte de terre » en kisiduei, « matrice » en kpekeduei (Guéckédou), sens proche de celui de Childs."}
- {lemma: kuya, status: attested, pos: adv, gloss: {fr: "en reste, laissé pour le lendemain (nourriture)", en: "left over, kept overnight (food)"}, domains: ["5.2.3", "8.4.5"], childs: {page: 201, form: "kúyá-", sense: "(of food) left standing in a container for a while, stale"}, example: EXO.12.10, note: "Te ɲɛ lɔl pɛ kuya « s'il en reste jusqu'au matin » (EXO.12.10) ; ma de kuya kon te « qu'on ne mange pas ce reste » (EXO.29.34)."}
- {lemma: kpaandian, status: attested, pos: verb, gloss: {fr: "réprimander, reprendre", en: "rebuke, reprove"}, domains: ["3.5.1", "4.7.7"], childs: {page: 202, form: "kpààndìáŋndó", sense: "intervene, interfere (to stop someone)"}, example: LUK.17.3, note: "a kpaandian ndu « reprends-le » (LUK.17.3) ; mó kpaandian nda « il les réprimanda » (LUK.9.55). Cf. kpaa « arrêter, retenir »."}
- {lemma: kpaakio, status: attested, pos: noun, gloss: {fr: "ouvrage de siège, rempart de terre (élevé contre une ville)", en: "siege ramp, earthwork (built against a city)"}, domains: ["4.8.3", "6.5.1"], childs: {page: 202, form: "kpààkíó kpààkíéí", sense: "thorny vine-like tree used to make (war) fences"}, example: JER.32.24, note: "Babilɔnnda co kpaakio tangullo le nambaa mà bii kobio « les Babyloniens élèvent des remparts pour prendre la ville » (JER.32.24, JER.33.5). Cf. aussi kpàakɔ̀ɔ́ « barrière, clôture » chez Childs."}
- {lemma: kpáfúlaa, status: attested, pos: noun, gloss: {fr: "un oiseau impur (espèce non identifiée)", en: "an unclean bird (species unidentified)"}, domains: ["1.6.1"], childs: {page: 203, form: "kpáfúláá kpáfúléí", sense: "a bird species (catches rats)"}, example: DEU.14.17, note: "Dans la liste des oiseaux impurs : yow yɔɔyaa, kpáfúlaa, hɔ̀lɔ́hɔ̀lɔ́ɔ̀ (DEU.14.17). Une seule occurrence ; un oiseau de proie d'après Childs."}
